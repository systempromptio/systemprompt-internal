[package]
name = "systemprompt-knowledge-jobs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Scheduled knowledge-capture jobs for Systemprompt Internal: IMAP email ingestion into the knowledge bank."
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
systemprompt-mcp-knowledge-bank = { workspace = true }
# The migrations.rs generated by build.rs names ::systemprompt_extension paths.
systemprompt-extension = { workspace = true }
# Audit: uses config, database, extension, traits — requires `full`.
systemprompt = { workspace = true, features = ["full"] }
sqlx = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
inventory = { workspace = true }
imap = { version = "2.4", default-features = false }
mail-parser = "0.11"
rustls = { version = "0.23", features = ["ring"] }
webpki-roots = "0.26"

[build-dependencies]
systemprompt-extension = { workspace = true }

# Job registration macros expand to ::inventory::submit! paths; machete
# cannot see macro-expansion usage.
[package.metadata.cargo-machete]
ignored = ["inventory"]

[lints]
workspace = true
