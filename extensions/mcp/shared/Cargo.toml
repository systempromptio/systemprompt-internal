[package]
name = "systemprompt-mcp-shared"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Shared utilities for the systemprompt.io template's bundled Model Context Protocol (MCP) servers."
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
# Audit: `systemprompt::mcp` (ArtifactTheme registration) is gated behind `full`.
# The three MCP crates that depend on this one already enable it, so feature
# unification means this costs nothing in a real build.
systemprompt = { workspace = true, features = ["full"] }
sqlx = { workspace = true }
inventory = { workspace = true }
# The approval gate: MRTR result types, the derived call id, and audit row ids.
rmcp = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
