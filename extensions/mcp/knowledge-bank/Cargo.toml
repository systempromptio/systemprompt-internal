[package]
name = "systemprompt-mcp-knowledge-bank"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Company knowledge-bank MCP server: meeting transcripts, documents and notes persisted on the tenant Postgres with full-text search."
repository.workspace = true
homepage.workspace = true
publish = false

# register_extension!() expands to `::inventory::submit!`; machete cannot see
# macro-expansion usage.
[package.metadata.cargo-machete]
ignored = ["inventory"]

[[bin]]
name = "systemprompt-mcp-knowledge-bank"
path = "src/main.rs"

[dependencies]
# Audit: uses database, identifiers, logging, mcp, models, system (api) — requires `full`.
systemprompt = { workspace = true, features = ["full"] }

anyhow.workspace = true
chrono.workspace = true
thiserror.workspace = true
tokio.workspace = true

rmcp.workspace = true

axum.workspace = true

schemars.workspace = true
serde.workspace = true
serde_json.workspace = true

tracing.workspace = true

# Documents live in `knowledge_documents`; every query is a compile-checked
# sqlx macro against the .sqlx offline cache.
sqlx.workspace = true
uuid.workspace = true

# The `knowledge_documents` DDL is registered with the host runtime through
# `register_extension!`, which submits to the inventory registry.
inventory.workspace = true

systemprompt-mcp-shared.workspace = true
# The Odoo projection reuses the odoo server's JSON-RPC client, per-user
# credential resolution and name resolvers rather than growing a second one.
systemprompt-mcp-odoo.workspace = true

[lints]
workspace = true
