steps:
  - script: 01-seed-report-data.sh
    label: Seed two enterprises and six months of usage
    narrative: >
      Creates Astound Digital and systemprompt as customer organizations on
      priced plans, fills them with departments and users, and writes six
      complete calendar months of metered requests across four models. Nothing
      pre-existing is touched — every row carries an rptseed- id.
    outcome: >
      The month-end reports have real history to render: growing volume, a
      cheap model carrying call count and an expensive one carrying spend.
  - script: 02-unseed-report-data.sh
    label: Restore the database
    narrative: >
      Deletes every rptseed- row, parent-last, then verifies none survived.
      Because the seed is insert-only, this is an exact restore rather than a
      cleanup that leaves residue behind.
    outcome: >
      The database is back to its pre-seed state, and the script exits non-zero
      if it is not.
  - script: 03-smoke.sh
    label: Prove both reports render and the customer copy is clean
    narrative: >
      Seeds, fetches both report pages, asserts the internal one states a
      margin and the customer one carries the department, model, and user
      breakdowns — then asserts the customer HTML contains no margin, provider
      cost, or unit-economics language at all. Restores on the way out, even
      when an assertion fails.
    outcome: >
      Two HTTP 200s and a proof that the document you send a customer carries
      none of your own numbers.
