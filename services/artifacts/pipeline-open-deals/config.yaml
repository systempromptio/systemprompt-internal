id: pipeline-open-deals
name: "Pipeline — Open Deals"
description: "Your open Salesforce opportunities as a live, refreshable table — stage, amount, close date, probability and owner. Refresh re-runs against your own Salesforce: SELECT Name, Account.Name, StageName, Amount, CloseDate, Probability, Owner.Name FROM Opportunity WHERE IsClosed = false ORDER BY CloseDate ASC LIMIT 200"
version: "1.1.0"
enabled: true
# Owning plugin — artifact only syncs when this plugin is enabled/granted.
# Seed into the global Cowork Artifacts library as a starred/global entry.
starred: true
# `category`, `tags` and `query` are forward-compatible metadata — the core
# loader ignores them today; the SOQL also lives in `description` and view.html.
category: salesforce
tags:
  - salesforce
  - opportunities
  - pipeline
  - sales
# Salesforce Hosted MCP `sobject-all` SOQL tool via the `salesforce` server
# (services/mcp/salesforce.yaml). Verified live 2026-07-20: tool `soqlQuery`, arg key `q`
  # (11-tool sobject-all set: soqlQuery/find/getObjectSchema/get*/create*/update*/delete*).
mcp_tools:
  - "mcp__salesforce__soqlQuery"
query: |
  SELECT Name, Account.Name, StageName, Amount, CloseDate, Probability, Owner.Name
  FROM Opportunity
  WHERE IsClosed = false
  ORDER BY CloseDate ASC
  LIMIT 200
# The Cowork native artifact document (raw HTML, glassmorphism table).
file: view.html
