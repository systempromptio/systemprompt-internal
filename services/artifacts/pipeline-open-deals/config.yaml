id: pipeline-open-deals
name: "Pipeline — Open Deals"
description: "Your open Odoo CRM opportunities as a live, refreshable table — stage, expected revenue, probability, creation date and salesperson. Refresh re-runs crm_lead_search against Odoo as you, so Odoo's own record rules decide what appears."
version: "2.1.1"
enabled: true
# Owning plugin — artifact only syncs when this plugin is enabled/granted.
# Seed into the global Cowork Artifacts library as a starred/global entry.
starred: true
# `category`, `tags` and `query` are forward-compatible metadata — the core
# loader ignores them today; the call also lives in `description` and view.html.
category: crm
tags:
  - odoo
  - crm
  - opportunities
  - pipeline
  - sales
# Native Odoo MCP server (services/mcp/odoo.yaml). Per-user execution: the
# caller's own Odoo login and API key are resolved in-process from the
# odoo_identity link made on /admin/profile.
mcp_tools:
  - "mcp__odoo__crm_lead_search"
query: |
  crm_lead_search
  arguments: { "limit": 100 }
  model: crm.lead
# The Cowork native artifact document (raw HTML, glassmorphism table).
file: view.html
