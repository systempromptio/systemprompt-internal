id: salesforce-cases
name: "Cases — Support Queue"
description: "Your open Salesforce cases as a live, refreshable table — subject, status, priority, account and owner. Refresh re-runs against your own Salesforce: SELECT CaseNumber, Subject, Status, Priority, Account.Name, Owner.Name FROM Case WHERE IsClosed = false ORDER BY CreatedDate DESC LIMIT 200"
version: "1.0.0"
enabled: true
plugin_id: astound-salesforce-cases
starred: true
# `category`, `tags` and `query` are forward-compatible metadata — the core
# loader ignores them today; the SOQL also lives in `description` and view.html.
category: salesforce
tags:
  - salesforce
  - cases
  - support
# Salesforce Hosted MCP `sobject-all` SOQL tool via the `salesforce` server
# (services/mcp/salesforce.yaml). Grep-replace if the live toolset differs.
mcp_tools:
  - "mcp__salesforce__run_soql_query"
query: |
  SELECT CaseNumber, Subject, Status, Priority, Account.Name, Owner.Name
  FROM Case
  WHERE IsClosed = false
  ORDER BY CreatedDate DESC
  LIMIT 200
file: view.html
