id: quotes-and-invoices
name: "Quotes & Invoices"
description: "The far end of the pipeline as a live, refreshable table: customer invoices with what is still outstanding, due date and payment state. Refresh re-runs invoice_list with unpaid_only against Odoo as you, so paid invoices drop out and Odoo's own record rules decide what appears. Pair it with sale_order_list for quotations still sitting with a customer."
version: "1.0.0"
enabled: true
# Owning plugin — artifact only syncs when this plugin is enabled/granted.
# Seed into the global Cowork Artifacts library as a starred/global entry.
starred: true
# `category`, `tags` and `query` are forward-compatible metadata — the core
# loader ignores them today; the call also lives in `description` and view.html.
category: crm
tags:
  - odoo
  - sales
  - invoices
  - quotations
  - receivables
  - cash
# Native Odoo MCP server (services/mcp/odoo.yaml). Per-user execution: the
# caller's own Odoo login and API key are resolved in-process from the
# odoo_identity link made on /admin/profile.
mcp_tools:
  - "mcp__odoo__invoice_list"
  - "mcp__odoo__sale_order_list"
query: |
  invoice_list
  arguments: { "limit": 100, "unpaid_only": true }
  model: account.move
# The Cowork native artifact document (raw HTML, glassmorphism table).
file: view.html
