id: leads-inbound-prospects
name: "Leads — Inbound Prospects"
description: "Your open Odoo CRM leads as a live, refreshable table — contact, email, stage, expected revenue, probability and salesperson. Refresh re-runs crm_lead_search against Odoo as you, so Odoo's own record rules decide what appears."
version: "2.1.0"
enabled: true
starred: true
# `category`, `tags` and `query` are forward-compatible metadata — the core
# loader ignores them today; the call also lives in `description` and view.html.
category: crm
tags:
  - odoo
  - crm
  - leads
  - prospects
# Native Odoo MCP server (services/mcp/odoo.yaml). Per-user execution: the
# caller's own Odoo login and API key are resolved in-process from the
# odoo_identity link made on /admin/profile.
mcp_tools:
  - "mcp__odoo__crm_lead_search"
query: |
  crm_lead_search
  arguments: { "limit": 100 }
  model: crm.lead
file: view.html
