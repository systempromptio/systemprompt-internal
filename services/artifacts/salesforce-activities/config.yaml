id: salesforce-activities
name: "Activities — Tasks & Meetings"
description: "Your open Salesforce tasks as a live, refreshable table — due date, type, status, who, what and owner. Refresh re-runs against your own Salesforce: SELECT Subject, ActivityDate, Type, Status, Priority, Who.Name, What.Name, Owner.Name FROM Task WHERE IsClosed = false ORDER BY ActivityDate ASC LIMIT 200"
version: "1.0.0"
enabled: true
starred: true
# `category`, `tags` and `query` are forward-compatible metadata — the core
# loader ignores them today; the SOQL also lives in `description` and view.html.
category: salesforce
tags:
  - salesforce
  - activities
  - tasks
  - meetings
# Salesforce Hosted MCP `sobject-all` SOQL tool via the `salesforce` server
# (services/mcp/salesforce.yaml). Verified live 2026-07-20: tool `soqlQuery`, arg key `q`
  # (11-tool sobject-all set: soqlQuery/find/getObjectSchema/get*/create*/update*/delete*).
mcp_tools:
  - "mcp__salesforce__soqlQuery"
query: |
  SELECT Subject, ActivityDate, Type, Status, Priority, Who.Name, What.Name, Owner.Name
  FROM Task
  WHERE IsClosed = false
  ORDER BY ActivityDate ASC
  LIMIT 200
file: view.html
