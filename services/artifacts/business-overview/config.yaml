id: business-overview
name: "Business Overview — Daily Briefing"
description: "Today's whole CRM picture in one refreshable page — pipeline by stage, this week's new leads, your overdue and due-today activities, today's calendar, tasks due this week, and the latest team notes. Refresh re-runs business_overview_data against Odoo as you."
version: "1.0.2"
enabled: true
starred: true
# `category`, `tags` and `query` are forward-compatible metadata — the core
# loader ignores them today; the call also lives in `description` and view.html.
category: crm
tags:
  - odoo
  - crm
  - briefing
  - overview
  - dashboard
# Native Odoo MCP server (services/mcp/odoo.yaml). Per-user execution: the
# caller's own Odoo login and API key are resolved in-process from the
# odoo_identity link made on /admin/profile.
mcp_tools:
  - "mcp__odoo__business_overview_data"
query: |
  business_overview_data
  arguments: {}
  model: composite (crm.lead, mail.activity, mail.message, calendar.event, project.task)
file: view.html
