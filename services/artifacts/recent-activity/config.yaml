id: recent-activity
name: "Recent Activity — Team Notes"
description: "The latest chatter across every Odoo record as a live, searchable feed — who wrote what, on which record, and when. Refresh re-runs note_search against Odoo as you, so Odoo's own record rules decide what appears."
version: "1.0.2"
enabled: true
starred: true
# `category`, `tags` and `query` are forward-compatible metadata — the core
# loader ignores them today; the call also lives in `description` and view.html.
category: crm
tags:
  - odoo
  - notes
  - chatter
  - activity
  - feed
# Native Odoo MCP server (services/mcp/odoo.yaml). Per-user execution: the
# caller's own Odoo login and API key are resolved in-process from the
# odoo_identity link made on /admin/profile.
mcp_tools:
  - "mcp__odoo__note_search"
query: |
  note_search
  arguments: { "query": "%", "limit": 50 }
  model: mail.message
file: view.html
