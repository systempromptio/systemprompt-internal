id: whoami
name: "Who Am I — Identity & Access"
description: "Who you are on this platform: account, roles and department; whether your Odoo login is linked; exactly which plugins, MCP servers and skills your role grants (the same resolver the bridge uses — what you see here is what got installed); and your own live agent sessions. Refresh re-runs comms_whoami as you."
version: "1.0.0"
enabled: true
starred: true
category: identity
tags:
  - identity
  - roles
  - access
  - odoo
  - sessions
# Team comms MCP server (services/mcp/comms.yaml), granted to every role. The
# tool is read-only and per-user: it reports the caller and nothing else, and
# never returns the Odoo API key.
mcp_tools:
  - "mcp__comms__comms_whoami"
query: |
  comms_whoami
  arguments: {}
file: view.html
