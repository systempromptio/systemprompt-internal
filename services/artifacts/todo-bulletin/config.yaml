id: todo-bulletin
name: "To-Do Bulletin"
description: "Everything waiting on the team as one live checklist: your Odoo activities (overdue first, tick to complete with feedback) and open project tasks with deadlines. Refresh re-runs activity_list and task_list against Odoo as you."
version: "1.1.1"
enabled: true
starred: true
category: collaboration
tags:
  - odoo
  - activities
  - tasks
  - todos
  - checklist
mcp_tools:
  - "mcp__odoo__activity_list"
  - "mcp__odoo__task_list"
  - "mcp__odoo__activity_complete"
query: |
  activity_list
  arguments: { "limit": 100 }
  model: mail.activity
file: view.html
