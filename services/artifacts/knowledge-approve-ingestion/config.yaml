id: knowledge-approve-ingestion
name: "Approve Ingestion — brain@ → Odoo"
description: "The approval queue between brain@ and Odoo. Each card is one inbound email and the Odoo actions proposed for it — create a lead, log the email on an existing lead or contact, schedule follow-ups. Untick actions, approve or reject; approving applies immediately as your own Odoo account and resolves the same approval row shown on /admin/governance/approvals."
version: "1.0.0"
enabled: true
starred: true
category: knowledge
tags:
  - knowledge
  - brain
  - email
  - odoo
  - approvals
  - governance
# The knowledge-bank MCP server (services/mcp/knowledge-bank.yaml). Both tools
# are admin-only inside the server; this artifact ships only in the admin plugin.
mcp_tools:
  - "mcp__knowledge-bank__proposal_list"
  - "mcp__knowledge-bank__proposal_decide"
query: |
  proposal_list
  arguments: { "status": "proposed", "limit": 100 }
  decide: proposal_decide { document_id, decision: approve|reject, exclude_actions, note }
file: view.html
