id: knowledge-feed
name: "Knowledge Feed — brain@ Inbox"
description: "Every email brain@ has captured into the knowledge bank as a live feed — sender, subject, category, where it is in the pipeline (captured, categorized, proposed, applied, skipped…) and what it became in Odoo, with links to the records. Refresh re-runs proposal_list against the knowledge bank."
version: "2.0.0"
enabled: true
starred: true
# `category`, `tags` and `query` are forward-compatible metadata — the core
# loader ignores them today; the call also lives in `description` and view.html.
category: knowledge
tags:
  - knowledge
  - brain
  - email
  - pipeline
  - feed
# The knowledge-bank MCP server (services/mcp/knowledge-bank.yaml).
mcp_tools:
  - "mcp__knowledge-bank__proposal_list"
query: |
  proposal_list
  arguments: { "limit": 200 }
  table: knowledge_documents (source = 'email', newest first)
file: view.html
