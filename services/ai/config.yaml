ai:
  default_provider: anthropic
  default_max_output_tokens: 4096
  sampling:
    enable_smart_routing: false
    fallback_enabled: true
  providers:
    # Why: the conversation_judge job and the analysis reports call the
    # process's AiService, which registers only the providers enabled here —
    # the gateway catalog alone is not enough. Both run on this provider
    # (services/scheduler/config.yaml, `conversation_judge` parameters).
    anthropic:
      enabled: true
      google_search_enabled: false
      default_model: claude-sonnet-5
    openai:
      enabled: false
      default_model: gpt-4-turbo
      google_search_enabled: false
    gemini:
      enabled: false
      default_model: gemini-2.5-flash
      google_search_enabled: false
  mcp:
    auto_discover: true
    connect_timeout_ms: 5000
    execution_timeout_ms: 30000
    retry_attempts: 3
  history:
    retention_days: 30
    log_tool_executions: true
