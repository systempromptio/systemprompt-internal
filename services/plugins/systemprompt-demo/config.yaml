plugin:
  id: systemprompt-demo
  name: "Systemprompt Demo — Governance, Live"
  description: "Trip the governance pipeline on purpose and watch it answer: a call held for a second human, a secret refused before it costs anything, a destructive tool blocked by name — then read back the audited decision trail for exactly what happened. Every beat is a real tool call; every outcome is an audit row."
  version: "4.0.0"
  # User-scoped: roles.yaml grants this plugin to [user]. This is the only
  # scope in which the beats work at all — `require_approval` and
  # `tool_blocklist` both exempt admin callers, so a demo plugin granted to
  # [admin] would show no hold and no block. Admins hold the user role too,
  # so they still see the plugin; they just must run its beats as a non-admin.
  enabled: true
  author:
    name: systemprompt.io
    email: ed@systemprompt.io
  keywords: [demo, governance, approval, secret-scan, blocklist, audit, crm]
  license: proprietary
  category: demo
  skills:
    source: explicit
    include:
      # One unified skill: pick a scenario (the held call, the refused
      # secret, the blocked tool), run it with real tool calls, then read
      # back the audited decision trail. Replaces the three narrow demo
      # skills and folds in governance_readback's mechanics for the close.
      - demonstrate_governance
  agents:
    source: explicit
    include: []
  # Named here so this plugin is self-describing, not a hidden dependency on
  # another plugin. Odoo backs the scenario tool calls (crm_lead_search/
  # create/delete, note_add, channel_post).
  mcp_servers:
    source: explicit
    include:
      - odoo
  content_sources: {}
  # No artifacts: the business dashboards ship with systemprompt-business.
  artifacts:
    source: explicit
    include: []
  # No hooks: systemprompt-business owns the session-global governance hooks.
