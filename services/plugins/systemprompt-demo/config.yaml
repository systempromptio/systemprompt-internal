plugin:
  id: systemprompt-demo
  name: "Systemprompt Enterprise Demo — Claude Force"
  description: "The staged enterprise demo (DEMO.md), steps 1–3: lead triage, an account 360, and the follow-up orchestrator — the Agentforce comparison with live numbers. Steps 4–5 (governed writes, the metered bill) ship with the admin plugin."
  version: "2.0.0"
  # User-scoped: roles.yaml grants this plugin to [user]. Steps 4–5 are
  # admin-only and therefore live in systemprompt-admin — a plugin is one
  # scope, never a mix.
  enabled: true
  author:
    name: systemprompt.io
    email: ed@systemprompt.io
  keywords: [demo, enterprise, governance, crm, analytics, agentforce]
  license: proprietary
  category: demo
  skills:
    source: explicit
    include:
      - demo_lead_triage
      - demo_account_360
      - demo_followup_orchestrator
  agents:
    source: explicit
    include: []
  # The demo runs over the same per-user servers the user plugin ships; naming
  # them here keeps this plugin self-describing, not a hidden dependency on
  # systemprompt-user being installed.
  mcp_servers:
    source: explicit
    include:
      - odoo
      - knowledge-bank
  content_sources: {}
  # No artifacts of its own: the demo opens the dashboards installed by
  # systemprompt_setup_cowork.
  # No hooks: systemprompt-commons owns the session-global governance hooks.
