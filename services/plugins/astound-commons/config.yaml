plugin:
  id: astound-commons
  name: "Astound Commons — Workspace Setup"
  description: "First-run workspace setup (installs the Salesforce dashboards into your Artifacts library) plus shared brand skills: voice, document formatting, client email, company boilerplate, and terminology"
  version: "2.0.0"
  enabled: true
  author:
    name: Astound Digital
    email: ed@tyingshoelaces.com
  keywords: [setup, onboarding, artifacts, brand, voice, formatting, email, glossary]
  license: proprietary
  category: setup
  skills:
    source: explicit
    include:
      - cowork_setup
      - apply_brand_voice
      - format_client_document
      - draft_client_email
      - company_boilerplate
      - astound_glossary
  agents:
    source: explicit
    include: []
  mcp_servers: {}
  content_sources: {}
  # The client-facing dashboards cowork_setup installs. They ride into the
  # Cowork VM as artifacts/<id>.json in this plugin's bundle — the host staging
  # dir is Cowork's own storage and is not mounted inside the VM, so a bundled
  # copy is the only channel the setup skill can actually read. The admin-*
  # dashboards belong to astound-admin, which selects them itself.
  artifacts:
    source: explicit
    include:
      - salesforce-accounts
      - salesforce-activities
      - salesforce-cases
      - salesforce-contacts
      - salesforce-leads
      - salesforce-opportunities
  # Claude Code runs plugin hooks session-globally, so the governance hooks are
  # declared once here and cover every tool call in the session. No other
  # plugin should set this — each extra owner is another govern call per tool.
  hooks:
    governance: true
