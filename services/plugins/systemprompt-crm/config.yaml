plugin:
  id: systemprompt-crm
  name: "Systemprompt CRM — Business on Odoo"
  description: "Run the business from the conversation with Odoo as the system of record: create, update, and report on CRM leads, log notes onto records, and pull a live business overview — every action executed in Odoo as the acting user."
  version: "1.1.0"
  enabled: true
  author:
    name: systemprompt.io
    email: ed@systemprompt.io
  keywords: [crm, odoo, leads, pipeline, notes, activities, briefing]
  license: proprietary
  category: crm
  skills:
    source: explicit
    include:
      - systemprompt-setup-cowork
      - crm
      - schedule_activity
  agents:
    source: explicit
    include: []
  # The native Odoo MCP server. Per-user: each caller's odoo_identity link
  # (Odoo login + personal API key) is resolved in-process, so every tool call
  # executes in Odoo as the real user and Odoo's ACLs and audit trail apply.
  mcp_servers:
    source: explicit
    include:
      - odoo
      - knowledge-bank
  content_sources: {}
  # The workspace dashboards systemprompt-setup-cowork installs. The skill's primary channel
  # is skills/systemprompt-setup-cowork/assets/artifacts/ (VM-mounted, bash-copyable); the
  # artifacts/<id>.json records this selection emits into the bundle are the
  # fallback.
  artifacts:
    source: explicit
    include:
      - business-overview
      - leads-inbound-prospects
      - pipeline-open-deals
      - recent-activity
      - todo-bulletin
      - knowledge-feed
  # Session-global governance hooks. Normally owned by systemprompt-commons —
  # each extra owner is another govern call per tool — but commons is disabled
  # for the MVP marketplace, so the sole enabled plugin carries them. Move this
  # back to systemprompt-commons when it is re-enabled.
  hooks:
    governance: true
