plugin:
  id: systemprompt-commons
  name: "Systemprompt Commons — Setup, Brand & Email"
  description: "What every role gets: the one workspace setup skill (installs every dashboard the plugins you were granted ship), the shared brand skill — voice, document formatting, company boilerplate — and outbound email that a second human approves before it leaves."
  version: "4.0.0"
  # User-scoped and shared by every role: roles.yaml grants this plugin to
  # [user], and admins hold the user role too (services/access-control/
  # odoo-roles.yaml default_roles). Skills listed here carry no rule of their
  # own — they inherit this plugin's grant.
  enabled: true
  author:
    name: systemprompt.io
    email: ed@systemprompt.io
  keywords: [setup, onboarding, artifacts, identity, brand, voice, formatting, email, approval]
  license: proprietary
  category: setup
  skills:
    source: explicit
    include:
      # Setup is one skill. It establishes the grant, branches on host (Cowork
      # dashboards, Codex gateway wiring), and is plugin-agnostic: it installs
      # the artifacts of every plugin bundle the bridge mounted, which is
      # exactly the set the signed manifest granted this user.
      - systemprompt_setup
      # One brand skill, four passes (voice, structure, boilerplate, email).
      - brand
      # Outbound email over the `email` MCP server. Everyone can draft and
      # send; nothing leaves without the drafter's in-band confirmation and a
      # second human's approval at /admin/governance/approvals. It lives here,
      # not in the demo plugin, because sending mail is a job — the demo
      # plugin merely stages the hold it produces.
      - send_email
  agents:
    source: explicit
    include: []
  # The only server a commons skill calls. Granted to `user` in roles.yaml;
  # the approval chain, not the caller's role, is what authorises a send.
  mcp_servers:
    source: explicit
    include:
      - email
  content_sources: {}
  artifacts:
    source: explicit
    include: []
  # Claude Code runs plugin hooks session-globally, so the governance hooks are
  # declared once, here, and cover every tool call in the session. No other
  # plugin may set this — each extra owner is another govern call per tool,
  # and core refuses two enabled owners at load.
  hooks:
    governance: true
    # No `comms: true`: the bridge's announcement-drain hooks (UserPromptSubmit
    # and Stop running `comms-drain`) stay uninstalled. This instance publishes
    # no announcements, so there is nothing for them to drain.
