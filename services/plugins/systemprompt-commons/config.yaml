plugin:
  id: systemprompt-commons
  name: "Systemprompt Commons — Workspace Setup"
  description: "Shared brand skills: voice, document formatting, client email, and company boilerplate"
  version: "2.0.0"
  enabled: true
  author:
    name: systemprompt.io
    email: ed@systemprompt.io
  keywords: [setup, onboarding, artifacts, brand, voice, formatting, email, glossary]
  license: proprietary
  category: setup
  skills:
    source: explicit
    include:
      - apply_brand_voice
      - format_client_document
      - draft_client_email
      - company_boilerplate
  agents:
    source: explicit
    include: []
  mcp_servers: {}
  content_sources: {}
  # Two of the Odoo CRM dashboards, so a commons-only install still gets the
  # core sales views. The full workspace set (plus business-overview,
  # recent-activity, todo-bulletin) belongs to systemprompt-crm, whose
  # systemprompt-setup-cowork skill installs them; the admin-* dashboards belong to
  # systemprompt-admin, which selects them itself.
  artifacts:
    source: explicit
    include:
      - leads-inbound-prospects
      - pipeline-open-deals
  # Claude Code runs plugin hooks session-globally, so the governance hooks are
  # declared once here and cover every tool call in the session. No other
  # plugin should set this — each extra owner is another govern call per tool.
  hooks:
    governance: true
