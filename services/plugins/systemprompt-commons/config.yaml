plugin:
  id: systemprompt-commons
  name: "Systemprompt Commons — Setup & Brand"
  description: "What every role gets: the one workspace setup skill (installs every dashboard the plugins you were granted ship), the Who Am I identity panel, team comms, and the shared brand skills — voice, document formatting, client email, company boilerplate."
  version: "3.0.0"
  # User-scoped and shared by every role: roles.yaml grants this plugin to
  # [user], and admins hold the user role too (services/access-control/
  # odoo-roles.yaml default_roles). Skills and artifacts listed here carry no
  # rule of their own — they inherit this plugin's grant.
  enabled: true
  author:
    name: systemprompt.io
    email: ed@systemprompt.io
  keywords: [setup, onboarding, artifacts, identity, brand, voice, formatting, email, glossary]
  license: proprietary
  category: setup
  skills:
    source: explicit
    include:
      # Setup. The router is what a person types ("set up systemprompt"); the
      # two host-specific skills are what it hands off to, each guarded on its
      # own host. The Cowork one is plugin-agnostic: it installs the artifacts
      # of every plugin bundle the bridge mounted, which is exactly the set the
      # signed manifest granted this user.
      - systemprompt_setup
      - systemprompt_setup_cowork
      - systemprompt_setup_codex
      - apply_brand_voice
      - format_client_document
      - draft_client_email
      - company_boilerplate
  agents:
    source: explicit
    include: []
  # Team comms carries comms_whoami, the data source of the Who Am I panel.
  mcp_servers:
    source: explicit
    include:
      - comms
  content_sources: {}
  artifacts:
    source: explicit
    include:
      - whoami
  # Claude Code runs plugin hooks session-globally, so the governance hooks are
  # declared once, here, and cover every tool call in the session. No other
  # plugin may set this — each extra owner is another govern call per tool,
  # and core refuses two enabled owners at load.
  hooks:
    governance: true
