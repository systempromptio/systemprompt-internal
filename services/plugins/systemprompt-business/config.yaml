plugin:
  id: systemprompt-business
  name: "Systemprompt Business — Run the Pipeline on Odoo"
  description: "What every signed-in user gets: read what's happening on Odoo — a business-wide brief or your own day — create and update leads against real customers, walk them to a decision, close them won or lost and raise the quotation that follows, and sweep everything outstanding one item at a time, all as you. Two live dashboards back the four skills, and both act as well as read: My Day (the briefing, what is waiting on you, and the team's chatter — tick an activity, star a task, move a lead, log a note) and Sales Pipeline (every lead and open deal — move a stage, close won or lost, log a note, schedule a follow-up)."
  version: "4.0.0"
  # User-scoped and shared by every role: roles.yaml grants this plugin to
  # [user] with default_included: true, and admins hold the user role too
  # (services/access-control/odoo-roles.yaml default_roles). The four skills
  # and seven dashboards below carry no rule of their own — they inherit this
  # plugin's grant (tests/e2e/src/manifest_roles.rs pins this).
  enabled: true
  author:
    name: systemprompt.io
    email: ed@systemprompt.io
  keywords: [odoo, crm, leads, pipeline, deals, deadlines, notes, approval, workspace, reporting, follow-up, quotations, invoices, closing]
  license: proprietary
  category: crm
  skills:
    source: explicit
    include:
      # Read-only: business-wide brief, personal "my day" brief. Never writes.
      - activity_report
      # Act: create a lead, walk & update leads (a single named change or a
      # short walk of your own open leads).
      - manage_leads
      # A guided, one-item-at-a-time sweep of everything outstanding —
      # overdue/due activities, open tasks, stale leads — that writes back
      # the moment you answer for each one.
      - pending_task
      # The other end of the pipeline: close a deal won or lost through Odoo's
      # own actions, and raise the draft quotation a win produces.
      - close_deal
  agents:
    source: explicit
    include: []
  # The server the skill calls, granted to `user` in roles.yaml. Every call
  # runs as the caller with their own Odoo login and API key; Odoo's own
  # record rules decide what they can see.
  mcp_servers:
    source: explicit
    include:
      - odoo
  content_sources: {}
  artifacts:
    source: explicit
    include:
      # The day: business_overview_data for the briefing, activity_list +
      # task_list for what is waiting, note_search for the feed, and
      # crm_stage_list to fill the stage menus. Writes back through
      # activity_complete, task_update, crm_lead_update and note_add.
      # Replaces todo-bulletin, recent-activity and business-overview.
      - my-day
      # The pipeline: crm_lead_search twice (all, then open_only — "open" is
      # two Odoo flags the row does not carry, so the difference between the
      # two answers is the only honest way to tell a won deal from an open
      # one), plus crm_stage_list and note_list on expand. Writes back through
      # crm_lead_update, crm_lead_mark_won/lost, note_add and activity_create.
      # Replaces pipeline-open-deals, upcoming-deals and
      # leads-inbound-prospects. quotes-and-invoices was retired with them.
      - sales-pipeline

  # Claude Code runs plugin hooks session-globally, so the governance hooks are
  # declared once, here, and cover every tool call in the session. No other
  # plugin may set this — each extra owner is another govern call per tool,
  # and core refuses two enabled owners at load. This plugin owns it because
  # it replaces systemprompt-commons, the previous owner.
  hooks:
    governance: true
    # No `comms: true`: the bridge's announcement-drain hooks (UserPromptSubmit
    # and Stop running `comms-drain`) stay uninstalled. This instance publishes
    # no announcements, so there is nothing for them to drain.
