plugin:
  id: astound-salesforce-opportunities
  name: "Salesforce — Sales Pipeline & Deals"
  description: "Work with your Salesforce opportunities: find deals, read your pipeline and forecast, and safely create and update deals — with a sales pipeline specialist agent"
  version: "1.0.0"
  enabled: true
  author:
    name: Astound Digital
    email: ed@tyingshoelaces.com
  keywords: [salesforce, opportunities, pipeline, sales, forecast]
  license: proprietary
  category: salesforce
  skills:
    source: explicit
    include:
      - opportunities_find
      - opportunities_report
      - opportunities_update
  agents:
    source: explicit
    include:
      - pipeline_agent
  mcp_servers:
    source: explicit
    include:
      - salesforce
  content_sources: {}
  # Default Cowork Artifacts-library entries seeded for users of this plugin.
  # The bridge artifacts transport has landed in core; binding is enforced via each
  # artifact's `plugin_id` (gate_artifacts_by_plugin). This include list is
  # forward-compatible until `PluginConfig.artifacts` exists in core.
  artifacts:
    source: explicit
    include:
      - salesforce-opportunities
