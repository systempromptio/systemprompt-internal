plugin:
  id: systemprompt-admin
  name: "Systemprompt Admin — Control Plane"
  description: "Admin-only control plane: who is using the platform, what it costs, what failed, and why. Ships the systemprompt CLI server plus governance, analytics, and operations skills, the two admin-only demo steps, and three live dashboards."
  version: "2.0.0"
  # Admin-scoped: roles.yaml grants this plugin to [admin] with
  # default_included: false. That single rule closes every skill and artifact
  # below to every other role — they carry no rule of their own, and the
  # nearest declared level of the cascade decides (core resolver). A user-role
  # manifest never carries this plugin, its skills, or its dashboards.
  # Disabling it here would hide the admin surface from admins too
  # (tests/e2e/src/manifest_roles.rs pins this).
  enabled: true
  author:
    name: systemprompt.io
    email: ed@systemprompt.io
  keywords: [admin, governance, analytics, users, audit, operations, control-plane]
  license: proprietary
  category: admin
  skills:
    source: explicit
    include:
      # Three front doors, not nine. `report` is the fleet/roster/activity
      # view, `inspect` is the per-request/per-conversation microscope, and
      # `manage_platform` is the two things that mutate live state (the stack
      # and a user's roles). They absorbed admin_user_report,
      # admin_activity_report, analytics_dashboards, inspect_ai_requests,
      # inspect_conversation, inspect_agents, inspect_mcp_and_skills,
      # manage_permissions and manage_services.
      - report
      - inspect
      - manage_platform
      - demonstrate_governance
      - systemprompt_cli
      # Control-plane first-run setup. Admin-only by this plugin's grant alone —
      # a user's manifest never carries it, so systemprompt_setup never names it
      # to them.
      - systemprompt_setup_admin
      # Enterprise demo steps 4–5 (DEMO.md): governed writes and the metered
      # bill. They run the admin CLI server, so they live with it.
      - demo_governed_operations
      - demo_command_center
  agents:
    source: explicit
    include: []
  # The admin CLI-passthrough server. Gated to the admin role three times
  # over: this plugin's rule and the server's own entity rule in
  # services/access-control/roles.yaml keep it out of a non-admin's signed
  # manifest, and oauth.scopes in services/mcp/systemprompt.yaml rejects the
  # call at runtime if it gets there anyway.
  mcp_servers:
    source: explicit
    include:
      - systemprompt
  content_sources: {}
  artifacts:
    source: explicit
    include:
      - admin-users-directory
      - admin-activity-requests
      - admin-usage-costs
  # No hooks: systemprompt-commons owns the session-global governance hooks.
