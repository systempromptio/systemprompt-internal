plugin:
  id: systemprompt-admin
  name: "Systemprompt Admin — Control Plane"
  description: "Admin-only control plane: who is using the platform, what it costs, what failed, and why. Ships the systemprompt CLI server plus governance, analytics, and operations skills, and three live dashboards."
  version: "1.0.0"
  # Enabled but admin-gated: roles.yaml grants this plugin, its skills, and the
  # systemprompt MCP server to [admin] with default_included: false, so a
  # user-role manifest never carries it. Disabling it here would hide the
  # admin surface from admins too (tests/e2e/src/manifest_roles.rs pins this).
  enabled: true
  author:
    name: systemprompt.io
    email: ed@systemprompt.io
  keywords: [admin, governance, analytics, users, audit, operations, control-plane]
  license: proprietary
  category: admin
  skills:
    source: explicit
    include:
      - admin_workspace_setup_cowork
      - admin_user_report
      - admin_activity_report
      - analytics_dashboards
      - inspect_ai_requests
      - inspect_conversation
      - manage_permissions
      - demonstrate_governance
      - inspect_agents
      - manage_services
      - inspect_mcp_and_skills
      - systemprompt_cli
      # Enterprise demo, admin steps 4–5 (DEMO.md). Steps 1–3 ride
      # systemprompt-crm; these two are admin-gated in roles.yaml.
      - demo_governed_operations
      - demo_command_center
  agents:
    source: explicit
    include: []
  # The admin CLI-passthrough server. Gated to the admin role twice over: an
  # entity rule in services/access-control/roles.yaml keeps it out of a
  # non-admin's signed manifest, and oauth.scopes in services/mcp/systemprompt.yaml
  # rejects the call at runtime if it gets there anyway.
  mcp_servers:
    source: explicit
    include:
      - systemprompt
  content_sources: {}
  # Dashboards seeded into the Cowork Artifacts library for users of this
  # plugin. Selection is plugin-driven (core's selected_artifact_ids), so an
  # artifact reaches a client only if a selected plugin names it here.
  artifacts:
    source: explicit
    include:
      - admin-users-directory
      - admin-activity-requests
      - admin-usage-costs
  # No hooks: systemprompt-commons owns the session-global governance hooks, and
  # each extra owner is another govern call per tool.
