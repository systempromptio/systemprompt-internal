plugin:
  id: astound-salesforce-activities
  name: "Salesforce — Tasks, Calls & Meetings"
  description: "Work with your Salesforce activities: find what's due and overdue, read your day and week at a glance, and safely log calls, set follow-ups, and schedule meetings — with a tasks and meetings specialist agent"
  version: "1.0.0"
  enabled: true
  author:
    name: Astound Digital
    email: ed@tyingshoelaces.com
  keywords: [salesforce, activities, tasks, calendar, meetings]
  license: proprietary
  category: salesforce
  skills:
    source: explicit
    include:
      - activities_find
      - activities_report
      - activities_update
  agents:
    include:
      - activity_agent
  mcp_servers:
    source: explicit
    include:
      - salesforce
  content_sources: {}
  # Default Cowork Artifacts-library entries seeded for users of this plugin.
  # The bridge artifacts transport has landed in core; binding is enforced via each
  # artifact's `plugin_id` (gate_artifacts_by_plugin). This include list is
  # forward-compatible until `PluginConfig.artifacts` exists in core.
  artifacts:
    source: explicit
    include:
      - salesforce-activities
