plugin:
  id: systemprompt-workspace
  name: "Systemprompt Workspace — My Day on Odoo"
  description: "What every signed-in user gets from Odoo: their own to-do list (activities and tasks, tick to complete), the open pipeline, upcoming deals grouped by tag and ordered by close date, and the team's recent notes — four live dashboards and one skill that reads them into a short brief. Every call runs as you; Odoo's record rules decide what appears."
  version: "1.0.0"
  # User-scoped and shared by every role: roles.yaml grants this plugin to
  # [user] with default_included: true, and admins hold the user role too.
  # The skill and the four dashboards below carry no rule of their own — they
  # inherit this plugin's grant (tests/e2e/src/manifest_roles.rs pins this).
  enabled: true
  author:
    name: systemprompt.io
    email: ed@systemprompt.io
  keywords: [workspace, odoo, crm, todo, activities, tasks, pipeline, deals, deadlines, notes]
  license: proprietary
  category: productivity
  skills:
    source: explicit
    include:
      # Read-only: opens the four dashboards and runs their queries into one
      # "my day" brief. Completing an activity goes through the To-Do
      # Bulletin's own tick, never through this skill.
      - my_workspace
  agents:
    source: explicit
    include: []
  # The only server this plugin calls. Granted to `user` in roles.yaml; every
  # call is executed as the caller with their own Odoo login and API key.
  mcp_servers:
    source: explicit
    include:
      - odoo
  content_sources: {}
  artifacts:
    source: explicit
    include:
      # activity_list + task_list, with activity_complete as the tick.
      - todo-bulletin
      # note_search: the chatter the brain@ pipeline and the team post.
      - recent-activity
      # crm_lead_search open_only: the live open pipeline table.
      - pipeline-open-deals
      # crm_lead_search open_only, sort deadline: grouped by tag, due first.
      - upcoming-deals
  # No hooks: systemprompt-commons owns the session-global governance hooks.
