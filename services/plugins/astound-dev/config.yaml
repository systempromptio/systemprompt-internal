plugin:
  id: astound-dev
  name: "Development — Commerce Cloud Workflow"
  description: "Astound's development workflow for Salesforce Commerce Cloud / Storefront Next projects: plan (open spec & architecture), build (Storefront Next conventions), release (commits & PRs), and test (Playwright verification)"
  version: "1.0.0"
  enabled: true
  author:
    name: Astound Digital
    email: ed@tyingshoelaces.com
  keywords: [development, storefront-next, commerce-cloud, playwright, workflow]
  license: proprietary
  category: development
  skills:
    source: explicit
    include:
      - dev_plan
      - dev_build
      - dev_release
      - dev_test
  agents:
    source: explicit
    include: []
  mcp_servers:
    source: explicit
    include:
      - salesforce
      - knowledge-bank
  content_sources: {}
