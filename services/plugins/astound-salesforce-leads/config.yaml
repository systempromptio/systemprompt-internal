plugin:
  id: astound-salesforce-leads
  name: "Salesforce — Leads & Prospects"
  description: "Work with your Salesforce leads: find and filter prospects, read your funnel insights, and safely capture and update leads — with a leads specialist agent"
  version: "1.0.0"
  enabled: true
  author:
    name: Astound Digital
    email: ed@tyingshoelaces.com
  keywords: [salesforce, leads, prospects, sales, marketing]
  license: proprietary
  category: salesforce
  skills:
    source: explicit
    include:
      - leads_find
      - leads_report
      - leads_update
  agents:
    source: explicit
    include:
      - lead_agent
  mcp_servers:
    source: explicit
    include:
      - salesforce
  content_sources: {}
  # Default Cowork Artifacts-library entries seeded for users of this plugin.
  # The bridge artifacts transport has landed in core; binding is enforced via each
  # artifact's `plugin_id` (gate_artifacts_by_plugin). This include list is
  # forward-compatible until `PluginConfig.artifacts` exists in core.
  artifacts:
    source: explicit
    include:
      - salesforce-leads
