plugin:
  id: astound-salesforce-accounts
  name: "Salesforce — Accounts & Customers"
  description: "Work with your Salesforce accounts: find customers, get a 360° briefing before a call, and safely create and update account records — with an account specialist agent"
  version: "1.0.0"
  enabled: true
  author:
    name: Astound Digital
    email: ed@tyingshoelaces.com
  keywords: [salesforce, accounts, customers, sales, briefing]
  license: proprietary
  category: salesforce
  skills:
    source: explicit
    include:
      - accounts_find
      - accounts_report
      - accounts_update
  agents:
    source: explicit
    include:
      - account_agent
  mcp_servers:
    source: explicit
    include:
      - salesforce
  content_sources: {}
  # Default Cowork Artifacts-library entries seeded for users of this plugin.
  # The bridge artifacts transport has landed in core; binding is enforced via each
  # artifact's `plugin_id` (gate_artifacts_by_plugin). This include list is
  # forward-compatible until `PluginConfig.artifacts` exists in core.
  artifacts:
    source: explicit
    include:
      - salesforce-accounts
