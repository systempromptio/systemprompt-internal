plugin:
  id: astound-salesforce-cases
  name: "Salesforce — Support Cases"
  description: "Work with your Salesforce support cases: find cases, read your queue and backlog, and safely create and update cases — with a support case specialist agent"
  version: "1.0.0"
  enabled: true
  author:
    name: Astound Digital
    email: ed@tyingshoelaces.com
  keywords: [salesforce, cases, support, service, escalation]
  license: proprietary
  category: salesforce
  skills:
    source: explicit
    include:
      - cases_find
      - cases_report
      - cases_update
  agents:
    source: explicit
    include:
      - case_agent
  mcp_servers:
    source: explicit
    include:
      - salesforce
  content_sources: {}
  # Default Cowork Artifacts-library entries seeded for users of this plugin.
  # The bridge artifacts transport has landed in core; binding is enforced via each
  # artifact's `plugin_id` (gate_artifacts_by_plugin). This include list is
  # forward-compatible until `PluginConfig.artifacts` exists in core.
  artifacts:
    source: explicit
    include:
      - salesforce-cases
