mcp_servers:
  comms:
    type: internal
    binary: systemprompt-mcp-comms
    package: comms
    port: 5060
    # Shelved 2026-08-28: the team-messaging surface is off until it is worth
    # shipping. Nothing is deleted — flip this back to true, re-enable the
    # team-inbox and whoami artifacts and the team_chat skill, and it returns.
    enabled: false
    display_in_web: false
    description: "Team comms — addressed messages between people and their agent sessions. @user reaches an inbox and never interrupts; @user/session-handle reaches one running session; #channel reaches a channel."
    oauth:
      required: true
      scopes: [user]
      audience: mcp
      client_id: null
