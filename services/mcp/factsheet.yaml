# Factsheet MCP server.
#
# ONE TEMPLATE, ONE DESIGN SYSTEM. Every factsheet this instance can produce —
# the executive briefing, the economics sheet, the sheet written for a named
# lead — is the same Handlebars template over the same stylesheet, driven by a
# typed content model. Sheets are data (storage/files/factsheet/sheets/*.yaml),
# not documents, which is why a sheet for a specific customer needs no code: you
# read the closest existing sheet, change the blocks that differ, and render.
#
# That property is the whole reason this server exists. The sheets used to be
# eleven standalone HTML files with the design system copy-pasted into each one,
# rendered by a script outside the product. Nothing could generate a sheet for a
# lead, and nothing could keep the eleven consistent. Consolidating them onto one
# template is what makes both possible.
#
# RENDERING is WeasyPrint, in a subprocess. Its layout engine is Python and has
# no Rust binding, and the alternative — reimplementing the design system in a
# Rust PDF library — would mean re-authoring the whole house style and living
# with the visual drift. The subprocess is kept as thin as it can be: it reads
# finished HTML on stdin and writes a PDF. It holds no template, no content and
# no brand knowledge. Point FACTSHEET_PYTHON at an interpreter that has
# WeasyPrint installed.
#
# OUTPUT lands in the files domain: bytes under the storage root, a row carrying
# mime type, size, checksum and originating context, and a public URL. Rendered
# PDFs are deliberately not inlined into artifacts — artifact file parts are
# base64 text with no size guard and no populated URI.
#
# RBAC: granted to the `user` role in roles.yaml. Rendering a sheet reads no
# business data and reaches no third party, so there is nothing here to gate
# beyond authentication. Sending one to a customer is a different act, and that
# is gated where it happens — on the email server.

mcp_servers:
  factsheet:
    type: internal
    binary: systemprompt-mcp-factsheet
    package: factsheet
    port: 5070
    enabled: true
    # Spawned with a cleared environment; this is the passthrough allowlist.
    # Optional — the server falls back to `python3` on PATH.
    env_vars:
      - FACTSHEET_PYTHON
    display_in_web: true
    description: "Factsheets — render the house sheet template to a branded PDF from sheet data"
    oauth:
      required: true
      scopes:
      - user
      audience: mcp
      client_id: null
