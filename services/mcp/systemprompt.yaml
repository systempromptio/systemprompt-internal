mcp_servers:
  systemprompt:
    type: internal
    binary: systemprompt-mcp-agent
    package: systemprompt
    port: 5010
    # Disabled 2026-08-07: the CLI-executor surface is not wanted on managed
    # clients for now. The extension code stays; flip this back to re-enable.
    enabled: false
    display_in_web: false
    removable: false
    description: Systemprompt MCP Server - Execute CLI commands (admin only)
    oauth:
      required: true
      scopes:
      - admin
      audience: mcp
      client_id: null
