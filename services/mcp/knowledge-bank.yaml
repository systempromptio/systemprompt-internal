# Company knowledge bank MCP server.
#
# A persistent, first-party knowledge bank — not a stub and not a proxy. Its
# documents live in `knowledge_documents` on the tenant Postgres, one row per
# uploaded meeting transcript, document or note, indexed by a stored
# `tsvector` generated from title + content. `search_project_context` ranks
# with `websearch_to_tsquery` / `ts_rank_cd` and returns `ts_headline`
# snippets; it falls back to substring matching when the English tokenizer
# yields no lexemes, and to a newest-first listing when the query is empty.
#
# The bank starts EMPTY. There are no seeded fixtures: a knowledge bank that
# answers with invented context is worse than one that answers with nothing.
# Everything curated in it arrived through `upload_document`, which lands a
# document in `status = 'reference'` — outside the brain@ pipeline (the
# categorization job claims `raw`) and readable company-wide.
#
# Schema ownership lives with the crate — `extensions/mcp/knowledge-bank/
# schema/01_knowledge_documents.sql`, registered via `register_extension!` and
# additionally applied at server startup, since this server is its own process
# and cannot assume the host binary has migrated on its behalf.
#
# The bank is also where brain@systemprompt.io lands. The knowledge jobs
# capture and categorize inbound mail into `knowledge_documents`; the
# `proposal_*` tools here expose the pipeline — every email with its state and
# proposed Odoo projection — and `proposal_decide` applies an approved
# projection to Odoo as the calling admin's own linked account. Which is why
# ODOO_URL / ODOO_DB are passed through: the server is spawned with a cleared
# environment (core's process::spawner allowlist), exactly as odoo.yaml does.
#
# RBAC: the server is granted to the user role (roles.yaml), because what that
# grant opens is the reads — `search_project_context` and `list_documents` —
# and a non-admin's reads are filtered in-process to `status = 'reference'`,
# the curated documents. Captured mail is never `reference`, so it never
# reaches a user, and the filter is default-deny: a status a future pipeline
# introduces stays invisible until someone deliberately curates a document
# into it. `upload_document` and every `proposal_*` tool additionally require
# the admin role inside the server, against the authenticated user — the same
# double-gate pattern the admin surface uses, off the same `is_admin` the read
# scope reads. Uploads are attributed to the authenticated caller
# (`uploaded_by`), never to a value taken from the payload.

mcp_servers:
  knowledge-bank:
    type: internal
    binary: systemprompt-mcp-knowledge-bank
    package: knowledge-bank
    port: 5030
    enabled: true
    env_vars:
      - ODOO_URL
      - ODOO_DB
    display_in_web: true
    description: "Company knowledge bank — meeting transcripts, documents and notes with full-text search"
    oauth:
      required: true
      scopes:
      - user
      audience: mcp
      client_id: null
