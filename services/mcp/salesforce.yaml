# Salesforce *Hosted* MCP Server (remote, runs as the authenticated user).
#
# This registers Salesforce's official Hosted MCP endpoint as an `external` MCP
# server. The Hosted endpoint is an OAuth resource server: it requires a
# Salesforce bearer carrying the `mcp_api` scope on every tool call. systemprompt
# banks that per-user bearer at "Sign in with Salesforce" time (see
# services/web/config/salesforce.yaml + the extension's token accessor at
# GET /api/public/salesforce/token) and core's external-MCP client injects it.
#
# INTEGRATION GATE: enabling this requires (a) core's external-MCP client to
# attach the per-user Salesforce bearer for a Salesforce-backed server instead
# of the systemprompt JWT, and (b) an org with Hosted MCP turned on. Core's half
# (external_auth bearer injection) is in place; the `external_auth` block below
# is what trips core onto that path — with it absent core forwards the
# systemprompt JWT instead of calling the per-user token accessor.
#
# `oauth` below is the *systemprompt* gate (who on this platform may reach the
# server), NOT the Salesforce scopes — those live in salesforce.yaml. With
# `external_auth` set the client always picks the external() path, so oauth is
# left non-gating here to avoid double-gating auth.
#
# Multiple Hosted toolsets = one entry each (same external_auth, different
# endpoint + name): add e.g. salesforce-metadata / salesforce-agentforce /
# salesforce-models once their exact Setup Server URLs are known, and add each
# new name to a plugin's mcp_servers.include.

mcp_servers:
  salesforce:
    type: external
    # External servers are not spawned locally; binary/package are unused.
    binary: ""
    package: null
    # Nominal — external servers are reached at `endpoint`, not a local port.
    port: 5020
    # The Salesforce Hosted MCP URL — copy the exact Server URL from Setup after
    # enabling the server. Pattern:
    #   prod:    https://api.salesforce.com/platform/mcp/v1/platform/<server>
    #   sandbox: https://api.salesforce.com/platform/mcp/v1/sandbox/<server>
    endpoint: "https://api.salesforce.com/platform/mcp/v1/platform/sobject-all"
    # Disabled until the real Hosted-MCP Server URL, an org with Hosted MCP
    # enabled, and SALESFORCE_PRIVATE_KEY are in place. NOTE: core's lifecycle
    # start_server currently spawns *every* enabled server with no
    # McpServerType::External branch, so enabling this before that core fix
    # crashes startup with "Permission denied" (it tries to exec the empty
    # binary path). Re-enable once core skips spawning external servers.
    enabled: false
    display_in_web: true
    description: "Salesforce Hosted MCP — SObject CRUD/SOQL (runs as the signed-in user)"
    # Trips core onto the external-auth path: instead of forwarding the
    # systemprompt JWT, core calls token_endpoint with the user JWT and injects
    # the returned per-user Salesforce bearer as `<header>: <scheme> <token>`.
    external_auth:
      token_endpoint: "/api/public/salesforce/token"   # relative, rooted '/'
      header: "Authorization"                           # default
      scheme: "Bearer"                                  # default
    oauth:
      required: false        # external_auth governs auth now; avoid double-gating
      scopes:
      - user
      audience: mcp
      client_id: null
