# Microsoft Teams inbound surface (dev tenant).
#
# Registers a Teams bot as a first-class inbound protocol surface, peer to the
# gateway, MCP, and Slack. A Bot Framework activity is verified against its
# Bot Connector token, mapped to a federated systemprompt user, authorized
# against RBAC, dispatched to an A2A agent, and answered back as an Adaptive
# Card — with the full audit trail every other surface gets. Handled by the
# `systemprompt-teams` core extension; this file is the binding descriptor.
#
# SECRETS: the app password (client secret) is NEVER stored here. The `*_ref`
# value names a key resolved env-var-first, then from the active profile's
# secrets.json (gitignored) — same pattern as Slack (services/slack/dev.yaml).
# Set:
#   - TEAMS_APP_PASSWORD  / secrets.json "teams_app_password"
#
# MESSAGING ENDPOINT (point the Azure Bot registration at this; astound runs on
# :8080, expose via a tunnel for a real bot):
#   Bot messaging POST https://<public>/api/v1/teams/messages

teams_apps:
  astound-dev:
    # Entra (Azure AD) tenant id (Azure portal → Entra ID → Overview). Replace
    # with the real tenant id before pointing a live bot at this deployment.
    tenant_id: "00000000-0000-0000-0000-000000000000"

    # Microsoft App (bot) id — the audience inbound activity tokens must carry,
    # and the client_id for outbound Bot Connector token acquisition.
    app_id: "00000000-0000-0000-0000-000000000000"

    app_password_ref: "teams_app_password"

    # Disabled: this instance defines no A2A agents, and a Teams message can
    # only be dispatched to one. Re-enabling requires defining an agent under
    # services/agents/ and naming it in default_agent below.
    enabled: false

    # Must resolve to a real agent id in services/agents/. No agents are
    # defined, so this is a placeholder held for the re-enable path above —
    # core requires the field, but never dispatches while enabled is false.
    default_agent: "associate_agent"

    # Optional conversation/command → agent overrides. Keys are conversation ids
    # or slash commands; values are agent ids. Empty = always default_agent.
    routing: {}

    authz:
      # Role granted to federated Teams users. The tenant is authorized against
      # this role, seeded automatically from allowed_roles at boot.
      allowed_roles: ["user"]
