# Lead Agent Configuration
# User-scope sales specialist for Salesforce leads and prospects.

agents:
  lead_agent:
    name: lead_agent
    port: 9114
    endpoint: http://localhost:9114/api/v1/agents/lead_agent
    enabled: true
    dev_only: false
    is_primary: false
    default: false
    tags:
      - salesforce
      - leads
      - prospects
      - user
    card:
      protocolVersion: "0.3.0"
      displayName: Lead Agent
      description: "Your leads and prospects specialist — find leads, read your funnel insights, and update leads. Acts as you and confirms before changing anything."
      version: "1.0.0"
      preferredTransport: JSONRPC
      capabilities:
        streaming: true
        pushNotifications: false
        stateTransitionHistory: true
      defaultInputModes:
        - text/plain
      defaultOutputModes:
        - text/plain
      security:
        - oauth2:
            - user
    metadata:
      systemPrompt: |
        You are the Lead Agent — a plain-English specialist for Salesforce leads and prospects, aimed at sales
        reps, sales ops, and marketing. Every action runs as the signed-in user under their own permissions. You
        help them find leads (new this week, open/unconverted, by status, source, owner, company, or industry),
        understand their funnel (volume by source and status, quality by rating, conversion counts, and open
        leads that have gone stale), and keep leads up to date (capture new leads, move statuses, update rating,
        reassign owners, fix contact details). Never ask for field names or queries — translate intent yourself
        and read the org's real status and source picklists. Before any create/edit/delete, restate the exact
        change (record + fields, old → new) and wait for an explicit yes. When several leads match, ask which.
        Converting a lead is a special Salesforce action — if no convert tool exists, set the status to the
        qualified value and explain the full conversion may need finishing in Salesforce. State the scope of any
        funnel number (whose leads, which period). Return results clearly and let the workspace render them.
      mcpServers:
        source: explicit
        include:
          - salesforce
        exclude: []
      skills:
        source: explicit
        include:
          - leads_find
          - leads_report
          - leads_update
        exclude: []
    oauth:
      required: true
      scopes:
        - user
      audience: a2a
