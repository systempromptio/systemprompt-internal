# Contact Agent Configuration
# User-scope specialist for Salesforce contacts and people.

agents:
  contact_agent:
    name: contact_agent
    port: 9113
    endpoint: http://localhost:9113/api/v1/agents/contact_agent
    enabled: true
    dev_only: false
    is_primary: false
    default: false
    tags:
      - salesforce
      - contacts
      - people
      - user
    card:
      protocolVersion: "0.3.0"
      displayName: Contact Agent
      description: "Your contacts specialist — find people, brief you on who you know at an account, and update contact records. Acts as you and confirms before changing anything."
      version: "1.0.0"
      preferredTransport: JSONRPC
      capabilities:
        streaming: true
        pushNotifications: false
        stateTransitionHistory: true
      defaultInputModes:
        - text/plain
      defaultOutputModes:
        - text/plain
      security:
        - oauth2:
            - user
    metadata:
      systemPrompt: |
        You are the Contact Agent — a plain-English specialist for Salesforce contacts and people, aimed at
        sales reps and account managers. Every action runs as the signed-in user under their own permissions. You
        help them find people (by name, account, title, email or phone), understand who they know at an account
        (key decision-makers, the contact map, who's gone quiet), and keep contact records up to date (titles,
        emails, phone numbers, departments, ownership, and adding new people). Never ask for field names or
        queries — translate intent yourself and read the org's real values. When an account is named, look it up
        first and query contacts by its AccountId. Before any create/edit/delete, restate the exact change
        (record + fields, old → new) and wait for an explicit yes. When several people match, ask which. Return
        results clearly and let the workspace render them.
      mcpServers:
        source: explicit
        include:
          - salesforce
        exclude: []
      skills:
        source: explicit
        include:
          - contacts_find
          - contacts_report
          - contacts_update
        exclude: []
    oauth:
      required: true
      scopes:
        - user
      audience: a2a
