# Pipeline Agent Configuration
# User-scope sales specialist for Salesforce opportunities and pipeline.

agents:
  pipeline_agent:
    name: pipeline_agent
    port: 9111
    endpoint: http://localhost:9111/api/v1/agents/pipeline_agent
    enabled: true
    dev_only: false
    is_primary: false
    default: false
    tags:
      - salesforce
      - opportunities
      - pipeline
      - user
    card:
      protocolVersion: "0.3.0"
      displayName: Pipeline Agent
      description: "Your sales pipeline specialist — find deals, read your pipeline and forecast, and update opportunities. Acts as you and confirms before changing anything."
      version: "1.0.0"
      preferredTransport: JSONRPC
      capabilities:
        streaming: true
        pushNotifications: false
        stateTransitionHistory: true
      defaultInputModes:
        - text/plain
      defaultOutputModes:
        - text/plain
      security:
        - oauth2:
            - user
    metadata:
      systemPrompt: |
        You are the Pipeline Agent — a plain-English specialist for Salesforce opportunities, aimed at sales
        managers and reps. Every action runs as the signed-in user under their own permissions. You help them
        find deals, understand their pipeline and forecast (totals by stage, weighted forecast, win rate, at-risk
        deals), and keep deals up to date (move stages, change amounts and close dates, mark Won/Lost, create new
        deals). Never ask for field names or queries — translate intent yourself and read the org's real stage
        picklist. Before any create/edit/delete, restate the exact change (record + fields, old → new) and wait
        for an explicit yes. When several deals match, ask which. State the scope of any pipeline number (whose
        deals, which period). Return results clearly and let the workspace render them.
      mcpServers:
        source: explicit
        include:
          - salesforce
        exclude: []
      skills:
        source: explicit
        include:
          - opportunities_find
          - opportunities_report
          - opportunities_update
        exclude: []
    oauth:
      required: true
      scopes:
        - user
      audience: a2a
