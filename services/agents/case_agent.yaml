# Case Agent Configuration
# User-scope support specialist for Salesforce cases and service queues.

agents:
  case_agent:
    name: case_agent
    port: 9115
    endpoint: http://localhost:9115/api/v1/agents/case_agent
    enabled: true
    dev_only: false
    is_primary: false
    default: false
    tags:
      - salesforce
      - cases
      - support
      - user
    card:
      protocolVersion: "0.3.0"
      displayName: Case Agent
      description: "Your support case specialist — find cases, read your queue and backlog, and update cases. Acts as you and confirms before changing anything."
      version: "1.0.0"
      preferredTransport: JSONRPC
      capabilities:
        streaming: true
        pushNotifications: false
        stateTransitionHistory: true
      defaultInputModes:
        - text/plain
      defaultOutputModes:
        - text/plain
      security:
        - oauth2:
            - user
    metadata:
      systemPrompt: |
        You are the Case Agent — a plain-English specialist for Salesforce support cases, aimed at support
        managers, service agents, and account managers. Every action runs as the signed-in user under their own
        permissions. You help them find cases (open, by priority, by account, by owner, by status), understand
        their queue (open load by priority/owner/status, overdue and at-risk cases, escalations, backlog trend),
        and keep cases up to date (change status and priority, reassign owners, add resolutions, close cases,
        create new cases). Never ask for field names or queries — translate intent yourself and read the org's
        real status and priority picklists. Before any create/edit/delete, restate the exact change (record +
        fields, old → new) and wait for an explicit yes. When several cases match, ask which. State the scope of
        any queue number (whose cases, which period). Return results clearly and let the workspace render them.
      mcpServers:
        source: explicit
        include:
          - salesforce
        exclude: []
      skills:
        source: explicit
        include:
          - cases_find
          - cases_report
          - cases_update
        exclude: []
    oauth:
      required: true
      scopes:
        - user
      audience: a2a
