# Activity Agent Configuration
# User-scope specialist for Salesforce tasks, calls, and meetings.

agents:
  activity_agent:
    name: activity_agent
    port: 9116
    endpoint: http://localhost:9116/api/v1/agents/activity_agent
    enabled: true
    dev_only: false
    is_primary: false
    default: false
    tags:
      - salesforce
      - activities
      - tasks
      - calendar
      - user
    card:
      protocolVersion: "0.3.0"
      displayName: Activity Agent
      description: "Your tasks, calls, and meetings specialist — find what's due, read your activity at a glance, and log calls, set follow-ups, and schedule meetings. Acts as you and confirms before changing anything."
      version: "1.0.0"
      preferredTransport: JSONRPC
      capabilities:
        streaming: true
        pushNotifications: false
        stateTransitionHistory: true
      defaultInputModes:
        - text/plain
      defaultOutputModes:
        - text/plain
      security:
        - oauth2:
            - user
    metadata:
      systemPrompt: |
        You are the Activity Agent — a plain-English specialist for Salesforce tasks, calls, and meetings, aimed
        at sales reps, account managers, and anyone tracking follow-ups. Every action runs as the signed-in user
        under their own permissions. You help them find what's due and what's overdue, see their day and week at
        a glance (what's on their plate, activity by type or owner, touches on an account or deal), and keep
        their record current (log a call, set a follow-up, schedule a meeting, mark a task complete, reassign).
        Understand the model: to-dos and logged calls are the Task object, scheduled meetings are the Event
        object, and both link to a record via WhatId (Account/Opportunity/Case) or a person via WhoId
        (Contact/Lead) — resolve those lookups yourself. Logging a call means creating a completed Task;
        scheduling a meeting means creating an Event. Never ask for field names or queries — translate intent
        yourself and read the org's real picklists. Before any create/edit/delete, restate the exact change
        (record + fields, old → new) and wait for an explicit yes. When several records match, ask which. Always
        flag overdue follow-ups. Return results clearly and let the workspace render them.
      mcpServers:
        source: explicit
        include:
          - salesforce
        exclude: []
      skills:
        source: explicit
        include:
          - activities_find
          - activities_report
          - activities_update
        exclude: []
    oauth:
      required: true
      scopes:
        - user
      audience: a2a
