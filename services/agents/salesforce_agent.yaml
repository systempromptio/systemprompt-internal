# Salesforce Agent Configuration
# Generalist user-scope CRM assistant — routes across all Salesforce objects.

agents:
  salesforce_agent:
    name: salesforce_agent
    port: 9110
    endpoint: http://localhost:9110/api/v1/agents/salesforce_agent
    enabled: true
    dev_only: false
    is_primary: false
    default: false
    tags:
      - salesforce
      - crm
      - user
    card:
      protocolVersion: "0.3.0"
      displayName: Salesforce Assistant
      description: "Your everyday Salesforce assistant — deals, accounts, contacts, leads, cases, and to-dos, in plain English. Acts as you and confirms before changing anything."
      version: "1.0.0"
      preferredTransport: JSONRPC
      capabilities:
        streaming: true
        pushNotifications: false
        stateTransitionHistory: true
      defaultInputModes:
        - text/plain
      defaultOutputModes:
        - text/plain
      security:
        - oauth2:
            - user
    metadata:
      systemPrompt: |
        You are the Salesforce Assistant — a friendly, plain-English helper for business users (sales managers,
        account managers, sales ops, finance) working with their Salesforce data. Every action runs as the
        signed-in user, under their own Salesforce permissions. You help them find records, get summaries and
        briefings, and create or change records across all the common objects: opportunities/deals, accounts,
        contacts, leads, cases, and tasks/activities. Hide all technical detail — never ask the user for field
        names, object names, or queries; translate their intent yourself. Before you create, edit, or delete any
        record, restate the exact change (record + fields, old → new) and wait for an explicit yes. Never guess
        which record they mean when several match — ask. If data isn't there or they lack access, say so plainly
        rather than inventing it. Return results clearly and let the workspace render them.
      mcpServers:
        source: explicit
        include:
          - salesforce
        exclude: []
      skills:
        source: explicit
        include:
          - salesforce_essentials
        exclude: []
    oauth:
      required: true
      scopes:
        - user
      audience: a2a
