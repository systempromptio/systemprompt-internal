content_sources:
  documentation:
    path: content/documentation
    source_id: documentation
    category_id: documentation
    enabled: true
    description: Documentation and guides
    allowed_content_types:
    - guide
    - reference
    - tutorial
    - docs
    - feature
    branding:
      name: Documentation
      description: Guides and reference documentation
      image: /files/images/logo.png
      keywords: docs, documentation, guides
    indexing:
      clear_before: false
      recursive: true
    sitemap:
      enabled: true
      url_pattern: /documentation/{slug}
      priority: 0.7
      changefreq: weekly
      fetch_from: database
      parent_route:
        enabled: false
        url: /documentation
        priority: 0.9
        changefreq: daily
categories:
  documentation:
    name: Documentation
    slug: documentation
  pages:
    name: Pages
    slug: pages
metadata:
  default_author: systemprompt.io
  language: en
  structured_data:
    organization:
      name: systemprompt.io
      url: https://systemprompt.io
      logo: https://systemprompt.io/files/images/logo.png
      description: Self-hosted AI governance infrastructure. Systemprompt Internal is the AI and communication layer over Odoo.
    article:
      type: BlogPosting
      language: en-US
      article_section: Technology
