content_sources:
  blog:
    path: content/blog
    source_id: blog
    category_id: blog
    enabled: true
    description: Blog articles and announcements
    allowed_content_types:
    - blog
    branding:
      name: Blog
      description: Articles and updates
      image: /images/blog/og-default.png
      keywords: blog, articles, announcements, guides
    indexing:
      clear_before: false
      recursive: true
    sitemap:
      enabled: true
      url_pattern: /blog/{slug}
      priority: 0.8
      changefreq: weekly
      fetch_from: database
      parent_route:
        enabled: true
        url: /blog
        priority: 0.9
        changefreq: daily
  documentation:
    path: content/documentation
    source_id: documentation
    category_id: documentation
    enabled: true
    description: Documentation and guides
    allowed_content_types:
    - guide
    - reference
    - tutorial
    - docs
    - feature
    branding:
      name: Documentation
      description: Guides and reference documentation
      image: /files/images/logo.png
      keywords: docs, documentation, guides
    indexing:
      clear_before: false
      recursive: true
    sitemap:
      enabled: true
      url_pattern: /documentation/{slug}
      priority: 0.7
      changefreq: weekly
      fetch_from: database
      parent_route:
        enabled: false
        url: /documentation
        priority: 0.9
        changefreq: daily
categories:
  blog:
    name: Blog
    slug: blog
  documentation:
    name: Documentation
    slug: documentation
  pages:
    name: Pages
    slug: pages
metadata:
  default_author: Astound Digital
  language: en
  structured_data:
    organization:
      name: Astound Digital
      url: https://astounddigital.com
      logo: https://astounddigital.com/files/images/logo.png
      description: Global digital commerce and AI-powered experience consultancy
    blog:
      type: Blog
      name: Insights
      url: https://astounddigital.com/blog
      description: Insights on digital commerce, AI, and experience transformation
      article_section: Technology
      language: en-US
    article:
      type: BlogPosting
      language: en-US
      article_section: Technology
