marketplace:
  id: enterprise-demo
  name: "Systemprompt Internal — Business on Odoo"
  description: "The AI and communication layer for running the business, with Odoo as the system of record: one setup for every role, plain-English assistants for CRM leads, notes and business reporting, shared brand skills, and the admin control plane."
  version: "6.0.0"
  visibility: public
  author:
    name: systemprompt.io
    email: ed@systemprompt.io
  keywords:
    - odoo
    - crm
    - leads
    - sales
    - productivity
  license: proprietary
  access:
    default_included: true
    roles: [user]
    justification: "Public Odoo CRM productivity workspace for signed-in users"
  # One scope per plugin, declared by its entity_type: plugin rule in
  # services/access-control/roles.yaml: commons and user are [user] (shared by
  # every role — admins hold the user role too); admin is [admin]. The demo
  # plugin is gone: DEMO.md now drives the real skills instead of a parallel
  # set that re-narrated them.
  plugins:
    include:
      - systemprompt-commons
      - systemprompt-user
      - systemprompt-admin
  mcp_servers:
    source: explicit
    include:
      - odoo
      - systemprompt
      - email
    exclude: []
  # No agents are published by this marketplace. Plugins ship skills, the
  # Odoo MCP server, and artifacts only.
  agents:
    include: []
