marketplace:
  id: enterprise-demo
  name: "Astound Digital — Salesforce Productivity"
  description: "A Salesforce-first workspace: plain-English assistants for your deals, accounts, contacts, leads, cases, and to-dos. One plugin per common object, each bundling skills, a specialist agent, and the Salesforce MCP server."
  version: "3.0.0"
  visibility: public
  author:
    name: Astound Digital
    email: ed@tyingshoelaces.com
  keywords:
    - salesforce
    - sales
    - crm
    - productivity
  license: proprietary
  category: salesforce
  access:
    default_included: true
    roles: [user]
    justification: "Public Salesforce productivity workspace for signed-in users"
  skills:
    include:
      - cowork_setup
      - apply_brand_voice
      - format_client_document
      - draft_client_email
      - company_boilerplate
      - astound_glossary
      - salesforce_essentials
      - opportunities_find
      - opportunities_report
      - opportunities_update
      - accounts_find
      - accounts_report
      - accounts_update
      - contacts_find
      - contacts_report
      - contacts_update
      - leads_find
      - leads_report
      - leads_update
      - cases_find
      - cases_report
      - cases_update
      - activities_find
      - activities_report
      - activities_update
  plugins:
    include:
      - astound-commons
      - astound-salesforce
      - astound-salesforce-opportunities
      - astound-salesforce-accounts
      - astound-salesforce-contacts
      - astound-salesforce-leads
      - astound-salesforce-cases
      - astound-salesforce-activities
  mcp_servers:
    source: explicit
    include:
      - salesforce
    exclude: []
  agents:
    include:
      - salesforce_agent
      - pipeline_agent
      - account_agent
      - contact_agent
      - lead_agent
      - case_agent
      - activity_agent
