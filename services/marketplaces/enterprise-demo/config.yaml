marketplace:
  id: enterprise-demo
  name: "Systemprompt Internal — Business on Odoo"
  description: "The AI layer for running the business, with Odoo as the system of record: the pipeline end to end for every role — capture a lead against a real customer, close it won or lost, raise the quotation and see what is still owed — plus a live governance demo and the admin control plane."
  version: "9.0.0"
  visibility: public
  author:
    name: systemprompt.io
    email: ed@systemprompt.io
  keywords:
    - odoo
    - crm
    - leads
    - sales
    - quotations
    - invoices
    - productivity
  license: proprietary
  # No `access:` block: who reaches this marketplace is declared once, as
  # marketplace/enterprise-demo in services/access-control/rules.yaml.
  # One scope per plugin, declared by its plugin/<id> entity in
  # services/access-control/rules.yaml: business and demo are [user] (shared
  # by every role — admins hold the user role too); admin is [admin].
  # Business carries the seven dashboards every role sees (business overview,
  # inbound leads, open pipeline, upcoming deals, recent activity, to-do
  # bulletin, quotes and invoices) and the skills that read and write them. The demo plugin
  # stages the governance verdicts with real tool calls; it is not a parallel
  # narration of the admin skills (that version was deleted once).
  plugins:
    include:
      - systemprompt-business
      - systemprompt-demo
      - systemprompt-admin
  mcp_servers:
    source: explicit
    include:
      - odoo
      - systemprompt
    exclude: []
  # No agents are published by this marketplace. Plugins ship skills, the
  # Odoo MCP server, and artifacts only.
  agents:
    include: []
