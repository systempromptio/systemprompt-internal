marketplace:
  id: enterprise-demo
  name: "Systemprompt Internal — Business on Odoo"
  description: "The AI layer for running the business, with Odoo as the system of record: pipeline management on Odoo for every role, a live governance demo, and the admin control plane."
  version: "8.0.0"
  visibility: public
  author:
    name: systemprompt.io
    email: ed@systemprompt.io
  keywords:
    - odoo
    - crm
    - leads
    - sales
    - productivity
  license: proprietary
  access:
    default_included: true
    roles: [user]
    justification: "Public Odoo CRM productivity workspace for signed-in users"
  # One scope per plugin, declared by its entity_type: plugin rule in
  # services/access-control/roles.yaml: business and demo are [user] (shared
  # by every role — admins hold the user role too); admin is [admin].
  # Business carries the six dashboards every role sees (business overview,
  # inbound leads, open pipeline, upcoming deals, recent activity, to-do
  # bulletin) and the skill that reads and writes them. The demo plugin
  # stages the governance verdicts with real tool calls; it is not a parallel
  # narration of the admin skills (that version was deleted once).
  plugins:
    include:
      - systemprompt-business
      - systemprompt-demo
      - systemprompt-admin
  mcp_servers:
    source: explicit
    include:
      - odoo
      - systemprompt
    exclude: []
  # No agents are published by this marketplace. Plugins ship skills, the
  # Odoo MCP server, and artifacts only.
  agents:
    include: []
