marketplace:
  id: enterprise-demo
  name: "Astound Digital Marketplace"
  description: "Astound Digital marketplace shipping the governance demo plugin, its skills, agents, and MCP servers."
  version: "2.0.0"
  visibility: public
  author:
    name: Astound Digital
    email: ed@tyingshoelaces.com
  keywords:
    - governance
    - demo
    - enterprise
  license: proprietary
  category: governance
  access:
    default_included: true
    roles: [user]
    justification: "Public enterprise governance evaluation demo"
  skills:
    include:
      - use_dangerous_secret
      - demonstrate_governance
      - manage_permissions
      - inspect_conversation
      - inspect_ai_requests
      - analytics_dashboards
      - inspect_agents
      - inspect_mcp_and_skills
      - manage_services
      - systemprompt_cli
      - create_rfp_response
      - create_work_order
      - create_statement_of_work
      - create_project_estimate
      - create_client_proposal
      - apply_brand_voice
      - format_client_document
      - draft_client_email
      - company_boilerplate
      - astound_glossary
  plugins:
    include:
      - astound-consultancy
      - astound-commons
  mcp_servers:
    source: explicit
    include:
      - systemprompt
    exclude: []
  agents:
    include:
      - developer_agent
      - associate_agent
