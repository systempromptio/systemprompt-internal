marketplace:
  id: enterprise-demo
  name: "Systemprompt Internal — Business on Odoo"
  description: "The AI and communication layer for running the business, with Odoo as the system of record: one setup for every role, governed outbound email, a live governance demo, every user's own workspace on Odoo, business administration over Odoo, and the admin control plane."
  version: "8.0.0"
  visibility: public
  author:
    name: systemprompt.io
    email: ed@systemprompt.io
  keywords:
    - odoo
    - crm
    - leads
    - sales
    - productivity
  license: proprietary
  access:
    default_included: true
    roles: [user]
    justification: "Public Odoo CRM productivity workspace for signed-in users"
  # One scope per plugin, declared by its entity_type: plugin rule in
  # services/access-control/roles.yaml: commons, demo and workspace are [user]
  # (shared by every role — admins hold the user role too); admin is [admin].
  # Workspace carries the four dashboards every role sees (to-do, recent
  # activity, open pipeline, upcoming deals) and the skill that reads them. The demo
  # plugin stages the governance verdicts with real tool calls; it is not a
  # parallel narration of the admin skills (that version was deleted once).
  plugins:
    include:
      - systemprompt-commons
      - systemprompt-demo
      - systemprompt-workspace
      - systemprompt-admin
  mcp_servers:
    source: explicit
    include:
      - odoo
      - systemprompt
      - email
      - factsheet
    exclude: []
  # No agents are published by this marketplace. Plugins ship skills, the
  # Odoo MCP server, and artifacts only.
  agents:
    include: []
