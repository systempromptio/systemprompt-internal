# Governance policy chain. All four stages are ENABLED (settled on 2026-08-27
# for local and production alike — the enterprise demo, DEMO.md, depends on
# them firing). To disable a stage, flip its `enabled` flag to false — never
# by deleting this file or emptying `policies`: a missing or malformed file
# falls back to GovernanceConfig::defaults(), which is all four stages
# ENABLED. Explicit `enabled: false` is the only reliable off.
#
# The gateway safety scanners are a second, independent plane — see
# services/gateway/policies.yaml. They remain switched off there.

governance:
  policies:
  - id: secret_scan
    enabled: true
    # The 32 vendor patterns (AWS, GitHub, Stripe, sk-ant-, PEM, DB URLs) are
    # fixed. The high-entropy backstop that catches prefixless keys is tunable
    # here, so one false positive no longer forces the whole stage off:
    #
    #   entropy:
    #     enabled: true    # false keeps the vendor patterns, drops the backstop
    #     min_len: 32
    #     threshold: 0.80  # Shannon entropy / the token length's ceiling
    #     allowlist:       # regexes; a matching token is never reported
    #     - '^CAIS'
    #
    # Omit the block for the built-in defaults shown above.
  - id: scope_check
    enabled: true
    admin_only_prefixes:
    - mcp__systemprompt__
  - id: tool_blocklist
    enabled: true
    patterns:
    - delete
    - drop
    - destroy
  - id: rate_limit
    enabled: true
    requests_per_window: 300
    window_secs: 60
