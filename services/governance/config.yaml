# Governance policy chain. All four original stages are ENABLED (settled on 2026-08-27
# for local and production alike — the enterprise demo, DEMO.md, depends on
# them firing). To disable a stage, flip its `enabled` flag to false — never
# by deleting this file or emptying `policies`: a missing or malformed file
# falls back to GovernanceConfig::defaults(), which is all four stages
# ENABLED. Explicit `enabled: false` is the only reliable off.
#
# `require_approval` is the fifth stage and the exception to that rule: it is
# NOT in defaults(), because a stage that blocks waiting on a human is the one
# kind of enforcement you must never inherit by accident. It holds nothing
# until `patterns` names something.
#
# The gateway safety scanners are a second, independent plane — see
# services/gateway/policies.yaml. They remain switched off there.

governance:
  policies:
  - id: secret_scan
    enabled: true
    entropy:
      enabled: true      # false keeps the vendor patterns, drops the backstop
      min_len: 32
      threshold: 0.80    # Shannon entropy / the token length's ceiling
      # Regexes; a matching token is never reported.
      #
      # `/` is a legal token character but not a token delimiter, so a whole
      # absolute path is scored as a single token. A macOS $TMPDIR —
      # /var/folders/<2>/<30 random>/T/ — is 49 chars, mixed case (the
      # trailing /T/), carries digits, and scores 0.833 against the 0.80
      # ceiling. Claude Code and OpenCode both put one in the system prompt,
      # so every request from an affected Mac was denied while tool-less
      # calls passed. core `next` carries the real fix (is_filesystem_path,
      # which re-scores each segment so key material cannot hide inside a
      # path); it is in no released core, and this repo pins 0.45.0. Drop
      # these entries when the pin reaches a release that has it.
      allowlist:
      - '^/(private/)?var/folders/'
      - '^/private/tmp/'
    # The 32 vendor patterns (AWS, GitHub, Stripe, sk-ant-, PEM, DB URLs) are
    # fixed. The high-entropy backstop that catches prefixless keys is tunable
    # here, so one false positive no longer forces the whole stage off:
    #
    #   entropy:
    #     enabled: true    # false keeps the vendor patterns, drops the backstop
    #     min_len: 32
    #     threshold: 0.80  # Shannon entropy / the token length's ceiling
    #     allowlist:       # regexes; a matching token is never reported
    #     - '^CAIS'
    #
    # Omit the block for the built-in defaults shown above.
  - id: scope_check
    enabled: true
    admin_only_prefixes:
    - mcp__systemprompt__
  - id: tool_blocklist
    enabled: true
    patterns:
    - delete
    - drop
    - destroy
  - id: rate_limit
    enabled: true
    requests_per_window: 300
    window_secs: 60
  - id: require_approval
    enabled: true
    # The outbound-facing writes on the odoo server. Everything else on that
    # server — including the other writes in the same demo step — still runs
    # unattended, so the contrast on stage is between an allowed write and a
    # held one.
    #
    # Matching here is a substring of the TOOL NAME only, so this holds every
    # `note_add` and `channel_post` call unconditionally, not just some subset
    # of them. Narrowing it to specific arguments needs argument conditioning
    # in the require_approval policy, which does not exist yet.
    #
    # `proposal_decide` (knowledge-bank) is deliberately NOT listed. The brain@
    # pipeline opens its own approval_requests row per proposal — that row IS
    # the hop, and the tool is the act of answering it. A pattern here would do
    # nothing for admins (exempt below) and would nest a second approval inside
    # the first for anyone else.
    patterns:
    - channel_post
    - note_add
    # An admin approving their own call would be a rubber stamp, not a control;
    # exempting the scope keeps the approver and the requester distinct.
    exempt_scopes:
    - admin
    # How long one round blocks before the wait is handed back to the client as
    # an MRTR round. Ten rounds is rmcp's client-side ceiling.
    hold_seconds: 60
    # How long the request stays answerable at all.
    expiry_seconds: 900
