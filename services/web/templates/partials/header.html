<a href="#main" class="sp-skip-link">Skip to main content</a>
<header class="site-header" role="banner">
  <nav class="site-nav">
    <a href="/" class="logo-link">
      <img src="/files/images/logo-dark.svg" alt="{{ORG_NAME}}" class="logo-svg logo-light" width="140" height="32" loading="eager" />
      <img src="/files/images/logo-white.svg" alt="{{ORG_NAME}}" class="logo-svg logo-dark" width="140" height="32" loading="eager" />
    </a>
    <button type="button" class="mobile-menu-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
    <div class="mobile-menu-overlay" aria-hidden="true"></div>
    <div class="nav-links">
      {{#each site.header_nav.items}}
      <a href="{{this.href}}"{{#if this.external}} target="_blank" rel="noopener noreferrer"{{/if}}>{{this.label}}</a>
      {{/each}}
      <div class="mobile-menu-docs-nav" id="mobile-docs-nav"></div>
    </div>
  </nav>
</header>
