# Navigation Configuration
# Header, footer, and documentation sidebar
#
# External links point to https://astounddigital.com.
# Local routes (/blog, /documentation, /admin/login) target the running
# template instance.

header:
  items:
    - id: solutions
      label: "Solutions"
      href: "https://astounddigital.com/solutions"
      external: true
      dropdown: true
      sections:
        - title: "Commerce & Experience"
          links:
            - label: "Commerce"
              description: "End-to-end digital commerce strategy, implementation, and optimization for global brands."
              href: "https://astounddigital.com/solutions/commerce"
              external: true
            - label: "Experience Design"
              description: "Customer experience and design services that turn journeys into measurable growth."
              href: "https://astounddigital.com/solutions/experience-design"
              external: true
            - label: "Performance Marketing"
              description: "Data-driven demand generation and performance marketing across the funnel."
              href: "https://astounddigital.com/solutions/performance-marketing"
              external: true
        - title: "AI & Modernization"
          links:
            - label: "AI & Agentforce"
              description: "AI, data, and intelligent automation — agentic solutions in production for visionary brands."
              href: "https://astounddigital.com/solutions/ai-agentforce"
              external: true
            - label: "Platform Modernization"
              description: "Platform modernization and integration across the front office."
              href: "https://astounddigital.com/solutions/modernization"
              external: true
            - label: "Revenue & Service Modernization"
              description: "Sales, service, and operations transformation that endures."
              href: "https://astounddigital.com/solutions/revenue-service-modernization"
              external: true

    - id: industries
      label: "Industries"
      href: "https://astounddigital.com/industries"
      external: true
      dropdown: true
      sections:
        - title: "Who We Serve"
          links:
            - label: "Retail & Consumer Products"
              description: "Commerce and experience transformation for retail and consumer goods brands."
              href: "https://astounddigital.com/industries/retail-consumer-products"
              external: true
            - label: "Travel & Hospitality"
              description: "Digital experiences for travel, transport, and hospitality leaders."
              href: "https://astounddigital.com/industries/travel-hospitality"
              external: true
            - label: "Manufacturing"
              description: "Manufacturing, technology, and aerospace & defense front-office solutions."
              href: "https://astounddigital.com/industries/manufacturing"
              external: true
            - label: "MedTech & Life Sciences"
              description: "Compliant digital commerce and experience for med tech and life sciences."
              href: "https://astounddigital.com/industries/medtech-life-sciences"
              external: true
            - label: "Consumer & Business Services"
              description: "Growth and transformation for consumer and business services brands."
              href: "https://astounddigital.com/industries/consumer-business-services"
              external: true

    - id: insights
      label: "Insights"
      href: "/blog"
      dropdown: false

    - id: skills
      label: "Skills"
      href: "/skills/"
      dropdown: false

    - id: resources
      label: "Resources"
      href: "/documentation/"
      dropdown: true
      sections:
        - title: "This Platform"
          links:
            - label: "Documentation"
              description: "Setup, authentication, dashboard, and governance API guides for the platform."
              href: "/documentation/"
            - label: "Getting Started"
              description: "Create your account, install the bridge, and connect your AI tools in minutes."
              href: "/#get-started"
        - title: "Astound Digital"
          links:
            - label: "AI Hub"
              description: "Astound's AI insights, perspectives, and agentic enterprise resources."
              href: "https://astounddigital.com/ai-hub"
              external: true
            - label: "Client Success"
              description: "Case studies from AllSaints, Boots Opticians, Zermatt, and more."
              href: "https://astounddigital.com/client-success"
              external: true
            - label: "About"
              description: "25+ years of digital commerce engineering. Boutique partnership, enterprise-grade impact."
              href: "https://astounddigital.com/about"
              external: true

