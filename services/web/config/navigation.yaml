# Navigation Configuration
# Header, footer, and documentation sidebar
#
# External links point to https://astounddigital.com.
# Local routes (/skills, /documentation, /admin/login) target the running
# template instance.

header:
  items:
    - id: skills
      label: "Skills"
      href: "/skills/"
      dropdown: false

    - id: how-to-use
      label: "How to use"
      href: "/#get-started"
      dropdown: false

    - id: resources
      label: "Resources"
      href: "/documentation/"
      dropdown: true
      sections:
        - title: "This Platform"
          links:
            - label: "Documentation"
              description: "Setup, authentication, dashboard, and governance API guides for the platform."
              href: "/documentation/"
            - label: "Getting Started"
              description: "Create your account, install the bridge, and connect your AI tools in minutes."
              href: "/#get-started"
        - title: "Astound Digital"
          links:
            - label: "Solutions"
              description: "Commerce, experience design, AI & Agentforce, modernization, and performance marketing."
              href: "https://astounddigital.com/solutions"
              external: true
            - label: "AI Hub"
              description: "Astound's AI insights, perspectives, and agentic enterprise resources."
              href: "https://astounddigital.com/ai-hub"
              external: true
            - label: "Client Success"
              description: "Case studies from AllSaints, Boots Opticians, Zermatt, and more."
              href: "https://astounddigital.com/client-success"
              external: true
            - label: "About"
              description: "25+ years of digital commerce engineering. Boutique partnership, enterprise-grade impact."
              href: "https://astounddigital.com/about"
              external: true

footer:
  capabilities:
    - path: "https://astounddigital.com/industries/retail-consumer-products"
      label: "Retail & Consumer Products"
      external: true
    - path: "https://astounddigital.com/industries/travel-hospitality"
      label: "Travel & Hospitality"
      external: true
    - path: "https://astounddigital.com/industries/manufacturing"
      label: "Manufacturing"
      external: true
    - path: "https://astounddigital.com/industries/medtech-life-sciences"
      label: "MedTech & Life Sciences"
      external: true
    - path: "https://astounddigital.com/industries/consumer-business-services"
      label: "Consumer & Business Services"
      external: true
  integrations:
    - path: "https://astounddigital.com/about"
      label: "About"
      external: true
    - path: "https://astounddigital.com/partners"
      label: "Partners"
      external: true
    - path: "https://astounddigital.com/client-success"
      label: "Client Success"
      external: true
    - path: "https://careers.astounddigital.com/"
      label: "Careers"
      external: true
    - path: "https://trust.astounddigital.com/"
      label: "Trust Center"
      external: true
  resources:
    - path: "/skills/"
      label: "Skills"
    - path: "/documentation/"
      label: "Documentation"
    - path: "https://astounddigital.com/ai-hub"
      label: "AI Hub"
      external: true
    - path: "https://astounddigital.com/reports"
      label: "Reports"
      external: true
    - path: "/sitemap.xml"
      label: "Sitemap"
    - path: "/admin/login"
      label: "Login"
  legal:
    - path: "https://astounddigital.com/legal/privacy-policy"
      label: "Privacy Policy"
      external: true
    - path: "https://astounddigital.com/legal/privacy-policy-us"
      label: "Privacy Policy (US)"
      external: true
    - path: "https://astounddigital.com/legal/terms-of-use"
      label: "Terms of Use"
      external: true
  contact:
    - href: "https://astounddigital.com/contact-us"
      label: "Contact Us"
    - href: "https://www.linkedin.com/company/astound-digital/"
      label: "LinkedIn"

social:
  - href: "https://www.linkedin.com/company/astound-digital/"
    type: "linkedin"
    label: "LinkedIn"

# Docs sidebar - rendered dynamically via site.docs_sidebar in templates
docs_sidebar:
  - title: "Using the Gateway"
    links:
      - label: "How to Use"
        href: "/documentation/"
      - label: "All Skills"
        href: "/skills/"

  - title: "Terminal Demos"
    links:
      - label: "Setup & Authentication"
        href: "/documentation/demo-terminal-setup"
      - label: "Governance Decisions"
        href: "/documentation/demo-terminal-agents"
      - label: "Audit Trails & Costs"
        href: "/documentation/demo-terminal-audit"
      - label: "Governance API"
        href: "/documentation/demo-terminal-governance"
      - label: "MCP Access Tracking"
        href: "/documentation/demo-terminal-mcp"
      - label: "Request Tracing & Benchmark"
        href: "/documentation/demo-terminal-tracing"
      - label: "Agent Tracing"
        href: "/documentation/demo-terminal-agent-tracing"

  - title: "Dashboard"
    links:
      - label: "Authentication & Login"
        href: "/documentation/authentication"
      - label: "Dashboard Usage"
        href: "/documentation/dashboard"
