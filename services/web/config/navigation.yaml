# Navigation Configuration
# Header, footer, and documentation sidebar
#
# External links point to https://astounddigital.com.
# Local routes (/blog, /documentation, /admin/login) target the running
# template instance.

header:
  items:
    - id: product
      label: "Product"
      href: "/#departments"
      dropdown: true
      sections:
        - title: "Salesforce, in plain English"
          links:
            - label: "Getting Started"
              description: "What the AI Salesforce Gateway is, how to ask, and the promise to confirm before every change."
              href: "/features/getting-started/"
            - label: "Sales Pipeline & Deals"
              description: "Find deals, read your forecast and what is at risk, and update opportunities safely."
              href: "/features/sales-pipeline/"
            - label: "Accounts & Customers"
              description: "360 degree account briefings before every call, plus safe record updates."
              href: "/features/accounts/"
            - label: "Contacts & People"
              description: "Contact maps, decision-makers per account, and the relationships going quiet."
              href: "/features/contacts/"
            - label: "Leads & Prospects"
              description: "Funnel insights, stale-lead alerts, and one-sentence lead capture."
              href: "/features/leads/"
            - label: "Tasks, Calls & Meetings"
              description: "Your day at a glance, overdue follow-ups, and activity logged as you work."
              href: "/features/activities/"
            - label: "Support Cases"
              description: "Queue and backlog insights, escalations, and safe case updates."
              href: "/features/support-cases/"
        - title: "Delivery, Brand & Trust"
          links:
            - label: "Consultancy Workflows"
              description: "RFP responses, proposals, SOWs, work orders, and estimates in Astound's voice."
              href: "/features/consultancy/"
            - label: "Brand & Workspace"
              description: "Brand voice, terminology, formatting, client emails, and one-step setup."
              href: "/features/brand-and-workspace/"
            - label: "Governance & Trust"
              description: "The four-stage governance pipeline, permissions, analytics, and the full audit trail."
              href: "/features/governance-and-platform/"

    - id: skills
      label: "Skills"
      href: "/skills/"
      dropdown: false

    - id: how-to-use
      label: "How to use"
      href: "/#get-started"
      dropdown: false

    - id: insights
      label: "Insights"
      href: "/blog"
      dropdown: false

    - id: resources
      label: "Resources"
      href: "/documentation/"
      dropdown: true
      sections:
        - title: "This Platform"
          links:
            - label: "Documentation"
              description: "Setup, authentication, dashboard, and governance API guides for the platform."
              href: "/documentation/"
            - label: "Getting Started"
              description: "Create your account, install the bridge, and connect your AI tools in minutes."
              href: "/#get-started"
        - title: "Astound Digital"
          links:
            - label: "Solutions"
              description: "Commerce, experience design, AI & Agentforce, modernization, and performance marketing."
              href: "https://astounddigital.com/solutions"
              external: true
            - label: "AI Hub"
              description: "Astound's AI insights, perspectives, and agentic enterprise resources."
              href: "https://astounddigital.com/ai-hub"
              external: true
            - label: "Client Success"
              description: "Case studies from AllSaints, Boots Opticians, Zermatt, and more."
              href: "https://astounddigital.com/client-success"
              external: true
            - label: "About"
              description: "25+ years of digital commerce engineering. Boutique partnership, enterprise-grade impact."
              href: "https://astounddigital.com/about"
              external: true

