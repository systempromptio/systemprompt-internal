# Navigation Configuration
# Header, footer, and documentation sidebar
#
# External links point to https://systemprompt.io.
# Local routes (/skills, /documentation, /admin/login) target the running
# template instance.

header:
  items:
    - id: skills
      label: "Skills"
      href: "/skills/"
      dropdown: false

    - id: get-started
      label: "Get started"
      href: "/documentation/"
      dropdown: false

    - id: download
      label: "Download"
      href: "https://github.com/systempromptio/systemprompt-internal/releases/latest"
      dropdown: false


footer:
  capabilities:
    - path: "https://systemprompt.io/features/governance"
      label: "AI Governance"
      external: true
    - path: "https://systemprompt.io/features/audit"
      label: "Audit & Cost Tracking"
      external: true
    - path: "https://systemprompt.io/features/mcp"
      label: "MCP Servers"
      external: true
    - path: "https://systemprompt.io/features/skills"
      label: "Skills & Agents"
      external: true
    - path: "https://systemprompt.io/features/self-hosting"
      label: "Self-Hosted Deployment"
      external: true
  integrations:
    - path: "https://systemprompt.io/about"
      label: "About"
      external: true
    - path: "https://systemprompt.io/integrations/odoo"
      label: "Odoo"
      external: true
    - path: "https://systemprompt.io/integrations"
      label: "Integrations"
      external: true
    - path: "https://systemprompt.io/security"
      label: "Security"
      external: true
    - path: "https://systemprompt.io/contact"
      label: "Contact"
      external: true
  resources:
    - path: "https://github.com/systempromptio/systemprompt-internal/releases/latest"
      label: "Bridge Downloads"
      external: true
    - path: "/skills/"
      label: "Skills"
    - path: "/documentation/"
      label: "Documentation"
    - path: "https://systemprompt.io/blog"
      label: "Blog"
      external: true
    - path: "https://systemprompt.io/guides"
      label: "Guides"
      external: true
    - path: "/sitemap.xml"
      label: "Sitemap"
    - path: "/admin/login"
      label: "Login"
  legal:
    - path: "https://systemprompt.io/legal/privacy-policy"
      label: "Privacy Policy"
      external: true
    - path: "https://systemprompt.io/legal/cookie-policy"
      label: "Cookie Policy"
      external: true
    - path: "https://systemprompt.io/legal/terms-of-use"
      label: "Terms of Use"
      external: true
  contact:
    - href: "https://systemprompt.io/contact"
      label: "Contact"
    - href: "https://www.linkedin.com/company/systemprompt/"
      label: "LinkedIn"

social:
  - href: "https://www.linkedin.com/company/systemprompt/"
    type: "linkedin"
    label: "LinkedIn"

