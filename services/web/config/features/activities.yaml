sections:
  - id: find-tasks-meetings
    title: "Find Tasks & Meetings"
    content: |
      <p>Browse and filter your Salesforce tasks and meetings: what is due, what is overdue, this week's calendar, and the activity on any account, deal, or contact.</p>
      <p><strong>Ask it:</strong></p>
      <ul>
        <li>"What is on my plate today?"</li>
        <li>"Show me every overdue task on my accounts."</li>
        <li>"What meetings do I have with Halfords this month?"</li>
      </ul>
  - id: activity-insights
    title: "Activity Insights"
    content: |
      <p>Rollups of your activity: today and this week, overdue follow-ups, activity by type or owner, and how many touches a deal has actually had. The difference between feeling busy and knowing where the effort is going.</p>
      <p><strong>Ask it:</strong></p>
      <ul>
        <li>"Summarise my week."</li>
        <li>"How many touches has the Boots renewal had this quarter?"</li>
        <li>"Which team members are carrying the most overdue tasks?"</li>
      </ul>
  - id: log-schedule-activity
    title: "Log & Schedule Activity"
    content: |
      <p>Log calls, create follow-up tasks, schedule meetings, mark tasks complete, and reassign work. Confirmed with you before every change. The notes get captured while the call is still in your head, and the CRM stays current as a side effect of working.</p>
      <p><strong>Ask it:</strong></p>
      <ul>
        <li>"Log my call with Jane: discussed the replatform scope, she wants pricing by Friday."</li>
        <li>"Set a follow-up with Screwfix for next Tuesday."</li>
        <li>"Mark my prep tasks for the Zermatt workshop as done."</li>
      </ul>
