slug: contacts
title: "Contacts & People | Astound AI Salesforce Gateway"
headline: "Know who you know,"
headline_highlight: "everywhere."
subtitle: "The people behind every account: decision-makers, champions, and the relationships going quiet. Ask for a contact map before the meeting instead of scrolling through records."
description: "Find contacts, map decision-makers per account, and safely update contact records in Salesforce."
icon: network
highlights:
  - text: "Find any person in seconds"
    id: find-contacts
  - text: "Contact maps and relationship insights"
    id: contact-insights
  - text: "Update contacts with confirmation"
    id: update-contacts
cta:
  text: "Put names to every account"
  url: "/#get-started"
sections:
  - id: find-contacts
    title: "Find Contacts"
    content: |
      <p>Search and filter the people in your Salesforce by name, account, title, email, or phone. The answer to "who do we know there?" in one question.</p>
      <p><strong>Ask it:</strong></p>
      <ul>
        <li>"Who do we know at Charles Tyrwhitt?"</li>
        <li>"Find every ecommerce director in my accounts."</li>
        <li>"What is the phone number for the ops lead at Halfords?"</li>
      </ul>
  - id: contact-insights
    title: "Contact Insights"
    content: |
      <p>Briefings on the people around your deals: key contacts and decision-makers per account, contact maps, and the relationships that have gone quiet. Relationship risk becomes visible before it becomes a problem.</p>
      <p><strong>Ask it:</strong></p>
      <ul>
        <li>"Map the decision-makers on the Boots account."</li>
        <li>"Which of my key contacts have I not spoken to in 90 days?"</li>
        <li>"Brief me on everyone attending tomorrow's workshop."</li>
      </ul>
  - id: update-contacts
    title: "Update Contacts"
    content: |
      <p>Add a new person, update a title, email, or phone, or reassign an owner. Confirmed with you before every change, so the CRM reflects reality without the data entry chore.</p>
      <p><strong>Ask it:</strong></p>
      <ul>
        <li>"Add Jane Okafor, Head of Digital at Halfords."</li>
        <li>"Update Tom's title to VP Commerce."</li>
        <li>"Move all of Alex's contacts to Priya."</li>
      </ul>
