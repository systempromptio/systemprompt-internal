sections:
  - id: salesforce-essentials
    title: "Salesforce Essentials"
    content: |
      <p>This is the front door. A generalist Salesforce assistant that understands your pipeline, accounts, contacts, leads, support cases, and calendar, and routes your question to the right specialist. You do not need to know object names, report builders, or SOQL. You ask the way you would ask a colleague.</p>
      <p><strong>Ask it:</strong></p>
      <ul>
        <li>"What should I know before my 3pm call with Halfords?"</li>
        <li>"What changed in my pipeline this week?"</li>
        <li>"Log that call and set a follow-up for Friday."</li>
      </ul>
    items:
      - title: "Plain English in"
        description: "No filters, no report builders. Describe what you want and the assistant translates it into the right Salesforce query."
      - title: "Client-ready answers out"
        description: "Summaries you can paste straight into an email or a briefing, not raw record dumps."
  - id: one-login
    title: "One login, every connection"
    content: |
      <p>You sign in once with your existing Salesforce account. The gateway signs you into every connected source behind it, so Salesforce data, Google Drive documents, and your working tools are available in the same conversation. The complexity of managing those connections is owned by the platform, not by you.</p>
  - id: safety-promise
    title: "The confirmation promise"
    content: |
      <p>Reading is instant. Writing is deliberate. Any skill that creates or edits a Salesforce record shows you exactly what it is about to change and waits for your yes. Every request and every change is recorded in a full audit trail, so your admins can see who asked what, when, and what happened.</p>
