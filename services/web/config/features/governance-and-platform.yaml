sections:
  - id: demonstrate-governance
    title: "Demonstrate Governance"
    content: |
      <p>Every tool call runs through four synchronous checks before it executes: scope check, secret scan against 35+ patterns, blocklist, and rate limit. This skill exercises the pipeline live and reads back the audited decisions, so you can watch a request be allowed or refused and see exactly why. Useful internally, and persuasive in front of a client.</p>
      <p><strong>Ask it:</strong></p>
      <ul>
        <li>"Show me the governance pipeline refusing an out-of-scope request."</li>
        <li>"Walk me through the audit record for that decision."</li>
      </ul>
  - id: manage-permissions
    title: "Manage Permissions"
    content: |
      <p>Edit a user's roles and watch governance flip the same request from denied to allowed, live, with no reload. Access control is policy, not deployment.</p>
  - id: analytics-dashboards
    title: "Analytics Dashboards"
    content: |
      <p>Fleet-wide rollups across the workspace: overview, costs, agents, tools, sessions, conversations, and requests. Leadership sees adoption and spend without asking anyone to compile a report.</p>
      <p><strong>Ask it:</strong></p>
      <ul>
        <li>"What did AI usage cost this month, by team?"</li>
        <li>"Which skills are used most, and by whom?"</li>
      </ul>
  - id: audit-and-inspection
    title: "Audit & Inspection"
    content: |
      <p>Three inspection skills reconstruct exactly what the AI did. Inspect AI Requests deep-dives a single gateway request with its full audit and the tool calls it spawned. Inspect Conversation rebuilds a live session: messages, requests, governance decisions, and cost. Inspect Agents discovers and messages the workspace's agents and reads the artifacts and traces they produce. Every answer traces back to identity, decision, and cost.</p>
  - id: operations
    title: "Platform Operations"
    content: |
      <p>The operational toolkit for the people running the gateway: Manage Services starts, inspects, and troubleshoots the running stack; Inspect MCP and Skills checks server health and syncs the skills catalogue; the systemprompt CLI Reference navigates all eight CLI domains. Self-hosted means self-served, with the tools to match.</p>
