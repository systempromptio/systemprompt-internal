slug: leads
title: "Leads & Prospects | Astound AI Salesforce Gateway"
headline: "Your funnel,"
headline_highlight: "never goes cold."
subtitle: "See what came in, where it came from, and what needs follow-up today. Capture a new lead in one sentence and keep the funnel honest without touching a form."
