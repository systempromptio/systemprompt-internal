cta:
  text: "See your pipeline in a new way"
  url: "/#get-started"
sections:
  - id: find-deals
    title: "Find Deals"
    content: |
      <p>Browse, search, and filter your opportunities by stage, amount, close date, owner, or account. No list views to build. Describe the deals you want to see and get them back as a clean, readable list.</p>
      <p><strong>Ask it:</strong></p>
      <ul>
        <li>"Show me every open deal over 100k closing this quarter."</li>
        <li>"Which of my deals have not moved stage in 30 days?"</li>
        <li>"List the deals on the Charles Tyrwhitt account."</li>
      </ul>
  - id: pipeline-forecast
    title: "Pipeline & Forecast"
    content: |
      <p>Rollups of your pipeline by stage, forecast category, and win rate, plus a view of what is at risk. The numbers a sales leader asks for in a Monday meeting, available before the meeting starts.</p>
      <p><strong>Ask it:</strong></p>
      <ul>
        <li>"What does my Q3 forecast look like?"</li>
        <li>"Break my pipeline down by stage and owner."</li>
        <li>"What is at risk this month and why?"</li>
      </ul>
  - id: update-deals
    title: "Update Deals"
    content: |
      <p>Move a stage, change an amount or close date, reassign an owner, or mark a deal Won or Lost. The assistant shows you exactly what it will change and waits for your confirmation before touching the record. CRM hygiene without the admin burden.</p>
      <p><strong>Ask it:</strong></p>
      <ul>
        <li>"Move the Boots renewal to Negotiation."</li>
        <li>"Push the close date on the Zermatt deal to end of August."</li>
        <li>"Mark the AllSaints replatform as Won."</li>
      </ul>
