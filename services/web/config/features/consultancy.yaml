sections:
  - id: rfp-response
    title: "Create RFP Response"
    content: |
      <p>A structured RFP response for a digital-commerce engagement: solution narrative, team, timeline, and commercials, in Astound's voice and format. You bring the win themes and the client knowledge; the structure, boilerplate, and first full draft are done for you.</p>
      <p><strong>Ask it:</strong></p>
      <ul>
        <li>"Draft an RFP response for a B2B composable commerce replatform."</li>
        <li>"Build the team and timeline section from this scope outline."</li>
        <li>"Rewrite the executive summary to lead with the client's growth target."</li>
      </ul>
  - id: client-proposal
    title: "Create Client Proposal"
    content: |
      <p>A persuasive proposal shaped as situation, approach, value, and next steps. It opens with what the client gets, in the plain-spoken, evidence-backed voice Astound is known for.</p>
      <p><strong>Ask it:</strong></p>
      <ul>
        <li>"Draft a proposal for a loyalty programme build for a fashion retailer."</li>
        <li>"Tighten this proposal so the value case comes first."</li>
      </ul>
  - id: statement-of-work
    title: "Create Statement of Work"
    content: |
      <p>A full statement of work: scope, assumptions, responsibilities, change control, and payment schedule. The document that usually eats a delivery lead's week arrives as a complete first draft, ready for commercial review.</p>
      <p><strong>Ask it:</strong></p>
      <ul>
        <li>"Draft the SOW for phase one of the Halfords replatform."</li>
        <li>"Add a change-control section aligned to monthly billing."</li>
      </ul>
  - id: work-order
    title: "Create Work Order"
    content: |
      <p>A scoped work order for a defined unit of delivery: deliverables, milestones, acceptance criteria, and billing. Right-sized for the work that sits under an existing master agreement.</p>
      <p><strong>Ask it:</strong></p>
      <ul>
        <li>"Create a work order for the checkout optimisation sprint."</li>
        <li>"Set acceptance criteria based on these three user stories."</li>
      </ul>
  - id: project-estimate
    title: "Create Project Estimate"
    content: |
      <p>A phased estimate with a role-based rate table, effort breakdown, and contingency. Consistent structure across every estimate the team produces, so commercial review compares like with like.</p>
      <p><strong>Ask it:</strong></p>
      <ul>
        <li>"Estimate a three-phase composable commerce build with a UK delivery team."</li>
        <li>"Add a 15 percent contingency and show the effect per phase."</li>
      </ul>
