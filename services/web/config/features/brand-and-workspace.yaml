sections:
  - id: set-up-my-workspace
    title: "Set Up My Workspace"
    content: |
      <p>First-run setup in one step: installs the Astound Digital Salesforce dashboards into your Artifacts library and checks your Salesforce connection. Say "set up my workspace" and you are ready to work.</p>
  - id: apply-brand-voice
    title: "Apply Brand Voice"
    content: |
      <p>Rewrites or reviews any content against Astound Digital's voice rules: confident, plain-spoken, evidence-backed, and led by client outcomes. Use it as the final pass on proposals, emails, decks, and web copy, or ask for a QA list of violations on a near-final document.</p>
      <p><strong>Ask it:</strong></p>
      <ul>
        <li>"Rewrite this proposal introduction in our voice."</li>
        <li>"QA this SOW against the voice rules and list what to fix."</li>
      </ul>
  - id: draft-client-email
    title: "Draft Client Email"
    content: |
      <p>Professional client communications, drafted in the voice: status updates, kickoff notes, escalations, and follow-ups. Pull the context from the account and the draft is ready to review, not written from scratch.</p>
      <p><strong>Ask it:</strong></p>
      <ul>
        <li>"Draft a weekly status update for the Halfords programme."</li>
        <li>"Write a kickoff email for the discovery phase, warm but direct."</li>
      </ul>
  - id: format-client-document
    title: "Format Client Document"
    content: |
      <p>Applies Astound Digital's standard document structure and formatting conventions to client deliverables, so every document the client sees looks like it came from the same firm.</p>
  - id: company-boilerplate
    title: "Company Boilerplate"
    content: |
      <p>Approved company descriptions, capability statements, and legal disclaimers, inserted on demand. No more hunting through old decks for the current about-us paragraph.</p>
  - id: astound-glossary
    title: "Astound Glossary"
    content: |
      <p>Defines and enforces consistent use of Astound Digital and digital-commerce terminology across documents and conversations. Acronyms spelled out, product names right, every time.</p>
