# Scheduler Configuration
# Background jobs and scheduled tasks.
#
# Every job declares an explicit `owner:` — a real users.name that authorizes
# this job's actions. The configured owner becomes JobContext.actor for every
# `execute()` call and is the principal recorded in audit rows.
#
# No "system" user. No magic strings. `admin` is the bootstrap admin user
# created at install time (`just setup-local`). Deployments that want a
# different authorizer should change `owner:` to a different admin's username.

scheduler:
  enabled: true
  jobs:
    # Core jobs (defined in systemprompt-core)
    - name: cleanup_anonymous_users
      extension: core
      owner: admin
      schedule: "0 0 3 * * *"
      enabled: true

    - name: cleanup_empty_contexts
      extension: core
      owner: admin
      schedule: "0 0 * * * *"
      enabled: true

    - name: cleanup_inactive_sessions
      extension: core
      owner: admin
      schedule: "0 0 * * * *"
      enabled: true

    - name: database_cleanup
      extension: core
      owner: admin
      schedule: "0 0 4 * * *"
      enabled: true

    # Web extension jobs (publishing pipeline)
    - name: publish_pipeline
      extension: web
      owner: admin
      schedule: "0 */15 * * * *"
      enabled: true

    # Standalone core jobs, running on each job's built-in default schedule
    # (no `schedule:` override). Security jobs run in observe-and-log mode
    # because `enforce:` defaults to false.
    - name: no_js_cleanup
      extension: core
      owner: admin
      enabled: true

    - name: ghost_session_cleanup
      extension: core
      owner: admin
      enabled: true

    - name: mcp_session_cleanup
      extension: core
      owner: admin
      enabled: true

    - name: file_ingestion
      extension: core
      owner: admin
      enabled: true

    - name: behavioral_analysis
      extension: core
      owner: admin
      enabled: true

    - name: malicious_ip_blacklist
      extension: core
      owner: admin
      enabled: true

    # Knowledge extension jobs: brain@ mailbox capture into the knowledge
    # bank. Password comes from the brain_imap_password secret (or the
    # BRAIN_IMAP_PASSWORD env var), never from this file. The job only polls
    # where that credential is present: production holds it, a dev clone must
    # not, otherwise the two race for the same UNSEEN messages and whichever
    # polls first (usually the dev clone) swallows production's mail. Without
    # the credential the run logs a skip and succeeds with zero stats.
    - name: email_ingestion
      extension: knowledge
      owner: admin
      schedule: "0 */5 * * * *"
      enabled: true
      parameters:
        imap_host: imap.gmail.com
        imap_user: brain@systemprompt.io
        mailbox: INBOX

    # Hourly LLM pass over status='raw' knowledge documents → category,
    # structured summary and crm_intent. Never touches Odoo. Cost-capped by
    # batch_size per run. A rejected response gets one corrective round; after
    # three rejected runs the document parks as skipped/categorization_failed
    # with its last error in metadata. max_output_tokens must hold a full
    # object for a long thread — 1024 truncated real mail.
    - name: knowledge_categorization
      extension: knowledge
      owner: admin
      schedule: "0 15 * * * *"
      enabled: true
      parameters:
        batch_size: "25"
        max_output_tokens: "4096"

    # Plans an Odoo projection for each categorized email and opens the
    # approval_requests row an admin answers on /admin/governance/approvals —
    # the dashboard that mirrored it was retired, and that page is now the one
    # place these are decided. Reads Odoo as the OWNER's
    # linked account to find existing partners/leads — link it on
    # /admin/profile or every run fails with a config error. Writes nothing.
    # `task_project` names the Odoo project follow-ups become tasks in; leave it
    # unset and they become activities on the record instead.
    - name: knowledge_proposal
      extension: knowledge
      owner: admin
      schedule: "0 25 * * * *"
      enabled: true
      parameters:
        batch_size: "10"

    # Settles answered approvals every minute: applies to Odoo as the APPROVER's
    # linked account, records denials and expiries, sweeps expired rows, and
    # retries failed applies with backoff. This and the proposal_decide tool are
    # the pipeline's only Odoo writers, and both go through one executor
    # (knowledge-bank proposal::settle).
    - name: knowledge_odoo_apply
      extension: knowledge
      owner: admin
      schedule: "0 * * * * *"
      enabled: true
      parameters:
        batch_size: "50"

    # Standalone web extension jobs
    - name: content_analytics_aggregation
      extension: web
      owner: admin
      enabled: true

    - name: secret_migration
      extension: web
      owner: admin
      enabled: true

    # publish_pipeline sub-steps. The composite above runs each of these every
    # 15 minutes in dependency order; scheduling them independently would
    # double-run them, so they are disabled here (an explicit entry also
    # records the decision and silences the boot warning).
    - name: blog_content_ingestion
      extension: web
      owner: admin
      enabled: false

    - name: bundle_admin_css
      extension: web
      owner: admin
      enabled: false

    - name: copy_extension_assets
      extension: web
      owner: admin
      enabled: false

    - name: content_prerender
      extension: core
      owner: admin
      enabled: false

    - name: page_prerender
      extension: core
      owner: admin
      enabled: false

    - name: sitemap_generation
      extension: web
      owner: admin
      enabled: false

    - name: llms_txt_generation
      extension: web
      owner: admin
      enabled: false

    - name: robots_txt_generation
      extension: web
      owner: admin
      enabled: false

  # Run once, serially, at startup before the cron loop begins.
  #
  # governance_bootstrap is boot-only: it has no `jobs` entry (so it is never
  # cron-scheduled) and declares an empty schedule. Its owner defaults to the
  # system admin. It materialises the profile's gateway-route entities and
  # projects services/access-control + gateway-policy YAML into the authz tables
  # so authorization is correct at app start.
  bootstrap_jobs:
    - governance_bootstrap
    - database_cleanup
    - cleanup_inactive_sessions
    # Publish web assets before the cron loop: web/dist is generated, not
    # shipped in the image, so without this the site 404s until the first
    # 15-minute publish_pipeline tick.
    - publish_pipeline
