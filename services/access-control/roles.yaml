# Role-scoped access control rules.
#
# This file is the BOOTSTRAP source of truth. On startup the publish pipeline
# reads it and upserts each rule into `access_control_rules` (rule_type=role).
# Dashboard edits write to the database only — there is NO write-back to this
# file. To make a rule permanent across deployments, edit this file in the
# source repo and redeploy.
#
# Schema:
#   rules:
#     - entity_type:    gateway_route | mcp_server | plugin | agent | marketplace | skill | hook
#       entity_id:      string id of the entity        (exactly one of entity_id / entity_match)
#       entity_match:   glob pattern over catalog ids  (exactly one of entity_id / entity_match)
#       access:         allow | deny  (default: allow)
#       default_included: bool        (default: false)
#       roles:          list of role names to grant (or deny) access
#
# Example:
#
# rules:
#   - entity_type: gateway_route
#     entity_match: "*"
#     access: allow
#     roles: [admin, developer]
#   - entity_type: mcp_server
#     entity_id: systemprompt
#     access: allow
#     roles: [admin]

rules:
  # enterprise-demo marketplace. The bridge manifest filter resolves this rule
  # and cascades it onto every member skill/agent/mcp that lacks an own rule
  # (see marketplace_filter.rs). Mirrors marketplace.access in
  # services/marketplaces/enterprise-demo/config.yaml.
  - entity_type: marketplace
    entity_id: enterprise-demo
    access: allow
    default_included: true
    roles: [user]

  # Skills and artifacts need NO per-entity rule: they inherit their plugin's
  # rule (declared below), and a plugin with no rule of its own would inherit
  # this marketplace grant. Add an entity-level rule here only to DENY a
  # specific member — an entity-level deny overrides the inherited allow.

  # No `entity_type: agent` rules — this instance defines no A2A agents, so
  # there is nothing for a user-role member to list or invoke.

  # Odoo CRM MCP server — the one business server shipped to users. Every call
  # is executed as the calling user with their own Odoo login and API key (see
  # services/mcp/odoo.yaml); Odoo's own record rules decide what they can see.
  - entity_type: mcp_server
    entity_id: odoo
    access: allow
    default_included: true
    roles: [user]

  # Team comms MCP server. Granted to every user because the whole point is
  # reaching a colleague or their agent; the control that matters is addressing,
  # not the caller's role. A message enters a running conversation only when it
  # names that session — `@user` and `#channel` raise an unread count and never
  # interrupt — so a broad grant cannot become a broadcast channel.
  - entity_type: mcp_server
    entity_id: comms
    access: allow
    default_included: true
    roles: [user]

  # Project knowledge bank (Postgres full-text search, not a stub and not a
  # proxy). Read tools for every user; the upload_document tool is
  # additionally admin-gated inside the server (see
  # services/mcp/knowledge-bank.yaml).
  - entity_type: mcp_server
    entity_id: knowledge-bank
    access: allow
    default_included: true
    roles: [user]

  # Outbound email MCP server. Granted to every user, because the control on
  # sending is the approval chain, not the caller's role: `email_send` elicits
  # an in-band confirmation from the drafter and then holds the call for a
  # second human via the `require_approval` governance stage. Restricting the
  # grant to admin would be worse, not safer — `exempt_scopes: [admin]` on that
  # stage means an admin caller is never held, so an admin-only grant would make
  # every send self-approved.
  - entity_type: mcp_server
    entity_id: email
    access: allow
    default_included: true
    roles: [user]

  # --- Plugin scope declarations: one `entity_type: plugin` rule per plugin, always.
  #
  # A plugin is the role boundary. The cascade runs three levels deep —
  # skill/artifact → plugin → marketplace — and the NEAREST level that declares
  # any rule decides (core resolver): a level with no rules is transparent, a
  # level with rules is closed to every role it does not name. So:
  #
  #   * a user-scoped plugin declares [user] and default_included: true; every
  #     ruleless skill and dashboard inside it is visible to users (and to
  #     admins, who hold the user role too — see odoo-roles.yaml);
  #   * an admin-scoped plugin declares [admin] and default_included: false;
  #     every ruleless skill and dashboard inside it is closed to users even
  #     though the marketplace above admits them.
  #
  # Never add an `entity_type: skill` rule with `access: allow` — skills
  # inherit their plugin, and a per-skill allow is the drift this design
  # removes. A skill rule is for `access: deny` only (a targeted exclusion
  # inside an otherwise-granted plugin). scripts/validate-services.sh enforces
  # both, plus: every plugin has exactly one rule here, admin ⇒
  # default_included: false, and no enabled skill or artifact is orphaned.
  - entity_type: plugin
    entity_id: systemprompt-commons
    access: allow
    default_included: true
    roles: [user]
  - entity_type: plugin
    entity_id: systemprompt-user
    access: allow
    default_included: true
    roles: [user]
  - entity_type: plugin
    entity_id: systemprompt-demo
    access: allow
    default_included: true
    roles: [user]
  - entity_type: plugin
    entity_id: systemprompt-admin
    access: allow
    default_included: false
    roles: [admin]

  # The admin CLI-passthrough server. Its own rule (not just the admin plugin's)
  # because MCP servers are marketplace members in their own right and the
  # runtime MCP RBAC check resolves the server, not the plugin. Additionally
  # gated by oauth.scopes in services/mcp/systemprompt.yaml.
  - entity_type: mcp_server
    entity_id: systemprompt
    access: allow
    default_included: false
    roles: [admin]

  # Slack inbound surface. Wildcard grant over every Slack channel for the
  # `user` role — the role federated Slack users are minted with (see
  # services/slack/dev.yaml authz.allowed_roles). Channels inherit their
  # workspace grant via authz parent inheritance. Tighten entity_match to
  # specific channel ids (e.g. "C0ABC*") for production. To demonstrate a
  # denial, add a channel-specific `access: deny` rule below — an entity-level
  # deny overrides this inherited allow (deny-overrides).
  - entity_type: slack_channel
    entity_match: "*"
    access: allow
    default_included: true
    roles: [user]

  # gateway routes shipped with enterprise-demo — wildcard grant over every
  # route in the catalog. Per-route enumeration was retired alongside the
  # gateway_model EntityKind in core 0.11.x.
  - entity_type: gateway_route
    entity_match: "*"
    access: allow
    default_included: true
    roles: [user, admin]

  # NOTE: gateway routes are granted by the wildcard above and NOTHING ELSE.
  # Never add a `gateway_route` rule with a literal `entity_id` here.
  #
  # Route ids are generated, not authored: core derives them as
  # synthesize_route_id(model_pattern, provider) = slug + "-" + fnv1a6, e.g.
  # ("claude-*", "anthropic") -> claude-star-4203d1. There is no id a human can
  # work out from the model name, so a hand-written one names a route that does
  # not exist.
  #
  # This block used to hold four such ids — claude-opus-4-8-gemini,
  # claude-sonnet-4-6-openai, claude-3-7-sonnet-minimax and
  # claude-haiku-4-5-anthropic — added in 2999fabf to grant per-model reroutes.
  # None ever matched a route in any profile. They were invisible because core
  # ingestion self-materialised a catalog row for each one at every boot, so the
  # grants looked healthy while pointing at nothing dispatchable.
  #
  # Two things now stop that recurring: the governance bootstrap hands core the
  # profile's real route ids as the authoritative catalog, so a literal id that
  # names no route fails the boot with the id in the message; and
  # scripts/validate-services.sh rejects a literal gateway_route entity_id in CI,
  # which catches it without needing a profile (profiles are gitignored).
