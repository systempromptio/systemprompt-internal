[package]
name = "mcp-unit-tests"
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
systemprompt-mcp-shared = { workspace = true }
systemprompt-mcp-agent = { workspace = true }
systemprompt-mcp-comms = { workspace = true }
systemprompt-mcp-knowledge-bank = { workspace = true }
systemprompt-mcp-odoo = { workspace = true }
systemprompt-knowledge-jobs = { workspace = true }
# Why: the sealed-credential test asserts that the admin plane and the odoo
# MCP server agree byte-for-byte on the stored API key format. Proving that
# needs both sides in one process.
systemprompt-web-admin = { workspace = true }
systemprompt = { workspace = true, features = ["full"] }
axum = { workspace = true }
rmcp = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
# The knowledge bank's rendering helpers take rows carrying a uuid id and a
# timestamptz, so building one in a test needs both types.
uuid = { workspace = true }
chrono = { workspace = true }
