[package]
name = "e2e-tests"
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
systemprompt = { workspace = true, features = ["full"] }
systemprompt-security = { workspace = true }
# Linked for their inventory registrations: the web extension carries the
# schema migrations, the admin crate carries the role-aware marketplace
# filter the manifest tests exist to exercise.
systemprompt-web-admin = { workspace = true }
systemprompt-web-extension = { workspace = true }
# The email MCP server's binary is spawned as a subprocess, but the suite links
# the library too: the draft module owns the elicitation key and confirm-field
# names, and hardcoding those strings in the test would let a rename break the
# approval gate while the test kept passing.
systemprompt-mcp-email = { workspace = true }
# The brand `ArtifactTheme` is registered here, and `inventory` registrations
# only reach a binary that references the crate. Declared directly so the
# artifact gallery's theme assertions cannot be broken by an unrelated
# dependency edit dropping the transitive path.
systemprompt-mcp-shared = { workspace = true }

axum = { workspace = true }
tower = { workspace = true }
http-body-util = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
url = { workspace = true }
chrono = { workspace = true }
wiremock = { workspace = true }
rmcp = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
jsonwebtoken = { workspace = true }
base64 = { workspace = true }

[features]
# `live` points the smoke at a running local stack (server + Odoo) instead of
# the in-process router: `just e2e-live`.
live = []
