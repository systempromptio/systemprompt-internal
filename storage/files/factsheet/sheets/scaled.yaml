      - { label: Web, value: "systemprompt.io" }
    blocks:
      - type: hero-row
        kicker: "Governance for AI at enterprise scale"
        headline:
          - { text: "Every AI decision in your enterprise, " }
          - { text: "governed, audited, and provable.", tone: accent }
        lede:
          - { text: "Generative AI now sits on the regulated path — EU AI Act, SOC 2, ISO 27001, HIPAA, NIST AI RMF. systemprompt.io is the unified control, execution and audit layer between your workforce and every model your enterprise calls. One self-hosted control plane enforces per-user, per-role policy on every prompt, routes the call through a provider-neutral gateway, and writes one trace-id-bound audit row per decision — " }
          - { text: "391/sec/node", tone: bold }
          - { text: ", p99 " }
          - { text: "163ms", tone: bold }
          - { text: ", ten nodes for 23,000+ developers on one audit spine." }
        glance:
          kicker: "Measured · this stack"
          heading: "The numbers a board can verify."
          cells:
            - { n: "391", l: "Governed decisions / sec / node" }
            - { n: "163ms", l: "p99 governance latency" }
            - { n: "32,925", l: "Decisions on the audit spine" }
            - { n: "23,460", l: "Developer seats at 10 nodes" }

      - type: sec-head
        title: "Core capabilities"

      - type: caps
        cards:
          - kicker: "Control"
            heading: "Policy at every prompt"
            body: >-
              Per-user, per-role allow-list resolved on every call against a
              versioned policy table. Revocation lands in one TTL window; SSO
              untouched.
            pill: { text: "Per-call access control" }
          - kicker: "Audit"
            heading: "One spine for the fleet"
            body:
              - { text: "Every prompt, tool call and cost row joined by " }
              - { text: "trace_id", tone: code }
              - { text: " in one append-only table. " }
              - { text: "32,925", tone: bold }
              - { text: " decisions audited here; 22% denied at the gateway." }
            pill: { text: "Regulator-grade trail" }
          - kicker: "Scale"
            heading: "Linear horizontal scale"
            body:
              - { text: "Stateless API tier. " }
              - { text: "391 req/s/node", tone: bold }
              - { text: ", p99 " }
              - { text: "163ms", tone: bold }
              - { text: ", 1,000/1,000 sustained. Add nodes; policy table and audit spine stay one." }
            pill: { text: "391 req/s/node", mono: true }
          - kicker: "Sovereignty"
            heading: "On infrastructure you own"
            body: >-
              Self-hosted in your VPC. Anthropic, Bedrock, Vertex, Azure,
              self-hosted Llama — routable per role, per region. Data never
              leaves your tenancy.
            pill: { text: "Self-hosted · provider-neutral" }

      - type: sec-head
        title: "Why the world's largest enterprises pick systemprompt.io"

      - type: two-col
        left:
          - type: why-list
            items:
              - heading: "Regulatory defensibility, not best-effort logging"
                body: >-
                  The artefact the regulator asks for — who, what model, under
                  which policy version, what outcome — is one SQL query, not a
                  forensic dig across N container logs.
              - heading: "One control plane, every region you operate in"
                body: >-
                  One policy table, one audit spine; every replica writes to it.
                  Revocation is a row change — no rolling restart, no SSO
                  propagation wait, no collateral access loss.
              - heading: "Scale-out proven on a demo you can run"
                body:
                  - { text: "391 req/s/node", tone: bold }
                  - { text: " @ p99 " }
                  - { text: "163ms", tone: bold }
                  - { text: ", 1,000/1,000 at 100 concurrent. " }
                  - { text: "2,346", tone: bold }
                  - { text: " seats/node — " }
                  - { text: "23,460", tone: bold }
                  - { text: " at ten. Reproducible from " }
                  - { text: "02-load-test.sh", tone: code }
                  - { text: "." }
        right:
          - type: spec
            rows:
              - key: "Compliance"
                value:
                  - { text: "EU AI Act", tone: bold }
                  - { text: " Art. 9/12/15 · " }
                  - { text: "SOC 2", tone: bold }
                  - { text: " CC6.1/CC7.2 · " }
                  - { text: "ISO 27001", tone: bold }
                  - { text: " A.5.15/A.8.25 · " }
                  - { text: "HIPAA", tone: bold }
                  - { text: " §164.312 · " }
                  - { text: "NIST AI RMF", tone: bold }
                  - { text: " · OWASP Agentic Top 10." }
              - key: "Identity"
                value:
                  - { text: "JWT-bound role · " }
                  - { text: "PolicyResolver", tone: code }
                  - { text: " with 60s cache over " }
                  - { text: "ai_gateway_policies", tone: code }
                  - { text: ". SSO / OIDC upstream." }
              - key: "Topology"
                value:
                  - { text: "LB → N stateless replicas + isolated scheduler · primary/replica Postgres · cross-replica events via " }
                  - { text: "LISTEN/NOTIFY", tone: code }
                  - { text: "." }
              - key: "Deployment"
                value: >-
                  Self-hosted in your VPC · Docker Compose · Kubernetes + HPA ·
                  BSL-1.1 · no telemetry to the vendor.
              - key: "Observability"
                value:
                  - { text: "OpenTelemetry · " }
                  - { text: "x-served-by", tone: code }
                  - { text: " per response · Splunk · ELK · Datadog exporters." }
              - key: "Throughput"
                value:
                  - { text: "391 req/s/node", tone: bold }
                  - { text: " governance · " }
                  - { text: "1,495 req/s/node", tone: bold }
                  - { text: " audit ingest · 1,000/1,000 at 100c · ~" }
                  - { text: "23,460", tone: bold }
                  - { text: " seats at 10 nodes." }

      - type: prov
        kicker: "Provider-neutral · routed per role, per region"
        rows:
          - groups:
              - { label: "Direct:", value: "Anthropic · OpenAI · Gemini · Groq" }
