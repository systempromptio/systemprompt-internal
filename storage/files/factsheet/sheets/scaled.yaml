# The scaled control-plane sheet — the measured-numbers sheet, for a CIO or
# Chief Risk Officer asking whether this holds at fleet size.
#
# NORMALISED onto the house style; the content and every measured figure are
# unchanged.
id: scaled
title: "systemprompt.io · Enterprise AI control plane"
footer: "AI you own · systemprompt.io"
diagram: scaled-diagram.svg
max_pages: 2

pages:
