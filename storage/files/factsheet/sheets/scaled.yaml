    blocks:
      - type: sec-head
        title: "One control plane. Many replicas. Every call governed."

      - type: diagram

      - type: flow-caption
        variant: under-diagram
        label: "Governance at the boundary"
        text: >-
          Every replica enforces the same versioned policy and writes back to the
          same audit spine. Add nodes for capacity; the policy table and the
          trace-id-bound audit log stay singular. The hot standby is wired for
          failover headroom (open item in the scenario's known-limits).

      - type: sec-head
        title: "Where the unified control plane changes the answer"

      - type: compare
        columns:
          - "Vendor-hosted AI (e.g. Claude Enterprise)"
          - "Single-instance DIY gateway"
          - "systemprompt.io control plane"
        highlight: 2
        sections:
