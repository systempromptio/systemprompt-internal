# The procurement sheet — written for vendor management, landing on a
# fixed-scope four-week PoC. Ported from factsheet-procurement.html; the prose
# and the illustrative figures are unchanged.
id: procurement
title: "systemprompt.io · The AI invoice you cannot decompose"
footer: "AI you own · systemprompt.io"
max_pages: 2

pages:
  - fill: true
    masthead:
      - { label: Document, value: "Executive Briefing · Procurement" }
      - { label: For, value: "Vendor Management" }
      - { label: Deployment, value: "Self-hosted" }
      - { label: Web, value: "systemprompt.io" }
    blocks:
      - type: hero-row
        kicker: "For procurement · forward to your CIO"
        headline:
          - text: "You are signing AI invoices you cannot explain. "
          - { text: "And the number goes up every quarter.", tone: accent }
        lede: >-
          The spend arrives as one line on a vendor bill. No unit price, no cost
          centre, no business case attached to it. And the bill is not the spend:
          people are expensing personal subscriptions your agreement never sees.
          You have been handed a mandate to bring AI cost down, and no instrument
          to bring it down with. systemprompt.io is the layer that sits between
          your people and every AI provider, so every action carries a price, a
          model, a person and a team before it reaches your invoice.
        glance:
          kicker: "At a glance"
          heading: "A line item you can decompose is a line item you can negotiate."
          cells:
            - { n: "1", l: "Line on the invoice today. No team, no unit" }
            - { n: "100%", l: "Of spend joined to a person and a cost centre" }
            - { n: "Any", l: "Provider, swappable without a rebuild" }
            - { n: "Fixed", l: "Cost base you can forecast and defend" }

      - type: pov
        kicker: "Our point of view"
        statement:
          - text: "You cannot negotiate a line item you cannot decompose."
          - text: " "
          - tone: accent
            text: >-
                Attribution is the only real lever on AI spend, and it is the one
                thing no AI vendor will sell you.
      - type: sec-head
        title: "Why the AI line is unmanageable"

      - type: caps
        cards:
          - kicker: "One number"
            heading: "The invoice tells you nothing"
            body: >-
              Consumption billing arrives with no cost centre, no per-team split
              and no unit of work. You can approve it or you can fight it. You
              cannot manage it, because nothing on it maps to anything your
              business does.
            src: "Vendor-side metering"
          - kicker: "Off the books"
            heading: "The bill is not the spend"
            body: >-
              Personal subscriptions on expenses, departmental cards, free tiers
              that quietly convert. Your corporate agreement measures the part
              you already knew about. The rest lands as unexplained expense
              lines.
            src: "Shadow AI procurement"
          - kicker: "No lever"
            heading: "\"Reduce it\" is not actionable"
            body: >-
              The only levers a vendor offers you are fewer seats or a worse
              tier. Neither is tied to what the money actually buys, so every
              reduction is a guess and every guess is a fight with a business
              unit.
            src: "Seat-based commercial models"

      - type: sec-head
        title: "What attribution gives you"

      - type: caps
        cards:
          - kicker: "Price it"
            heading: "A unit price for AI work"
            brand_tone: true
            body: >-
              Every action carries a cost, a model, a user and a team. That gives
              you cost per task, per person and per outcome, which is the first
              number anyone in your role has been able to quote.
          - kicker: "Charge it"
            heading: "Chargeback that holds up"
            brand_tone: true
            body: >-
              Spend rolls up to cost centres on its own, so the budget
              conversation happens between the business unit and its own number.
              Procurement stops being the one defending a total it did not
              create.
          - kicker: "Negotiate it"
            heading: "A real position at renewal"
            brand_tone: true
            body: >-
              You walk in knowing consumption by model and by team, and you can
              move a workload to a cheaper provider without changing anything
              your people use. The alternative bid is credible because it is
              executable.

      - type: prov
        kicker: "Proven in delivery"
        rows:
          - groups:
                - label: "Astound Digital"
                  value: "delivers governed AI to enterprise clients on systemprompt.io."
                - label: "Runs on:"
                  value: "Anthropic · OpenAI · Gemini · Groq · Bedrock · Vertex AI · self-hosted Llama & Qwen"

      - type: cta
        headline:
          - text: "The spend is knowable today. "
          - { text: "Page 2 is that invoice line, broken down.", tone: accent }
        body: >-
          Then a four-week proof of concept on one business unit, with a spend
          report you keep either way.
        email: "ed@systemprompt.io"

  - fill: true
    masthead:
      - { label: Section, value: "What the breakdown looks like" }
      - { label: Licence, value: "BSL-1.1" }
      - { label: Engagement, value: "Platform · Integrator-delivered" }
      - { label: Web, value: "systemprompt.io" }
    blocks:
      - type: sec-head
        title: "One invoice line, decomposed"

      - type: invoice
        comment: "what lands on your desk today"
        parts:
          - { text: "AI Platform", tone: key }
          - { text: "Enterprise agreement" }
          - { text: "billing period 04" }
          - { text: "1 line item", tone: dim }
          - { text: "$47,000", tone: amount }
        footnote: "no team, no model, no unit of work, nothing to challenge and nothing to charge back"

      - type: ctable
        density: tight
        headers:
          - "Cost centre"
          - "People"
          - "Actions"
          - "Tokens in / out"
          - "Model mix"
          - "Denied"
          - "Spend"
          - "Per action"
        rows:
          - label: [{ text: "Engineering", tone: bold }]
            cells:
              - { text: "240" }
              - { text: "612,000" }
              - { text: "2,940M / 612M" }
              - { text: "Frontier 80% · small 20%", num: false }
              - { text: "1,840" }
              - { text: "$26,300" }
              - { text: "$0.043" }
          - label: [{ text: "Customer support", tone: bold }]
            cells:
              - { text: "410" }
              - { text: "840,000" }
              - { text: "1,680M / 252M" }
              - { text: "Small 95% · frontier 5%", num: false }
              - { text: "96" }
              - { text: "$9,200" }
              - { text: "$0.011", win: true }
          - label: [{ text: "Finance", tone: bold }]
            cells:
              - { text: "60" }
              - { text: "96,000" }
              - { text: "480M / 96M" }
              - { text: "Frontier 100%", num: false }
              - { text: "412" }
              - { text: "$7,400" }
              - { text: "$0.077" }
          - label: [{ text: "Marketing", tone: bold }]
            cells:
              - { text: "85" }
              - { text: "128,000" }
              - { text: "512M / 154M" }
              - { text: "Frontier 60% · small 40%", num: false }
              - { text: "28" }
              - { text: "$4,100" }
              - { text: "$0.032" }
          - label: "Total"
            total: true
            cells:
              - { text: "795" }
              - { text: "1,676,000" }
              - { text: "5,612M / 1,114M" }
              - { text: "Mixed", num: false }
              - { text: "2,376" }
              - { text: "$47,000" }
              - { text: "$0.028", win: true }

      - type: cuts
        panels:
          - title: "The same $47,000, by model (top 4)"
            headers: ["Model", "Provider", "Actions", "Spend", "Per action"]
            rows:
              - label: [{ text: "Claude Opus", tone: bold }]
                cells:
                  - { text: "Anthropic", num: false }
                  - { text: "74,000" }
                  - { text: "$11,200" }
                  - { text: "$0.151" }
              - label: [{ text: "Claude Sonnet", tone: bold }]
                cells:
                  - { text: "Anthropic", num: false }
                  - { text: "486,000" }
                  - { text: "$24,600" }
                  - { text: "$0.051" }
              - label: [{ text: "GPT small tier", tone: bold }]
                cells:
                  - { text: "OpenAI", num: false }
                  - { text: "774,000" }
                  - { text: "$6,900" }
                  - { text: "$0.009", win: true }
              - label: [{ text: "Gemini Flash", tone: bold }]
                cells:
                  - { text: "Google", num: false }
                  - { text: "342,000" }
                  - { text: "$4,300" }
                  - { text: "$0.013", win: true }
          - title: "And by task (top 5 of 61)"
            headers: ["Task", "Owner", "Runs", "Spend", "Per run"]
            rows:
              - label: [{ text: "ticket-triage", tone: bold }]
                cells:
                  - { text: "Support", num: false }
                  - { text: "620,000" }
                  - { text: "$6,300" }
                  - { text: "$0.010", win: true }
              - label: [{ text: "code-review", tone: bold }]
                cells:
                  - { text: "Engineering", num: false }
                  - { text: "168,000" }
                  - { text: "$9,400" }
                  - { text: "$0.056" }
              - label: [{ text: "contract-summarise", tone: bold }]
                cells:
                  - { text: "Legal", num: false }
                  - { text: "21,000" }
                  - { text: "$5,100" }
                  - { text: "$0.243" }
              - label: [{ text: "month-end-close", tone: bold }]
                cells:
                  - { text: "Finance", num: false }
                  - { text: "14,000" }
                  - { text: "$4,900" }
                  - { text: "$0.350" }
              - label: [{ text: "campaign-draft", tone: bold }]
                cells:
                  - { text: "Marketing", num: false }
                  - { text: "44,000" }
                  - { text: "$2,600" }
                  - { text: "$0.059" }

      - type: offbook
        kicker: "And the part the invoice never contained"
        body:
          - { text: "63 personal subscriptions", tone: key }
          - text: " detected across expense claims and departmental cards, "
          - { text: "~$12,600 a year", tone: key }
          - text: >-
              , outside the enterprise agreement and outside every control
              attached to it. Same work, same data, no contract, no audit trail.

      - type: flow-caption
        variant: after-panel-tight
        label: "Illustrative"
        text: >-
          Figures show the shape of the report, not a client result. Every column
          is a field the layer records per call: user, cost centre, provider,
          model, tokens in and out, governance denials, cost, latency. Findings
          fall straight out. Finance pays 7x per action what Support does,
          because it runs everything on a frontier model. Two tasks burn $10,000
          a month across 35,000 runs. And 774,000 actions already run at $0.009,
          which is the benchmark for the rest.

      - type: sec-head
        title: "Three questions to ask before the next renewal"

      - type: qbox
        items:
          - question: "Can this vendor give us spend by team and by task, not by seat?"
            aside: "(If it is a seat count, we buy licences, not work.)"
          - question: "What is our cost per completed task today?"
            aside: "(If nobody can state it, no saving can be evidenced either.)"
          - question: "What would it cost to move this workload elsewhere?"
            aside: "(If the answer is a rebuild, the price was never negotiable.)"

      - type: sec-head
        title: "A bounded proof of concept"

      - type: personas
        spaced: true
        cards:
          - kicker: "01 · Scope"
            heading: "One business unit, four weeks"
            body: >-
              No enterprise rollout and no migration. The layer runs alongside
              the tools that unit already uses, so nothing is switched off.
            outcome: "A defined start and a defined end."
          - kicker: "02 · Instrument"
            heading: "Every action attributed"
            body: >-
              Self-hosted inside your perimeter, wired to your identity provider.
              Every action joins to a named person, a team and a task, at a known
              price.
            outcome: "The number stops being one line."
          - kicker: "03 · Decide"
            heading: "A spend report you own"
            body: >-
              Cost by team, by model and by task, plus the spend your corporate
              agreement never saw. Renegotiate, consolidate, or walk away from
              the whole idea.
            outcome: "The report is yours either way."

      - type: prov
        spaced: true
        kicker: "How it is delivered"
        rows:
          - groups:
                - label: "Platform licence"
                  value: "from systemprompt.io under BSL-1.1, converting to your own IP after four years."
                - label: "Implementation and run"
                  value: "by your systems integrator, on your infrastructure. Source-available, so your CIO reviews it before anything is signed."

      - type: cta
        headline:
          - text: "Start with one business unit. "
          - { text: "Four weeks, fixed scope, one report you keep.", tone: accent }
        body: >-
          Worst case you learn what your AI spend actually buys. That is the
          floor, not the upside.
        email: "ed@systemprompt.io"
