# The enterprise factsheet — the technical sheet, for a reader who wants the
# specification rather than the argument.
#
# NORMALISED onto the house style. The original carried its own stylesheet: a
# dark "ink" at-a-glance panel and a set of near-duplicate rules that had drifted
# from the executive sheets. The content is unchanged; the presentation is now
# the shared design system, so this sheet gains every future improvement to it.
id: factsheet
title: "systemprompt.io · Govern your AI. Own your infrastructure."
footer: "AI you own · systemprompt.io"
diagram: hero-diagram.svg
max_pages: 2

pages:
  - dense: true
    masthead:
      - { label: Document, value: "Enterprise Factsheet" }
      - { label: Category, value: "AI Governance" }
      - { label: Deployment, value: "Self-hosted" }
      - { label: Web, value: "systemprompt.io" }
    blocks:
      - type: hero-row
        kicker: "Enterprise-grade AI governance infrastructure"
        headline:
          - { text: "Govern your AI. " }
          - { text: "Own your infrastructure.", tone: accent }
        lede: >-
          The rules have changed. In April 2026 Anthropic released Claude Cowork
          with three extension points that let enterprises redirect the client to
          their own inference, identity and audit infrastructure. Cowork calls no
          longer have to touch Anthropic's cloud. systemprompt.io is the single
          Rust binary that takes the other side of that contract: govern every
          prompt, tool call and MCP execution, and own the gateway, plugin
          catalogue and audit trail they run through.
        glance:
          kicker: "At a glance"
          heading: "The complete governance stack."
          cells:
            - { n: "1", l: "Rust binary · Postgres only" }
            - { n: "100%", l: "Prompts, tools, MCP audited" }
            - { n: "4", l: "Enforcement layers per call" }
            - { n: "0", l: "Outbound calls required" }

      - type: sec-head
        title: "Core capabilities"

      - type: caps
        cards:
          - kicker: "Govern"
            heading: "Secrets & tool-use firewall"
            body: >-
              Every prompt and tool call is scanned and audited before it reaches
              inference. Secrets stripped, scopes enforced, quotas checked,
              denials logged.
            pill: { text: "Pre-inference audit" }
          - kicker: "Prove"
            heading: "Identity-bound audit"
            body:
              - { text: "Every request, tool call, and MCP execution written to " }
              - { text: "audit_events", tone: code }
              - { text: ", linked by " }
              - { text: "trace_id", tone: code }
              - { text: " to a JWT-verified identity." }
            pill: { text: "SIEM-ready JSON", mono: true }
          - kicker: "Route"
            heading: "Any-provider gateway"
            body:
              - { text: "Point Cowork at " }
              - { text: "/v1/messages", tone: code }
              - { text: " you operate. Route per call to Anthropic direct, Bedrock, Vertex, Azure, OpenAI, or on-prem." }
            pill: { text: "Your negotiated rates" }
          - kicker: "Scope"
            heading: "Signed plugin catalogue"
            body: >-
              Ed25519-signed manifest. Per-user, per-role resolution. Atomic
              stage-then-rename. MDM-distributable. Revoke with one row.
            pill: { text: "Ed25519 · RFC 8032" }

      - type: sec-head
        title: "Why enterprises choose systemprompt.io"

      - type: two-col
        left:
          - type: why-list
            items:
              - heading: "Your perimeter stays intact"
                body: >-
                  Prompts, completions, and audit trails live in a PostgreSQL you
                  own. The upstream model sees prompt content only; never your
                  users, sessions, or tenants. Share one Bedrock or Vertex
                  account across thousands of users without leaking
                  organizational structure.
              - heading: "Revocation without collateral damage"
                body: >-
                  Revoke a user's AI access at the gateway; effective within one
                  TTL window, configurable to 300 seconds. The user keeps mail,
                  chat, code repos, deploys. HR procedures (leavers, role
                  changes, incident holds) become usable for AI access.
              - heading: "Supply chain under your signing key"
                body: >-
                  Ed25519 signing key held in your HSM/KMS. Every plugin, skill,
                  and MCP server passes signature verification before a byte
                  lands on disk. Per-user manifest resolution means finance and
                  platform see materially different catalogues.
        right:
          - type: spec
            rows:
              - key: "Binary"
                value:
                  - { text: "Single Rust executable. " }
                  - { text: "PostgreSQL", tone: code }
                  - { text: " 14+ only dependency. Signed releases, SHA-256 verifiable." }
              - key: "Client config"
                value:
                  - { text: "Five managed prefs sealed via Intune · Jamf · Group Policy: " }
                  - { text: "inferenceProvider", tone: code }
                  - { text: ", " }
                  - { text: "inferenceGatewayBaseUrl", tone: code }
                  - { text: ", " }
                  - { text: "inferenceCredentialHelper", tone: code }
                  - { text: ", " }
                  - { text: "...TtlSec", tone: code }
                  - { text: ", " }
                  - { text: "...AuthScheme", tone: code }
                  - { text: "." }
              - key: "Identity"
                value: >-
                  JWT (audience + issuer). Helper walks mTLS → session+OAuth/PKCE
                  → PAT ladder. Token in OS keystore (Keychain, Credential
                  Manager, Secret Service).
              - key: "Deployment"
                value: >-
                  Docker, bare metal, systemd, air-gapped. Zero outbound calls
                  required. Sovereign-cloud ready.
              - key: "Observability"
                value: >-
                  OpenTelemetry, structured JSON export to Splunk, ELK, Datadog,
                  Sumo Logic.
              - key: "Compliance"
                value: >-
                  SOC 2 (CC6.1, CC7.2), ISO 27001 (A.5.15, A.8.3, A.8.25), HIPAA
                  §164.312, EU AI Act Art. 9/12/15, NIST AI RMF, OWASP Agentic
                  Top 10.
              - key: "Licence"
                value: >-
                  BSL-1.1, source-available. Free to evaluate. Commercial for
                  production. Perpetual licence & SLAs available.

      - type: prov
        kicker: "Provider-agnostic · works with"
        rows:
          - groups:
              - { label: "Agents:", value: "Claude · Codex · Gemini · custom" }
              - { label: "Cloud:", value: "Bedrock · Vertex AI · Azure Foundry" }
          - groups:
              - { label: "Direct:", value: "Anthropic · OpenAI · Gemini · Groq" }
              - { label: "Self-hosted:", value: "Llama · Qwen · any /v1/messages" }

      - type: cta
        headline:
          - { text: "Evaluate free. " }
          - { text: "Production-ready in days, not months.", tone: accent }
        body: >-
          Clone the template, run locally, and evaluate the full governance
          pipeline. No time limit.
        link: "github.com/systempromptio/systemprompt-template"
        email: "ed@systemprompt.io"

  - dense: true
    masthead:
      - { label: Section, value: "Architecture & Comparison" }
      - { label: Licence, value: "BSL-1.1" }
      - { label: Release, value: "April 2026" }
      - { label: Web, value: "systemprompt.io" }
    blocks:
      - type: sec-head
        title: "Three zones, one boundary: the deployment architecture"

      - type: diagram

      - type: flow-caption
        variant: under-diagram
        label: "Identity stops at the boundary"
        text: >-
          The gateway strips the seven identity headers before forwarding. The
          upstream sees prompt content only, which lets you share one Bedrock or
          Vertex account across thousands of users while preserving per-user
          audit inside your perimeter.

      - type: sec-head
        title: "Every Cowork capability, on infrastructure you own"

      - type: compare
        columns:
          - "Claude Enterprise"
          - "Claude Custom (cloud)"
          - "Claude Custom + systemprompt.io"
        highlight: 2
        sections:
          - label: "Data, audit & deployment"
            rows:
              - label: "Data residency"
                cells:
                  - "Anthropic US infrastructure"
                  - "Cloud provider region"
                  - "Your datacenter, your jurisdiction, air-gap capable"
              - label: "Identity-bound audit"
                cells:
                  - "Anthropic-held"
                  - "OpenTelemetry only"
                  - - { text: "Prompt → tool → MCP → cost, in your DB, by " }
                    - { text: "trace_id", tone: code }
              - label: "Air-gapped deployment"
                cells:
                  - "Not available"
                  - "Not available"
                  - "Single binary, zero outbound calls"
          - label: "Identity, routing & cost"
            rows:
              - label: "Revoke a user"
                cells:
                  - "Remove from seat / SSO"
                  - "Remove from cloud IAM"
                  - "One DB row. SSO untouched. < 300 s."
              - label: "Inference provider"
                cells:
                  - "Anthropic only"
                  - "Bedrock, Vertex, Azure (Claude only)"
                  - "Any, per-call routing, your negotiated rates"

      - type: sec-head
        title: "Built for the teams that answer to auditors"

      - type: personas
        cards:
          - kicker: "For the CISO"
            heading: "Pass the audit in one query."
            outcome_label: "Outcome"
            body:
              - { text: "Full lineage from request to tool call to MCP execution to cost, linked by " }
              - { text: "trace_id", tone: code }
              - { text: " to a JWT-verified identity. Structured evidence, not policy documents." }
            outcome: "Auditor asks, you run a SQL query."
          - kicker: "For the CTO"
            heading: "Stop building a governance team."
            outcome_label: "Outcome"
            body: >-
              Three teams, narrow interfaces. AI platform owns routing, security
              owns the signing key and allowlist, endpoint owns the MDM profile.
              The binary absorbs every vendor-side churn.
            outcome: "Own the deployment, not the maintenance."

      - type: cta
        headline:
          - { text: "Read the full enterprise deployment guide. " }
          - { text: "The complete playbook for rolling out Claude Cowork on self-hosted infrastructure.", tone: accent }
        body: >-
          Architecture, three-team operating model, compliance mappings, MDM
          profiles, audit schema, revocation runbooks.
        link: "systemprompt.io/guides/claude-cowork-plugins-enterprise"
