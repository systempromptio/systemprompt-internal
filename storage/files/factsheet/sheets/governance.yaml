# The governance sheet — an STFO single-idea split of the CEO briefing, written
# for the person who has to prove what the AI did. Ported from
# factsheet-governance.html; the prose and the sourced figures are unchanged.
id: governance
title: "systemprompt.io · Governance you can show"
footer: "AI you own · systemprompt.io"
max_pages: 2

pages:
  - fill: true
    masthead:
      - { label: Document, value: "Executive Briefing · Governance" }
      - { label: For, value: "AI Governance & Security" }
      - { label: Deployment, value: "Self-hosted" }
      - { label: Web, value: "systemprompt.io" }
    blocks:
      - type: hero-row
        kicker: "For governance · forward to your CISO"
        headline:
          - text: "Your people already use AI you never approved. "
          - { text: "And you cannot prove a thing.", tone: accent }
        lede: >-
          The AI usage in your company is not the usage in your policy. More than
          a third of employees admit they have already put sensitive company data
          into AI apps nobody signed off. When the auditor, the regulator or the
          board asks who did what with which data, a policy PDF and a dashboard
          of last month's activity is not an answer. systemprompt.io is the
          governance layer that runs before the action: every AI call checked
          against your rules, risky ones stopped, every one logged and joined to
          a named person.
        glance:
          kicker: "At a glance"
          heading: "Checked before it runs. Logged to a person."
          cells:
            - { n: "Every", l: "AI action checked before it runs" }
            - { n: "4", l: "Gates on every call: scope, secrets, blocklist, rate" }
            - { n: "100%", l: "Of actions logged, joined to a person" }
            - { n: "1/3+", l: "Of employees already paste sensitive data into AI" }

      - type: pov
        kicker: "Our point of view"
        statement:
          - text: >-
              More than a third of your employees have already put sensitive data
              into AI tools you never approved.
          - text: " "
          - tone: accent
            text: >-
                A policy PDF is not governance. A check that runs before every
                action, and a log that names a person, is.
        src: "Grant Thornton · 2026 AI Impact Survey"

      - type: sec-head
        title: "The gap between your policy and your reality"

      - type: caps
        cards:
          - kicker: "Already happening"
            heading: "Shadow AI is not a forecast"
            body: >-
              Your people adopted AI without you. More than a third admit to
              putting sensitive company data into unapproved tools, and those are
              only the ones who admit it.
            src: "Grant Thornton · 2026 AI Impact Survey"
          - kicker: "After the fact"
            heading: "Monitoring is an obituary"
            body: >-
              Dashboards and DLP reports tell you what already happened. The
              secret already left, the record was already read. Control that
              arrives after the action is reporting, not governance.
            src: "Post-hoc monitoring vs pre-execution control"
          - kicker: "The audit"
            heading: "The question you cannot answer"
            body: >-
              The EU AI Act carries fines up to 7% of global turnover, and firms
              with a real governance layer are 3.4x more likely to govern AI
              effectively. "Who did what, with which data?" needs a log, not a
              policy.
            src: "EU AI Act · Gartner 2026"

      - type: sec-head
        title: "Governance that runs before the action"

      - type: caps
        cards:
          - kicker: "Check it"
            heading: "Four gates, every call"
            brand_tone: true
            body: >-
              Scope check, secret scan against 35+ patterns, blocklist, rate
              limit. Synchronous, before execution. A risky call does not run and
              generate a finding. It does not run.
          - kicker: "Name it"
            heading: "Every action joined to a person"
            brand_tone: true
            body: >-
              One trace links identity to agent to tool to result to cost. Not
              "the AI did something" but "this person's agent called this tool on
              this record at this time, and here is the decision."
          - kicker: "Show it"
            heading: "An audit trail, not an assertion"
            brand_tone: true
            body: >-
              Every decision, allow or deny, lands in your database inside your
              perimeter. When the auditor asks, you run a query and hand over
              evidence, not a policy document.

      - type: prov
        kicker: "Proven in delivery"
        rows:
          - groups:
                - label: "Astound Digital"
                  value: "delivers governed AI to enterprise clients on systemprompt.io."
                - label: "Runs on:"
                  value: "Anthropic · OpenAI · Gemini · Groq · Bedrock · Vertex AI · self-hosted Llama & Qwen"

      - type: cta
        headline:
          - text: "Governance you can show is governance that ran first. "
          - { text: "Page 2 is what one governed action looks like.", tone: accent }
        body: >-
          45 minutes with us and we will map your shadow-AI exposure and the
          first governed team.
        email: "ed@systemprompt.io"

  - fill: true
    masthead:
      - { label: Section, value: "Anatomy of a governed action" }
      - { label: Licence, value: "BSL-1.1" }
      - { label: Engagement, value: "Training · Platform · Rollout" }
      - { label: Web, value: "systemprompt.io" }
    blocks:
      - type: sec-head
        title: "Anatomy of one governed action"

      - type: trail
        steps:
          - n: "00 · INTENT"
            heading: "A person asks"
            body: >-
              An employee directs their agent in plain language. Identity
              attaches here: session, user, tenant.
          - n: "01 · SCOPE"
            kind: gate
            heading: "Allowed for this role?"
            body: >-
              The call is checked against the person's role and the tool's
              granted scope. Out of scope: stopped here.
          - n: "02 · SECRETS"
            kind: gate
            heading: "Leaking anything?"
            body: >-
              Payload scanned against 35+ secret patterns. Credentials never
              reach the model; they are injected server-side.
          - n: "03 · BLOCKLIST"
            kind: gate
            heading: "Forbidden operation?"
            body: >-
              Your deny rules run before execution. A blocked call is a non-event
              on your systems, not an incident report.
          - n: "04 · RATE"
            kind: gate
            heading: "Within budget?"
            body: >-
              Rate and spend limits enforced per identity, so no runaway agent
              and no runaway bill.
          - n: "05 · EXECUTE + LOG"
            kind: result
            heading: "Runs, then lands in the ledger"
            body: >-
              The action executes on live systems and one trace row joins
              identity, agent, tool, result and cost.

      - type: ledger
        comment: "one row per action, in your database, inside your perimeter"
        rows:
          - fields:
              - { key: "trace_id", value: "01J9…F4" }
              - { key: "user", value: "j.doyle@yourco.com" }
              - { key: "agent", value: "finance-close" }
              - { key: "tool", value: "erp.read_ledger" }
              - key: "decision"
                value: "ALLOW"
                tone: ok
                note: "scope ok · no secrets · not blocked · within rate"
              - { key: "cost", value: "$0.028" }
              - { key: "latency", value: "1.9s" }
          - fields:
              - { key: "trace_id", value: "01J9…F5" }
              - { key: "user", value: "j.doyle@yourco.com" }
              - { key: "agent", value: "finance-close" }
              - { key: "tool", value: "erp.write_payment" }
              - key: "decision"
                value: "DENY"
                tone: deny
                note: "blocklist: payments require human approval"
              - { key: "cost", value: "$0.000" }

      - type: quote
        text:
          - text: "When the auditor asks who did what, "
          - { text: "you run a query, not a meeting.", tone: accent }

      - type: sec-head
        title: "Three questions to ask your CTO this week"

      - type: qbox
        items:
          - question: "Can we produce a log of every AI action last month, joined to a named person?"
            aside: "(If the answer is a usage dashboard, the answer is no.)"
          - question: "What stops an agent from reading a record it should not, before it happens?"
            aside: "(Alerting after the read is detection. Governance runs first.)"
          - question: "Where do our credentials go when an AI tool needs them?"
            aside: "(If they pass through a prompt, they have already left.)"

      - type: sec-head
        title: "How we roll it out"

      - type: personas
        spaced: true
        cards:
          - kicker: "01 · Map"
            heading: "Your shadow-AI exposure"
            body: >-
              We map which teams already use AI, on which tools, touching which
              data. The gap between policy and reality, on one page.
            outcome: "You can answer the question."
          - kicker: "02 · Gate"
            heading: "The layer, self-hosted"
            body: >-
              systemprompt.io runs inside your perimeter, wired to your identity
              provider. Your rules become pre-execution gates on every AI call.
            outcome: "Governance that runs first."
          - kicker: "03 · Prove"
            heading: "The audit trail, standing"
            body: >-
              Every action from day one lands in the ledger. When the EU AI Act
              question arrives, the evidence already exists.
            outcome: "Proof on demand."

      - type: cta
        headline:
          - text: "Get your shadow-AI exposure map. "
          - { text: "45 minutes, one page, yours to keep.", tone: accent }
        body: >-
          We map the teams, the tools and the data in session one. What you do
          with it is up to you.
        email: "ed@systemprompt.io"
