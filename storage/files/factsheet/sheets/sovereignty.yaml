# The sovereignty sheet — an STFO single-idea split of the CEO briefing, written
# for a board asking who controls the model. Ported from
# factsheet-sovereignty.html; the prose and the sourced figures are unchanged.
id: sovereignty
title: "systemprompt.io · Your AI has a landlord"
footer: "AI you own · systemprompt.io"
max_pages: 2

pages:
  - fill: true
    masthead:
      - { label: Document, value: "Executive Briefing · Sovereignty" }
      - { label: For, value: "CEO & Board" }
      - { label: Deployment, value: "Self-hosted · EU-ready" }
      - { label: Web, value: "systemprompt.io" }
    blocks:
      - type: hero-row
        kicker: "For the board"
        headline:
          - text: "Your AI has a landlord. "
          - { text: "And it is not you.", tone: accent }
        lede: >-
          AI now runs real work across your business, and a foreign-controlled
          research lab holds the model, the terms, the price and the access. Your
          data flows through their perimeter under an agreement they can change
          and you can only accept. That is not a supplier relationship. It is a
          tenancy. systemprompt.io is the AI layer you own: one self-hosted
          system inside your perimeter that runs Claude, Codex, Gemini or a model
          you host yourself, swappable with a setting, with nothing about your
          rules, your skills or your data in anyone else's hands.
        glance:
          kicker: "At a glance"
          heading: "The lab becomes a supplier. Not a landlord."
          cells:
            - { n: "Any", l: "Model: swap providers with a setting" }
            - { n: "Yours", l: "One binary you keep, even if we vanish" }
            - { n: "0", l: "Data leaves your perimeter" }
            - { n: "71%", l: "Of leaders call sovereign AI strategic" }

      - type: pov
        kicker: "Our point of view"
        statement:
          - text: >-
              71% of leaders now call sovereign AI a strategic imperative, yet
              only about 15% own it at board level.
          - text: " "
          - tone: accent
            text: >-
                Own the layer and the lab becomes a supplier you swap or
                self-host. Rent it, and every plan you have runs on someone else's
                permission.
        src: "McKinsey · The sovereign AI agenda, 2026"

      - type: sec-head
        title: "What the tenancy actually exposes you to"

      - type: caps
        cards:
          - kicker: "Their terms"
            heading: "Repriced at their discretion"
            body: >-
              Pricing, rate limits, usage policies and access all sit in an
              agreement the lab can revise. When the terms change, your only
              options are pay or stop. There is no third one.
            src: "Standard frontier-lab terms of service"
          - kicker: "Their perimeter"
            heading: "Your data, their jurisdiction"
            body: >-
              Every prompt, document and record your teams send crosses into
              infrastructure governed by another company under another
              government. For an EU business, that is a board-level question, not
              an IT one.
            src: "EU AI Act · data-transfer obligations"
          - kicker: "Their roadmap"
            heading: "Deprecated out from under you"
            body: >-
              Labs retire models on their schedule, not yours. Every workflow
              tuned to a rented model inherits its end-of-life date. You build on
              sand that someone else can drain.
            src: "Published model deprecation schedules"

      - type: sec-head
        title: "What owning the layer changes"

      - type: caps
        cards:
          - kicker: "Swap it"
            heading: "The model is a setting"
            brand_tone: true
            body: >-
              Claude, Codex, Gemini, Groq, or a self-hosted Llama or Qwen inside
              your own walls. Change provider in configuration. Your skills,
              connectors, rules and audit trail do not move.
          - kicker: "Keep it"
            heading: "One binary that is yours"
            brand_tone: true
            body: >-
              Self-hosted and source-available under BSL-1.1. It runs inside your
              perimeter and keeps running whatever happens to any lab, or to us.
              No one can switch your company off.
          - kicker: "Contain it"
            heading: "Data that never leaves"
            brand_tone: true
            body: >-
              Prompts, records and secrets stay inside your perimeter. Secrets
              are injected server-side and never reach the model. Sovereignty is
              the architecture, not a clause in a contract.

      - type: prov
        kicker: "Proven in delivery"
        rows:
          - groups:
                - label: "Astound Digital"
                  value: "delivers governed AI to enterprise clients on systemprompt.io."
                - label: "Runs on:"
                  value: "Anthropic · OpenAI · Gemini · Groq · Bedrock · Vertex AI · self-hosted Llama & Qwen"

      - type: cta
        headline:
          - text: "If your AI provider cut you off tomorrow, what still works? "
          - { text: "With an owned layer the answer is: everything.", tone: accent }
        body: >-
          Page 2 walks the scenario hour by hour. 45 minutes with us and we will
          walk it for your stack.
        email: "ed@systemprompt.io"

  - fill: true
    masthead:
      - { label: Section, value: "The scenario · EU exposure" }
      - { label: Licence, value: "BSL-1.1" }
      - { label: Engagement, value: "Training · Platform · Rollout" }
      - { label: Web, value: "systemprompt.io" }
    blocks:
      - type: sec-head
        title: "Tomorrow morning, your lab changes the terms"

      - type: scenario
        cards:
          - day: "09:00 · The email lands"
            heading: "New pricing, new usage policy"
            body: >-
              Effective in 30 days: enterprise tier repriced, rate limits
              revised, a model your teams rely on scheduled for retirement.
              Perfectly legal. Entirely their call.
          - day: "09:15 · The rented company"
            heading: "Starts a migration project"
            body: >-
              Every workflow, integration and policy is welded to the vendor.
              Legal reviews the contract and finds it says what it always said:
              they can. The budget takes the hit or the tools go dark.
          - day: "09:15 · The owning company"
            heading: "Changes one setting"
            brand_tone: true
            body: >-
              The model behind the layer switches to another provider, or to a
              self-hosted model inside the perimeter. Skills, connectors, rules
              and the audit trail do not notice. The email becomes a procurement
              note.

      - type: quote
        text:
          - text: "You cannot negotiate with a landlord who has a thousand other tenants. "
          - { text: "You can always swap a supplier.", tone: accent }
          - text: " Ownership is what turns one into the other."

      - type: sec-head
        title: "The EU question your board will ask anyway"

      - type: caps
        cards:
          - kicker: "The fine"
            heading: "Up to 7% of global turnover"
            body: >-
              The EU AI Act attaches real penalties to ungoverned AI. Where your
              data goes and who controls the model are now questions with a
              number attached.
            src: "EU AI Act"
          - kicker: "The gap"
            heading: "Imperative for 71%, owned by 15%"
            body: >-
              Most boards have declared sovereign AI strategic. Few can point at
              the thing they own. The gap between the statement and the asset is
              where the exposure lives.
            src: "McKinsey · The sovereign AI agenda, 2026"
          - kicker: "The answer"
            heading: "Sovereignty as architecture"
            body: >-
              A self-hosted layer inside your perimeter, running the model of
              your choice, with every action checked and logged, is a sovereignty
              answer you can show, not assert.
            src: "systemprompt.io governance pipeline"

      - type: sec-head
        title: "Three questions to ask before the next board meeting"

      - type: qbox
        items:
          - question: "If our AI provider repriced or cut access tomorrow, what is our time to recover?"
            aside: "(If the answer involves the word \"migration\", you are a tenant.)"
          - question: "Which company data crosses into foreign-controlled infrastructure today, and under whose terms?"
            aside: "(If nobody can answer in one page, that is the answer.)"
          - question: "What do we actually own after two years of AI spend?"
            aside: "(Rent buys usage. Ownership compounds: skills, rules, connectors, audit history.)"

      - type: cta
        headline:
          - text: "Walk the cut-off scenario on your own stack. "
          - { text: "45 minutes, before the terms change.", tone: accent }
        body: >-
          We map what you rent, what you would keep, and what a
          swap-with-a-setting posture looks like for your systems.
        email: "ed@systemprompt.io"
