# The partner / reseller sheet — run one multi-tenant gateway and sell enterprise
# AI as a managed service under your own brand.
#
# NORMALISED onto the house style. The original was the most heavily
# inline-styled of the eleven; every one of those overrides is now a named
# component in the shared design system. Content and figures are unchanged.
id: gateway
title: "systemprompt.io · The infrastructure behind your AI service"
footer: "AI you own · systemprompt.io"
diagram: salesforce-gateway-3layer.svg
max_pages: 3

pages:
  - fill: true
    dense: true
    masthead:
      - { label: Document, value: "Partner Proposal" }
      - { label: Category, value: "Managed AI Service" }
      - { label: Deployment, value: "Multi-tenant, self-hosted" }
      - { label: Web, value: "systemprompt.io" }
    blocks:
      - type: hero-row
        kicker: "The infrastructure behind your AI service"
        headline:
          - { text: "Your clients should not have to " }
          - { text: "become AI experts.", tone: accent }
        lede: >-
          That is the job you are selling. Not a licence, not a seat count, but
          the expertise to make AI work well and cost the right amount, delivered
          as a service your client never has to think about. Nobody in a
          500-person business wants to learn which model is cheap this quarter,
          why the same task costs several times more on one host than another, or
          how to keep a bill inside a budget. They want it handled.
        extra_lede: >-
          So you run one gateway, and every client is a tenant on it. You hold
          the upstream credentials, you route each task to whichever model fits,
          and you quote one fixed number. It installs in one click on every desk
          and it lives inside their own domain, under their own name. This is
          what the next generation of software sells: a managed AI service, with
          the expertise built in.
        glance:
          kicker: "At a glance"
          heading: "Fixed price. Managed quality. Any model."
          cells:
            - { n: "1", l: "Number they can budget" }
            - { n: "0", l: "Metered surprises" }
            - { n: "6.8×", l: "Cost spread we route around" }
            - { n: "1‑click", l: "Install to every enrolled desk" }

      - type: sec-head
        title: "One hub, every client a tenant"

      - type: caps
        cards:
          - kicker: "Isolation"
            heading: "Separate by default"
            body: >-
              Each client is a tenant with its own users, policy and data. Tenant
              identity is carried on every request and every audit row, not
              bolted on afterwards.
            pill: { text: "tenant_id", mono: true }
          - kicker: "Pooled expertise"
            heading: "You learn from every client"
            body: >-
              Running many tenants gives you usage patterns no single client can
              see alone. You tune cost and effectiveness across all of them, and
              sell that as a fixed price.
            pill: { text: "Compounding" }
          - kicker: "The record"
            heading: "You own the data"
            body: >-
              Every token in and out lands in your database with identity, model,
              cost, latency and outcome. The usage reporting you sell is built on
              rows you already hold.
            pill: { text: "18 columns" }
          - kicker: "Onboarding"
            heading: "The next client is config"
            body: >-
              Adding a tenant does not mean standing up another stack. The second
              client costs you a configuration, not a deployment, which is what
              makes the margin work.
            pill: { text: "Repeatable" }

      - type: flow-caption
        variant: after-panel-tight
        label: "Why this shape"
        text: >-
          The hub is the product you operate. Your clients never run
          infrastructure, never negotiate with a model lab, and never see a bill
          they cannot explain. When one of them outgrows the shared hub, it
          graduates to its own deployment, which is a larger contract rather than
          a lost one.

      - type: sec-head
        title: "One click to every desk, then kept current"

      - type: two-col
        left:
          - type: why-list
            items:
              - heading: "Installed by IT, not by the user"
                body: >-
                  A small connector for Windows, macOS and Linux, shipped through
                  the tools your clients already use to manage their fleets. The
                  person at the desk does nothing.
              - heading: "Credentials never leave the host"
                body: >-
                  The connector holds a short-lived token and rotates it locally
                  against your gateway. Your upstream keys stay on your
                  infrastructure and never reach a client machine.
              - heading: "Skills and connectors sync down signed"
                body: >-
                  You publish once in the hub. Every enrolled machine receives
                  the set its role allows, signed and versioned, and picks up
                  changes on the next boot.
        right:
          - type: callout
            kicker: "What the user sees"
            lead:
              - { text: "The agent they already wanted, already set up.", tone: bold }
              - { text: " Claude, Codex or whatever your client standardises on, opening with the right skills and the right connectors in place." }
            body: >-
              Signed manifests · role-scoped delivery · local proxy on the host ·
              macOS, Windows and Linux builds.

      - type: prov
        kicker: "Beholden to nobody"
        rows:
          - text: >-
              Every other option on the table ties your client to one lab's
              models and one lab's roadmap. The hub ties them to none. Route to a
              frontier lab today, to an open-weight model on rented silicon
              tomorrow, or to inference you run yourself, without the client
              changing anything or the governance being rewritten.
          - groups:
              - { label: "Frontier labs:", value: "Anthropic · OpenAI · Google" }
              - { label: "Open weights:", value: "Kimi · Qwen · Llama" }
              - { label: "Hosted anywhere:", value: "Groq · Cerebras · Fireworks · Bedrock · Vertex AI · Azure Foundry" }

      - type: cta
        headline:
          - { text: "Let us scope your hub. " }
          - { text: "We will cost your first client with you.", tone: accent }
        body: >-
          45 minutes to size the usage, pick the model routing, and set the fixed
          price you would quote. No commitment.
        email: "ed@systemprompt.io"

  - dense: true
    masthead:
      - { label: Section, value: "Architecture · Economics · Growth" }
      - { label: Licence, value: "BSL-1.1" }
      - { label: Engagement, value: "Training · Platform · Rollout" }
      - { label: Web, value: "systemprompt.io" }
    blocks:
      - type: sec-head
        title: "Where the gateway sits"

      - type: diagram

      - type: flow-caption
        variant: under-diagram
        label: "The credential is the hinge"
        text: >-
          Requests arrive identified by tenant, pass through governance you
          manage as code, and leave on your commercial credential, so upstream
          meters you rather than every named user. That is Anthropic's own
          documented rollout: "the provider key stays server-side; developers
          hold gateway credentials instead" (code.claude.com/docs/en/llm-gateway).

      - type: sec-head
        title: "What 500 people cost, on every plan on the table"

      - type: ctable
        density: tight
        headers:
          - "500 users, one year · 75 developers, 425 everyone else"
          - "Seats"
          - "Agentic work, 4.5M steps"
          - "Chat, 3.5M turns"
          - "The year"
          - "Per user, per month"
        rows:
          - band: true
            label:
              - { text: "All four rows buy the same work: " }
              - { text: "627 billion tokens a year", tone: bold }
              - { text: ". Only the model underneath changes." }
          - label:
              - { text: "Salesforce", tone: bold }
              - { text: " Agentforce 1 " }
              - { text: "Salesforce models only", tone: muted }
            cells:
              - { text: "$550 × 500 × 12\n= $3,300,000" }
              - { text: "2.5M Flex Credits included,\nmetered past them" }
              - { text: "included" }
              - { text: "$3,300,000", lose: true }
              - { text: "$550.00", lose: true }
          - label:
              - { text: "Anthropic", tone: bold }
              - { text: " Claude Enterprise " }
              - { text: "Anthropic models only", tone: muted }
            cells:
              - { text: "$20 × 500 × 12\n= $120,000" }
              - { text: "$0.0471 a step\n= $211,829" }
              - { text: "$0.0435 a turn\n= $153,076" }
              - { text: "$484,905", lose: true }
              - { text: "$80.82", lose: true }
          - label:
              - { text: "OpenAI", tone: bold }
              - { text: " ChatGPT Enterprise + Codex " }
              - { text: "OpenAI models only", tone: muted }
            cells:
              - { text: "$60 × 500 × 12\n= $360,000" }
              - { text: "$0.0181 a step\n= $81,489" }
              - { text: "included" }
              - { text: "$441,489", lose: true }
              - { text: "$73.58", lose: true }
          - label:
              - { text: "Your gateway", tone: bold }
              - { text: " " }
              - { text: "Kimi and Qwen on Fireworks, with a frontier model when the task needs one", tone: key }
            cells:
              - { text: "none\nplatform share $7,000" }
              - { text: "$0.0176 a step\n= $79,066" }
              - { text: "$0.0071 a turn\n= $24,831" }
              - { text: "$110,896", win: true }
              - { text: "$18.48", win: true }
          - total: true
            label: "Illustrative sell at $60 a user, and what it leaves you"
            cells:
              - { text: " " }
              - { text: " " }
              - { text: "$360,000 revenue" }
              - { text: "$249,104 margin", win: true }
              - { text: "$124,905 saved" }

      - type: two-col
        left:
          - type: cuts
            panels:
              - title: "The same step, priced by every model we can reach"
                headers: ["One identical agentic step", "List price, input $/M", "What the step costs"]
                rows:
                  - label: "Qwen 3.7 Plus on Fireworks"
                    cells: [{ text: "$0.40" }, { text: "$0.0102", win: true }]
                  - label: "GPT-5"
                    cells: [{ text: "$1.25" }, { text: "$0.0181" }]
                  - label: "Kimi K2.7 Code on Fireworks"
                    cells: [{ text: "$0.95" }, { text: "$0.0243", win: true }]
                  - label:
                      - { text: "Gemini 3.5 Flash-Lite " }
                      - { text: "cheapest list price", tone: muted }
                    cells: [{ text: "$0.30" }, { text: "$0.0365", lose: true }]
                  - label: "Claude Sonnet 5"
                    cells: [{ text: "$3.00" }, { text: "$0.0415" }]
                  - label: "Claude Opus 5"
                    cells: [{ text: "$5.00" }, { text: "$0.0692" }]
        right:
          - type: qbox
            kicker: "Mix and evaluate, or take what you are given"
            paragraphs:
              - - { text: "Our blend costs " }
                - { text: "2.7× less per agentic step", tone: key }
                - { text: " than an Opus and Sonnet mix, on identical tokens, and one task in ten still escalates to a frontier model so the answer does not suffer. That is the whole gap between the last two rows above." }
              - - { text: "We own the model layer and we understand the flows running through it, so we buy each model at the right price and build blends that are more efficient than any single vendor can offer. " }
                - { text: "That is the direction the market is moving.", tone: key }
                - { text: " It also means we can self-host, and take every cost reduction the moment it arrives. " }
                - { text: "A client locked to one vendor captures none of it.", tone: key }

      - type: flow-caption
        variant: after-panel-tight
        label: "Where these numbers come from"
        text: >-
          Every model rate is its provider's own published price. The size of an
          agentic step is measured rather than assumed: 119,000 cached tokens
          re-read plus 875 new in and 214 out, the median of roughly 350,000 real
          Claude Code and Codex sessions instrumented by the University of
          Washington (arXiv 2606.30560). Two cross-checks: this puts Anthropic
          usage within 5% of Anthropic's own published seat consumption, and
          Codex at $91 a developer a month against OpenAI's published $100 to
          $200. Salesforce and Anthropic seat prices are published list. OpenAI
          publishes no Enterprise seat price, so $60 is 2026 deal reporting in a
          $45 to $75 band; its published Business tier is $20. Cerebras is on the
          hub but uncosted here, publishing subscription tiers rather than
          per-token rates. The $60 you sell at, and the margin it leaves, are
          illustrative and yours to set.

  - dense: true
    masthead:
      - { label: Section, value: "How the account grows" }
      - { label: Licence, value: "BSL-1.1" }
      - { label: Engagement, value: "Training · Platform · Rollout" }
      - { label: Web, value: "systemprompt.io" }
    blocks:
      - type: sec-head
        title: "How the account grows"

      - type: scenario
        cards:
          - day: "01 · Shared tenant"
            heading: "They buy a service, not software"
            body:
              - { text: "They onboard onto your hub, get governed agents on every desk, and one number they can budget. " }
              - { text: "Live in weeks, not quarters.", tone: accent }
          - day: "02 · Dedicated tenant"
            heading: "When the numbers get serious"
            body:
              - { text: "Volume or a compliance review pushes them to isolated infrastructure: same system, their own instance, still run by you. " }
              - { text: "A bigger contract, not a migration.", tone: accent }
          - day: "03 · Their own deployment"
            heading: "The enterprise licence"
            body:
              - { text: "The largest want it self-hosted inside their perimeter on their own licence, and you have proven it already. " }
              - { text: "Licence plus delivery revenue.", tone: accent }
