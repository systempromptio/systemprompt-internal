# The economics sheet — an STFO single-idea split of the CEO briefing, written
# for the person who signs the AI invoice. Ported from factsheet-economics.html;
# the prose and the sourced figures are unchanged.
id: economics
title: "systemprompt.io · Stop renting AI"
footer: "AI you own · systemprompt.io"
max_pages: 2

pages:
  - fill: true
    masthead:
      - { label: Document, value: "Executive Briefing · Economics" }
      - { label: For, value: "The CEO who signs the bill" }
      - { label: Deployment, value: "Self-hosted" }
      - { label: Web, value: "systemprompt.io" }
    blocks:
      - type: hero-row
        kicker: "For the CEO · forward to your CFO"
        headline:
          - text: "You are paying rent on your own AI. "
          - { text: "Forever. Per seat.", tone: accent }
        lede: >-
          Every AI platform you rent runs the same meter: a fee for every seat, a
          charge for every action, a bill that rises with every hire and never
          comes back down. The work is done by raw model inference that costs
          cents. Everything above that line is markup on a capability you could
          own. systemprompt.io is the AI layer you own instead: one self-hosted
          system, your choice of model, and a cost base that is fixed plus
          inference, not fixed plus your headcount.
        glance:
          kicker: "At a glance"
          heading: "Pay for work done. Not for people employed."
          cells:
            - { n: "~$0.03", l: "Per agent action, raw inference" }
            - { n: "$0", l: "Per-seat fees, at any headcount" }
            - { n: "70%", l: "Cheaper again with a model swap" }
            - { n: "Fixed", l: "Cost base that ignores hiring" }

      - type: pov
        kicker: "Our point of view"
        statement:
          - text: >-
              Every hire raises your AI bill before they have done a day's work.
              79% of enterprises overspent on AI last year, by about 31% on
              average.
          - text: " "
          - tone: accent
            text: >-
                That is a landlord's pricing model, not a tool's. Stop renting the
                layer. Own it.
        src: "DoiT · AI Spending Survey, 2026"

      - type: sec-head
        title: "The meter is the business model"

      - type: caps
        cards:
          - kicker: "The seat tax"
            heading: "Growth is punished"
            body: >-
              Per-seat pricing means your AI bill is indexed to your headcount,
              not to the value AI delivers. Hire 50 people and your vendor gets a
              raise. That is the deal you signed.
            src: "Published per-seat platform pricing"
          - kicker: "No lever"
            heading: "You cannot negotiate a meter"
            body: >-
              79% of enterprises overspent on AI last year, by about 31% on
              average. On a rented platform your only cost lever is using it
              less, which means getting less of the value you bought it for.
            src: "DoiT · AI Spending Survey, 2026"
          - kicker: "The markup"
            heading: "Cents of inference, dollars of rent"
            body: >-
              The work itself is model inference at about $0.03 per agent action
              at published API rates. Everything between that number and your
              invoice is margin on a layer you could own outright.
            src: "Published Claude Sonnet API rates"

      - type: sec-head
        title: "What owning the layer does to the bill"

      - type: caps
        cards:
          - kicker: "Raw inference"
            heading: "Pay the model, not the middleman"
            brand_tone: true
            body: >-
              Your agents call the model directly at API rates. About $0.03 per
              action on Claude Sonnet, and about 70% less on a cheaper frontier
              model. No per-seat markup exists to remove.
          - kicker: "Fixed footprint"
            heading: "A cost base that ignores hiring"
            brand_tone: true
            body: >-
              One self-hosted binary inside your perimeter. The footprint is
              fixed; only inference scales, and it scales with work done, not
              with people employed.
          - kicker: "Price agility"
            heading: "Swap the model, keep the system"
            brand_tone: true
            body: >-
              When a cheaper or better model ships, you switch with a setting.
              Your skills, connectors, rules and audit trail do not change. Your
              bill does.

      - type: prov
        kicker: "Proven in delivery"
        rows:
          - groups:
                - label: "Astound Digital"
                  value: "delivers governed AI to enterprise clients on systemprompt.io."
                - label: "Runs on:"
                  value: "Anthropic · OpenAI · Gemini · Groq · Bedrock · Vertex AI · self-hosted Llama & Qwen"

      - type: cta
        headline:
          - text: "Ask your CFO what you spent on AI seats last quarter. "
          - { text: "Then ask what the same work costs at raw inference.", tone: accent }
        body: >-
          The worked numbers are on page 2. 45 minutes with us and we will run
          them on your headcount.
        email: "ed@systemprompt.io"

  - fill: true
    masthead:
      - { label: Section, value: "The worked numbers" }
      - { label: Licence, value: "BSL-1.1" }
      - { label: Engagement, value: "Training · Platform · Rollout" }
      - { label: Web, value: "systemprompt.io" }
    blocks:
      - type: sec-head
        title: "Rented meter vs owned layer, at your headcount"

      - type: ctable
        headers:
          - "Company size"
          - "Rented platform, per month"
          - "Owned layer, per month"
          - "The difference"
        rows:
          - label:
              - { text: "50 people", tone: bold }
            cells:
              - { text: "$2,000 seats + usage" }
              - { text: "$450 inference + fixed hosting" }
              - { text: "~4x, and it is your ceiling", win: true }
          - label:
              - { text: "200 people", tone: bold }
            cells:
              - { text: "$8,000 seats + usage" }
              - { text: "$1,800 inference + fixed hosting" }
              - { text: "~4x, before a model swap", win: true }
          - label:
              - { text: "1,000 people", tone: bold }
            cells:
              - { text: "$40,000 seats + usage" }
              - { text: "$9,000 inference + fixed hosting" }
              - { text: "~4x, and 70% again on a cheaper model", win: true }

      - type: flow-caption
        variant: after-panel
        label: "Illustrative"
        text: >-
          Rented column assumes $40 per seat per month, the mid-range of
          published enterprise AI platform seat pricing, before metered usage on
          top. Owned column assumes every person runs 300 agent actions per month
          at ~$0.03 per action on Claude Sonnet (about 4,000 input and 1,000
          output tokens per action at published rates of $3 and $15 per million
          tokens), plus a fixed self-hosted footprint. A cheaper frontier model
          runs about 70% lower again, with no change to your governance.

      - type: quote
        text:
          - text: "The rented bill scales with your payroll. "
          - { text: "The owned bill scales with the work.", tone: accent }
          - text: " At 1,000 people, that is the whole argument."

      - type: sec-head
        title: "Three questions to ask your CFO this week"

      - type: qbox
        items:
          - question: "What did we spend on AI seats and metered usage last quarter, and which line goes down if we hire?"
            aside: "(If the answer is \"neither\", you are renting.)"
          - question: "What would the same volume of AI work cost at published API rates?"
            aside: "(The gap between that number and the invoice is the rent.)"
          - question: "If a model 70% cheaper shipped tomorrow, could we switch to it without a migration project?"
            aside: "(On a rented platform, the saving is theirs. On an owned layer, it is yours.)"

      - type: sec-head
        title: "How we roll it out"

      - type: personas
        cards:
          - kicker: "01 · Training"
            heading: "People who know how to use it"
            body: >-
              Role-based training and an exec briefing so each team learns the
              skills built for their work. Adoption that sticks, not software
              that sits on the shelf.
            outcome: "Every team confident on day one."
          - kicker: "02 · Platform"
            heading: "The AI layer, self-hosted"
            body: >-
              The systemprompt.io software runs in your environment, wired to
              your identity and security tooling. One fixed footprint that holds
              every skill, connector and policy.
            outcome: "One place, one predictable cost base."
          - kicker: "03 · Personalized rollout"
            heading: "The right bundle to every person"
            body: >-
              Each person's connectors and skills are bundled for their role and
              pushed to their machine, signed and kept current. No per-seat
              licence attaches to any of it.
            outcome: "Everyone equipped. The bill does not notice."

      - type: cta
        headline:
          - text: "Run these numbers on your actual headcount. "
          - { text: "45 minutes, your figures, no commitment.", tone: accent }
        body: >-
          Bring last quarter's AI invoice. We will put the owned-layer number
          next to it before the session ends.
        email: "ed@systemprompt.io"
