# The air-gap sheet — for sovereign, defence and hardware-integration sites
# where the wire is the boundary.
#
# NORMALISED onto the house style; the content is unchanged.
id: airgap
title: "systemprompt.io · One binary. Zero egress. On the metal."
footer: "AI you own · systemprompt.io"
diagram: airgap-diagram.svg
max_pages: 2

pages:
  - dense: true
    masthead:
      - { label: Document, value: "Air-Gap Factsheet" }
      - { label: Category, value: "Sovereign AI" }
      - { label: Footprint, value: "54 MB · single binary" }
      - { label: Web, value: "systemprompt.io" }
    blocks:
      - type: hero-row
        kicker: "On-the-metal sovereign AI"
        headline:
          - { text: "One binary. " }
          - { text: "Zero egress. On the metal.", tone: accent }
        lede:
          - { text: "A " }
          - { text: "54 MB statically-linked Rust binary", tone: bold }
          - { text: " carries the entire AI control plane " }
          - { text: "and", tone: italic }
          - { text: " execution layer (gateway, four-stage governance, MCP host, scheduler, audit-spine) inside a single process. Drop it onto a sealed network, point it at an on-prem inferencer, and the AI stack runs with " }
          - { text: "no outbound calls and no host-routable interface", tone: bold }
          - { text: " on the engine itself. Built for sovereign, defence, and hardware-integration deployments where the wire is the boundary: copy the binary, supply secrets, run." }
        glance:
          kicker: "At a glance"
          heading: "One binary. On the metal."
          cells:
            - { n: "54 MB", l: "Single Rust binary · control + execution" }
            - { n: "0", l: "Outbound packets · sidecar-asserted" }
            - { n: "1", l: "Host-routable port · socat demarcation" }
            - { n: "5", l: "Containers · sealed stack" }

      - type: sec-head
        title: "Core capabilities"

      - type: caps
        cards:
          - kicker: "Binary"
            heading: "One binary, on the metal"
            body:
              - { text: "54 MB statically-linked Rust binary. Control plane and execution path live in " }
              - { text: "one process", tone: bold }
              - { text: ". No interpreter, no cloud agent. Copy, run, done." }
            pill: { text: "54 MB" }
          - kicker: "Seal"
            heading: "Sealed Docker network"
            body:
              - { text: "internal: true", tone: code }
              - { text: " on the app network. No gateway, no NAT, no host-routable path. The " }
              - { text: "app", tone: code }
              - { text: " container itself never joins a bridge." }
            pill: { text: "Zero egress" }
          - kicker: "Sandbox"
            heading: "Sandboxed control + execution"
            body:
              - { text: "Gateway, 4-stage governance, MCP host, in-network inferencer: all behind the air gap. Un-listed models denied " }
              - { text: "403 pre-connect", tone: bold }
              - { text: "; secret-scan, blocklist, rate-limit in-process." }
            pill: { text: "policy 403", mono: true }
          - kicker: "Install"
            heading: "Hardware-ready install"
            body:
              - { text: "Profile dir mounts " }
              - { text: ":ro", tone: code }
              - { text: ". No boot-time writes, no internet bootstrap. Pre-supplied signing seed, stable identity across power-cycles. Suitable for hardware and disconnected sites." }
            pill: { text: "Build · ship · run" }

      - type: sec-head
        title: "Why sovereign deployments choose systemprompt.io"

      - type: two-col
        left:
          - type: why-list
            items:
              - heading: "Compiled to a single binary you can ship on a USB stick"
                body:
                  - { text: "54 MB statically-linked Rust binary. Gateway, governance, MCP host, scheduler, and audit-spine writers all live inside one process. No interpreter, no sidecar agent, no cloud bootstrap; " }
                  - { text: "copy + run", tone: code }
                  - { text: " is the entire install." }
              - heading: "Control plane and execution co-located behind the air gap"
                body:
                  - { text: "The " }
                  - { text: "app", tone: code }
                  - { text: " is the AI control plane " }
                  - { text: "and", tone: italic }
                  - { text: " the path to the on-prem inferencer (any " }
                  - { text: "/v1/messages", tone: code }
                  - { text: " endpoint). Gateway, governance, audit, and the provider call all happen inside the sealed network. No second hop to SaaS." }
              - heading: "Built for hardware and disconnected sites"
                body:
                  - { text: "Read-only profile mount, no boot-time writes, no start-up outbound calls. Allow-list ships as version-controlled YAML (" }
                  - { text: "services/ai/gateway-policies.yaml", tone: code }
                  - { text: "), ingested at every boot with " }
                  - { text: "delete_orphans: true", tone: code }
                  - { text: ". Re-buildable from source for ITAR or IL-pattern sites." }
        right:
          - type: spec
            rows:
              - key: "Topology"
                value:
                  - { text: "Two networks: " }
                  - { text: "airgap-internal", tone: code }
                  - { text: " (" }
                  - { text: "internal: true", tone: code }
                  - { text: ") and a tiny bridge for the " }
                  - { text: "ingress", tone: code }
                  - { text: " socat. The socat is the only container on both." }
              - key: "Closure proofs"
                value:
                  - { text: "(1) " }
                  - { text: "ss -tunp", tone: code }
                  - { text: " + " }
                  - { text: "conntrack -L", tone: code }
                  - { text: " from a monitor sidecar; (2) in-network responder " }
                  - { text: "/stats", tone: code }
                  - { text: " unchanged on a denied-burst run. Both run by " }
                  - { text: "01-egress-assert.sh", tone: code }
                  - { text: "." }
              - key: "Identity"
                value:
                  - { text: "JWT-bound. RBAC + 4-stage governance pipeline (scope · secret-scan · blocklist · rate-limit) on every " }
                  - { text: "/v1/messages", tone: code }
                  - { text: " call." }
              - key: "Deployment"
                value:
                  - { text: "Build → ship → install. " }
                  - { text: ":ro", tone: code }
                  - { text: " profile dir, no outbound calls required at boot. Pre-supplied signing seed for stable identity across power-cycles. Suitable for hardware integrations and disconnected sites." }
              - key: "Observability"
                value:
                  - { text: "Audit-spine in " }
                  - { text: "your", tone: italic }
                  - { text: " Postgres. Optional OpenTelemetry exporter; no required outbound telemetry path." }
              - key: "Compliance"
                value: >-
                  SOC 2 (CC6.1, CC7.2), ISO 27001 (A.5.15, A.8.3, A.8.25), HIPAA
                  §164.312, EU AI Act Art. 9/12/15, NIST AI RMF, OWASP Agentic
                  Top 10. ITAR / IL-pattern sovereign deployments supported.

      - type: cta
        headline:
          - { text: "Evaluate the air-gap scenario free. " }
          - { text: "Sealed network, runnable on a laptop.", tone: accent }
        body:
          - { text: "just airgap-up", tone: code }
          - { text: " brings up the sealed compose. " }
          - { text: "airgap-test", tone: code }
          - { text: " runs three assertion scripts: egress closure, sealed-network load, four-stage governance in isolation." }
        link: "github.com/systempromptio/systemprompt-template"
        email: "ed@systemprompt.io"

  - dense: true
    masthead:
      - { label: Section, value: "Architecture & Comparison" }
      - { label: Licence, value: "BSL-1.1" }
      - { label: Scenario, value: "Air-gap" }
      - { label: Web, value: "systemprompt.io" }
    blocks:
      - type: sec-head
        title: "Two networks, one demarcation: the sealed topology"

      - type: diagram

      - type: flow-caption
        variant: under-diagram
        label: "One demarcation"
        text: >-
          The ingress socat is the only container on both networks; it forwards
          :8090 → app:8080. The app itself never joins a bridge, so there is no
          host-routable interface for it to egress through, even if its config
          were misconfigured.

      - type: sec-head
        title: "Sovereignty, on infrastructure you own"

      - type: compare
        columns:
          - "Vendor SaaS"
          - "Cloud private"
          - "Air-gap + systemprompt.io"
        highlight: 2
        sections:
          - label: "Closure & residency"
            rows:
              - label: "Outbound calls required"
                cells:
                  - "Yes · vendor cloud"
                  - "Yes · cloud provider"
                  - - { text: "None.", tone: bold }
                    - { text: " " }
                    - { text: "internal: true", tone: code }
                    - { text: " · zero egress" }
              - label: "Data residency"
                cells:
                  - "Vendor jurisdiction"
                  - "Cloud region"
                  - "Your datacenter. Your jurisdiction. ITAR / IL-pattern capable."
              - label: "Deny-path proof"
                cells:
                  - "Vendor attestation"
                  - "Cloud audit log"
                  - - { text: "/stats", tone: code }
                    - { text: " counter unchanged · packet snapshot from sidecar" }
          - label: "Audit & control"
            rows:
              - label: "Allow-list source-of-truth"
                cells:
                  - "Vendor console"
                  - "Hand-seeded SQL / IaC"
                  - - { text: "Version-controlled YAML · ingested every boot · " }
                    - { text: "delete_orphans: true", tone: code }
              - label: "Audit ownership"
                cells:
                  - "Vendor-held"
                  - "OpenTelemetry only"
                  - - { text: "Your Postgres · 4 writes per call · joined by " }
                    - { text: "trace_id", tone: code }

      - type: sec-head
        title: "Built for sovereign and defence deployments"

      - type: personas
        cards:
          - kicker: "For the Sovereignty Officer"
            heading: "The proof is a packet snapshot."
            outcome_label: "Outcome"
            body:
              - { text: "No packet leaves the wall. Closure is asserted by a sidecar on the same sealed network, not by a vendor attestation or a cloud audit log. If the network ever opened, the next " }
              - { text: "01-egress-assert.sh", tone: code }
              - { text: " run would fail closed." }
            outcome: "Sovereignty you can re-prove on demand."
          - kicker: "For the Auditor"
            heading: "One SQL query, full lineage."
            outcome_label: "Outcome"
            body:
              - { text: "Every prompt → every policy decision → every tool call → every cost row, joined by " }
              - { text: "trace_id", tone: code }
              - { text: " to a JWT-verified identity. Run the query against your Postgres; the audit is structured evidence, not a policy document." }
            outcome: "Auditor asks, you run a SQL query."

      - type: cta
        headline:
          - { text: "Read the air-gap scenario walkthrough. " }
          - { text: "Closure proofs, deny-first path, the four-stage governance pipeline.", tone: accent }
        body:
          - { text: "Three runnable scripts: dual-layer egress assertion, sealed-network load + thresholds, four-stage governance in isolation. All artifacts under " }
          - { text: "results/", tone: code }
          - { text: "." }
        link: "demo/scenarios/airgap/architecture.md"
