<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" font-family="Inter, system-ui, sans-serif">
  <title>Scaled deployment — load-balanced API replicas, isolated scheduler, primary/replica Postgres</title>

  <!-- ============ ZONE 1: INGRESS ============ -->
  <rect x="8" y="8" width="220" height="280" rx="14" fill="#FAFAF9" stroke="#E9E5DD" stroke-width="1"/>
  <path d="M 8 22 A 14 14 0 0 1 22 8 L 214 8 A 14 14 0 0 1 228 22 L 8 22 Z" fill="#2A6FB5"/>

  <text x="24" y="34" font-size="9.5" font-weight="700" fill="#2A6FB5" letter-spacing="1.6">INGRESS</text>
  <text x="24" y="48" font-size="8" fill="#55606E">One published port · TLS edge</text>

  <!-- Operator -->
  <rect x="24" y="62" width="188" height="40" rx="10" fill="#ffffff" stroke="#E9E5DD"/>
  <rect x="204" y="62" width="8" height="8" fill="#ffffff" stroke="#E9E5DD"/>
  <text x="38" y="80" font-size="10.5" font-weight="700" fill="#0F172A">Operator · MDM-sealed client</text>
  <text x="38" y="93" font-size="7.5" fill="#55606E" font-family="ui-monospace, monospace">HTTPS → :8088 (only published port)</text>

  <!-- LB -->
  <rect x="24" y="118" width="188" height="80" rx="10" fill="#ffffff" stroke="#2A6FB5"/>
  <text x="118" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#2A6FB5">nginx LB</text>
  <text x="118" y="153" text-anchor="middle" font-size="7.5" fill="#55606E">round-robin upstream app:8080</text>
  <text x="118" y="167" text-anchor="middle" font-size="7" fill="#55606E" font-family="ui-monospace, monospace">proxy_buffering off</text>
  <text x="118" y="178" text-anchor="middle" font-size="7" fill="#55606E" font-family="ui-monospace, monospace">proxy_read_timeout 3600s · SSE-tuned</text>
  <text x="118" y="191" text-anchor="middle" font-size="7" fill="#55606E" font-family="ui-monospace, monospace">resolver 127.0.0.11 (docker DNS)</text>

  <!-- x-served-by tag -->
  <rect x="24" y="214" width="188" height="58" rx="10" fill="#FFF6EF" stroke="#F38318"/>
  <text x="118" y="232" text-anchor="middle" font-size="7" font-weight="700" fill="#F38318" letter-spacing="1.4">REPLICA WITNESS</text>
  <text x="118" y="247" text-anchor="middle" font-size="9" font-weight="700" fill="#0F172A" font-family="ui-monospace, monospace">x-served-by: &lt;replica-id&gt;</text>
  <text x="118" y="260" text-anchor="middle" font-size="7.5" fill="#55606E">stamped by served_by middleware</text>

  <!-- ============ ZONE 2: API REPLICAS + SCHEDULER (the RBAC boundary) ============ -->
  <rect x="282" y="8" width="346" height="280" rx="14" fill="#FFF6EF" stroke="#F38318" stroke-width="1"/>
  <path d="M 282 22 A 14 14 0 0 1 296 8 L 614 8 A 14 14 0 0 1 628 22 L 282 22 Z" fill="#F38318"/>

  <text x="298" y="34" font-size="9.5" font-weight="700" fill="#F38318" letter-spacing="1.6">SCALED API TIER · RBAC ENFORCED PER CALL</text>
  <text x="298" y="48" font-size="8" fill="#55606E">Stateless replicas · cross-replica event bridge · one audit spine</text>

  <!-- RBAC banner -->
  <rect x="298" y="62" width="314" height="34" rx="10" fill="#ffffff" stroke="#F38318"/>
  <text x="455" y="78" text-anchor="middle" font-size="10" font-weight="700" fill="#F38318" font-family="ui-monospace, monospace">PolicyResolver.resolve()</text>
  <text x="455" y="90" text-anchor="middle" font-size="7.5" fill="#55606E">per-user/per-role gateway policy · 60s cache · ai_gateway_policies</text>

  <!-- 3 stateless app replicas -->
  <rect x="298" y="106" width="98" height="70" rx="10" fill="#ffffff" stroke="#F38318"/>
  <text x="347" y="124" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">app #1</text>
  <text x="347" y="137" text-anchor="middle" font-size="7.5" fill="#55606E">stateless</text>
  <text x="347" y="149" text-anchor="middle" font-size="6.8" fill="#55606E" font-family="ui-monospace, monospace">sched OFF</text>
  <rect x="312" y="156" width="70" height="14" rx="3" fill="#FFE8D5"/>
  <text x="347" y="166" text-anchor="middle" font-size="7" font-weight="700" fill="#F38318" font-family="ui-monospace, monospace">x-served-by:1</text>

  <rect x="406" y="106" width="98" height="70" rx="10" fill="#ffffff" stroke="#F38318"/>
  <text x="455" y="124" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">app #2</text>
  <text x="455" y="137" text-anchor="middle" font-size="7.5" fill="#55606E">stateless</text>
  <text x="455" y="149" text-anchor="middle" font-size="6.8" fill="#55606E" font-family="ui-monospace, monospace">sched OFF</text>
  <rect x="420" y="156" width="70" height="14" rx="3" fill="#FFE8D5"/>
  <text x="455" y="166" text-anchor="middle" font-size="7" font-weight="700" fill="#F38318" font-family="ui-monospace, monospace">x-served-by:2</text>

  <rect x="514" y="106" width="98" height="70" rx="10" fill="#ffffff" stroke="#F38318"/>
  <text x="563" y="124" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">app #N</text>
  <text x="563" y="137" text-anchor="middle" font-size="7.5" fill="#55606E">stateless</text>
  <text x="563" y="149" text-anchor="middle" font-size="6.8" fill="#55606E" font-family="ui-monospace, monospace">sched OFF</text>
  <rect x="528" y="156" width="70" height="14" rx="3" fill="#FFE8D5"/>
  <text x="563" y="166" text-anchor="middle" font-size="7" font-weight="700" fill="#F38318" font-family="ui-monospace, monospace">x-served-by:N</text>

  <!-- Event bridge bar across the replicas -->
  <rect x="298" y="184" width="314" height="22" rx="6" fill="#FAFAF9" stroke="#F38318" stroke-opacity="0.5"/>
  <text x="455" y="199" text-anchor="middle" font-size="8" font-weight="700" fill="#0F172A" font-family="ui-monospace, monospace">PostgresEventBridge · LISTEN/NOTIFY · SSE survives any replica</text>

  <!-- Isolated scheduler -->
  <rect x="298" y="216" width="208" height="58" rx="10" fill="#ffffff" stroke="#F38318"/>
  <text x="402" y="234" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">scheduler · deploy.replicas: 1</text>
  <text x="402" y="248" text-anchor="middle" font-size="7.5" fill="#55606E">the one and only node that runs cron</text>
  <text x="402" y="262" text-anchor="middle" font-size="7" fill="#55606E" font-family="ui-monospace, monospace">scheduler-disabled.config.yaml mounted on app replicas</text>

  <!-- governance chip -->
  <rect x="516" y="216" width="96" height="58" rx="10" fill="#FAFAF9" stroke="#F38318" stroke-opacity="0.6"/>
  <text x="564" y="233" text-anchor="middle" font-size="8" font-weight="700" fill="#F38318" letter-spacing="1">FOUR CHECKS</text>
  <text x="564" y="246" text-anchor="middle" font-size="7" fill="#55606E">scope · secrets</text>
  <text x="564" y="257" text-anchor="middle" font-size="7" fill="#55606E">policy · quota</text>
  <text x="564" y="269" text-anchor="middle" font-size="6.8" font-weight="700" fill="#0F172A">per call · &lt;1ms</text>

  <!-- ============ ZONE 3: POSTGRES TIER ============ -->
  <rect x="682" y="8" width="210" height="280" rx="14" fill="#F7FBF8" stroke="#D4E8DA" stroke-width="1"/>
  <path d="M 682 22 A 14 14 0 0 1 696 8 L 878 8 A 14 14 0 0 1 892 22 L 682 22 Z" fill="#158A54"/>

  <text x="698" y="34" font-size="9.5" font-weight="700" fill="#158A54" letter-spacing="1.6">AUDIT SPINE</text>
  <text x="698" y="48" font-size="8" fill="#55606E">Single trace_id across the fleet</text>

  <!-- Primary -->
  <rect x="698" y="62" width="178" height="78" rx="10" fill="#ffffff" stroke="#158A54"/>
  <text x="787" y="80" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0F172A" font-family="ui-monospace, monospace">postgres-primary</text>
  <text x="787" y="94" text-anchor="middle" font-size="7.5" fill="#55606E">all writes · audit_events</text>
  <text x="787" y="106" text-anchor="middle" font-size="7" fill="#55606E" font-family="ui-monospace, monospace">wal_level=replica</text>
  <text x="787" y="118" text-anchor="middle" font-size="7" fill="#55606E" font-family="ui-monospace, monospace">max_wal_senders=10</text>
  <text x="787" y="132" text-anchor="middle" font-size="7.5" font-weight="700" fill="#158A54">trace_id joins every replica</text>

  <!-- Replication arrow -->
  <line x1="787" y1="144" x2="787" y2="166" stroke="#158A54" stroke-width="2"/>
  <path d="M 783 162 L 787 170 L 791 162 Z" fill="#158A54"/>
  <text x="787" y="160" text-anchor="middle" font-size="6.8" fill="#158A54" font-family="ui-monospace, monospace">streaming WAL</text>

  <!-- Replica (ghosted) -->
  <rect x="698" y="170" width="178" height="56" rx="10" fill="#FAFAF9" stroke="#D4E8DA" stroke-dasharray="4,3"/>
  <text x="787" y="188" text-anchor="middle" font-size="10.5" font-weight="700" fill="#55606E" font-family="ui-monospace, monospace">postgres-replica</text>
  <text x="787" y="201" text-anchor="middle" font-size="7.5" fill="#55606E">hot standby · pg_basebackup -R</text>
  <text x="787" y="214" text-anchor="middle" font-size="7" fill="#8893A3" font-style="italic">wired for failover headroom</text>
  <text x="787" y="222" text-anchor="middle" font-size="7" fill="#8893A3" font-style="italic">(not yet routed for reads)</text>

  <!-- audit_events summary -->
  <rect x="698" y="234" width="178" height="42" rx="10" fill="#F7FBF8" stroke="#D4E8DA"/>
  <text x="787" y="251" text-anchor="middle" font-size="7" font-weight="700" fill="#158A54" letter-spacing="1.4">ONE AUDIT TRAIL</text>
  <text x="787" y="265" text-anchor="middle" font-size="7.5" fill="#0F172A">prompt → tool → MCP → cost</text>

  <!-- ============ FLOW ARROWS ============ -->
  <!-- Ingress → API -->
  <rect x="232" y="158" width="44" height="8" fill="#0F172A"/>
  <path d="M 276 150 L 290 162 L 276 174 Z" fill="#0F172A"/>
  <text x="254" y="144" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F172A" letter-spacing="1">REQUEST</text>
  <text x="254" y="188" text-anchor="middle" font-size="7.5" fill="#55606E" font-family="ui-monospace, monospace">JWT · role-bound</text>

  <!-- API → Postgres -->
  <rect x="632" y="158" width="44" height="8" fill="#0F172A"/>
  <path d="M 676 150 L 690 162 L 676 174 Z" fill="#0F172A"/>
  <text x="654" y="144" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F172A" letter-spacing="1">AUDIT</text>
  <text x="654" y="188" text-anchor="middle" font-size="7.5" fill="#55606E" font-family="ui-monospace, monospace">trace_id-tagged</text>

  <!-- Caption -->
  <text x="450" y="315" text-anchor="middle" font-size="9" font-weight="700" fill="#0F172A" letter-spacing="1.4">RBAC AT THE BOUNDARY · N REPLICAS · ONE AUDIT TRAIL · ONE SCHEDULER</text>
  <line x1="282" y1="324" x2="618" y2="324" stroke="#F38318" stroke-width="1.5"/>
</svg>
