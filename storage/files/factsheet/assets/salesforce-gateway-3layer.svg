<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" role="img" font-family="Inter, system-ui, sans-serif">
  <title>Multi-tenant gateway architecture: client tenants, your gateway, upstream providers</title>
  <!-- Light house style: no dark ground, flat fills only, inline attributes only
       (WeasyPrint ignores <style> blocks inside SVG). Sits full-bleed on paper. -->

  <!-- ============ LAYER 3: YOUR CLIENTS ============ -->
  <rect x="4" y="6" width="252" height="188" rx="10" fill="#FFFFFF" stroke="#E9E5DD" stroke-width="1"/>
  <path d="M 4 16 A 10 10 0 0 1 14 6 L 246 6 A 10 10 0 0 1 256 16 L 256 22 L 4 22 Z" fill="#57534E"/>
  <text x="20" y="17" font-size="8.5" font-weight="700" fill="#FFFFFF" letter-spacing="1.3">LAYER 3 · YOUR CLIENTS</text>
  <text x="20" y="35" font-size="7.5" fill="#55606E">One tenant each · isolated · your brand</text>

  <rect x="20" y="42" width="220" height="28" rx="6" fill="#FAFAF9" stroke="#E9E5DD"/>
  <text x="32" y="54" font-size="8.5" font-weight="700" fill="#0F172A">Client A</text>
  <text x="32" y="65" font-size="7" fill="#55606E">3,000 people · Windows, macOS, Linux</text>

  <rect x="20" y="74" width="220" height="26" rx="6" fill="#FAFAF9" stroke="#E9E5DD"/>
  <text x="32" y="86" font-size="8.5" font-weight="700" fill="#0F172A">Client B</text>
  <text x="32" y="96" font-size="7" fill="#55606E">400 people · its own policy and audit</text>

  <rect x="20" y="104" width="220" height="26" rx="6" fill="#FAFAF9" stroke="#E9E5DD"/>
  <text x="32" y="116" font-size="8.5" font-weight="700" fill="#0F172A">Client C</text>
  <text x="32" y="126" font-size="7" fill="#55606E">120 people · same hub, separate data</text>

  <rect x="20" y="136" width="220" height="50" rx="6" fill="#FFF6EF" stroke="#F5D9C2"/>
  <rect x="20" y="136" width="2.5" height="50" fill="#F38318"/>
  <text x="32" y="149" font-size="6.5" font-weight="700" fill="#C46610" letter-spacing="1.2">THE BRIDGE · ONE CLICK</text>
  <text x="32" y="161" font-size="8" font-weight="700" fill="#0F172A">Installed once per device.</text>
  <text x="32" y="172" font-size="7" fill="#55606E">Skills, connectors and policy sync down,</text>
  <text x="32" y="181" font-size="7" fill="#55606E">signed and versioned. No manual setup.</text>

  <!-- ============ LAYER 2: YOUR GATEWAY ============ -->
  <rect x="322" y="6" width="256" height="188" rx="10" fill="#FFFFFF" stroke="#F38318" stroke-width="1"/>
  <path d="M 322 16 A 10 10 0 0 1 332 6 L 568 6 A 10 10 0 0 1 578 16 L 578 22 L 322 22 Z" fill="#F38318"/>
  <text x="338" y="17" font-size="8.5" font-weight="700" fill="#FFFFFF" letter-spacing="1.3">LAYER 2 · YOUR GATEWAY</text>
  <text x="338" y="35" font-size="7.5" fill="#55606E">One hub you run · multi-tenant · your brand</text>

  <rect x="338" y="42" width="224" height="26" rx="6" fill="#FAFAF9" stroke="#E9E5DD"/>
  <text x="450" y="54" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F172A">One endpoint</text>
  <text x="450" y="64" text-anchor="middle" font-size="7" fill="#55606E" font-family="ui-monospace, monospace">/v1/messages</text>

  <text x="450" y="80" text-anchor="middle" font-size="6.5" font-weight="700" fill="#55606E" letter-spacing="0.5">Every call is governed by extendable code that we manage.</text>

  <rect x="338" y="86" width="53" height="26" rx="5" fill="#FFF6EF" stroke="#F5D9C2"/>
  <text x="364" y="98" text-anchor="middle" font-size="7" font-weight="700" fill="#C46610">Scope</text>
  <text x="364" y="107" text-anchor="middle" font-size="6" fill="#55606E">by role</text>

  <rect x="395" y="86" width="53" height="26" rx="5" fill="#FFF6EF" stroke="#F5D9C2"/>
  <text x="421" y="98" text-anchor="middle" font-size="7" font-weight="700" fill="#C46610">Secrets</text>
  <text x="421" y="107" text-anchor="middle" font-size="6" fill="#55606E">35+ patterns</text>

  <rect x="452" y="86" width="53" height="26" rx="5" fill="#FFF6EF" stroke="#F5D9C2"/>
  <text x="478" y="98" text-anchor="middle" font-size="7" font-weight="700" fill="#C46610">Blocklist</text>
  <text x="478" y="107" text-anchor="middle" font-size="6" fill="#55606E">per tenant</text>

  <rect x="509" y="86" width="53" height="26" rx="5" fill="#FFF6EF" stroke="#F5D9C2"/>
  <text x="535" y="98" text-anchor="middle" font-size="7" font-weight="700" fill="#C46610">Rate</text>
  <text x="535" y="107" text-anchor="middle" font-size="6" fill="#55606E">per session</text>

  <rect x="338" y="118" width="224" height="30" rx="6" fill="#FAFAF9" stroke="#E9E5DD"/>
  <text x="450" y="130" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F172A">You hold the credentials</text>
  <text x="450" y="141" text-anchor="middle" font-size="7" fill="#55606E">Your commercial keys upstream. No per-seat licence.</text>

  <rect x="338" y="152" width="224" height="34" rx="6" fill="#FFF6EF" stroke="#F5D9C2"/>
  <rect x="338" y="152" width="2.5" height="34" fill="#F38318"/>
  <text x="452" y="164" text-anchor="middle" font-size="6.5" font-weight="700" fill="#C46610" letter-spacing="1.2">YOUR DATABASE</text>
  <text x="452" y="175" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0F172A">Every token in and out, recorded.</text>
  <text x="452" y="184" text-anchor="middle" font-size="6.5" fill="#55606E">Identity, tenant, model, cost, latency, outcome.</text>

  <!-- ============ LAYER 1: UPSTREAM ============ -->
  <rect x="644" y="6" width="252" height="188" rx="10" fill="#FFFFFF" stroke="#CFE1F1" stroke-width="1"/>
  <path d="M 644 16 A 10 10 0 0 1 654 6 L 886 6 A 10 10 0 0 1 896 16 L 896 22 L 644 22 Z" fill="#2A6FB5"/>
  <text x="660" y="17" font-size="8.5" font-weight="700" fill="#FFFFFF" letter-spacing="1.3">LAYER 1 · UPSTREAM</text>
  <text x="660" y="35" font-size="7.5" fill="#55606E">Any model, any host, or your own hardware</text>

  <rect x="660" y="42" width="220" height="26" rx="6" fill="#FAFAF9" stroke="#E9E5DD"/>
  <text x="770" y="54" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F172A">Swap without re-governing</text>
  <text x="770" y="64" text-anchor="middle" font-size="7" fill="#55606E">Change the model, keep every rule and record</text>

  <rect x="660" y="74" width="106" height="24" rx="5" fill="#FAFAF9" stroke="#E9E5DD"/>
  <text x="713" y="85" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0F172A">Anthropic</text>
  <text x="713" y="94" text-anchor="middle" font-size="6" fill="#55606E">Claude</text>

  <rect x="774" y="74" width="106" height="24" rx="5" fill="#FAFAF9" stroke="#E9E5DD"/>
  <text x="827" y="85" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0F172A">OpenAI</text>
  <text x="827" y="94" text-anchor="middle" font-size="6" fill="#55606E">GPT · Codex</text>

  <rect x="660" y="102" width="106" height="24" rx="5" fill="#FAFAF9" stroke="#E9E5DD"/>
  <text x="713" y="113" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0F172A">Google</text>
  <text x="713" y="122" text-anchor="middle" font-size="6" fill="#55606E">Gemini</text>

  <rect x="774" y="102" width="106" height="24" rx="5" fill="#FAFAF9" stroke="#E9E5DD"/>
  <text x="827" y="113" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0F172A">Open weights</text>
  <text x="827" y="122" text-anchor="middle" font-size="6" fill="#55606E">Kimi · Qwen · Llama</text>

  <rect x="660" y="130" width="220" height="20" rx="5" fill="#FAFAF9" stroke="#E9E5DD"/>
  <text x="770" y="140" text-anchor="middle" font-size="6.4" fill="#55606E">Hosted by Groq, Cerebras, Fireworks, Bedrock,</text>
  <text x="770" y="147" text-anchor="middle" font-size="6.4" fill="#55606E">Vertex AI, Azure Foundry, or your own GPUs</text>

  <rect x="660" y="154" width="220" height="32" rx="6" fill="#F3F8FC" stroke="#CFE1F1"/>
  <rect x="660" y="154" width="2.5" height="32" fill="#2A6FB5"/>
  <text x="772" y="166" text-anchor="middle" font-size="6.5" font-weight="700" fill="#2A6FB5" letter-spacing="1.2">SYSTEMS OF RECORD</text>
  <text x="772" y="178" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0F172A">Salesforce and the rest of the stack</text>

  <!-- ============ FLOW ============ -->
  <rect x="262" y="104" width="42" height="6" fill="#C8C2BC"/>
  <path d="M 304 99 L 316 107 L 304 115 Z" fill="#C8C2BC"/>
  <text x="284" y="93" text-anchor="middle" font-size="7" font-weight="700" fill="#0F172A" letter-spacing="0.8">TENANT</text>
  <text x="284" y="127" text-anchor="middle" font-size="6.5" fill="#8893A3" font-family="ui-monospace, monospace">identified</text>

  <rect x="584" y="104" width="16" height="6" fill="#C8C2BC"/>
  <rect x="604" y="88" width="5" height="38" fill="#F38318"/>
  <rect x="613" y="104" width="17" height="6" fill="#C8C2BC"/>
  <path d="M 630 99 L 642 107 L 630 115 Z" fill="#C8C2BC"/>
  <text x="607" y="82" text-anchor="middle" font-size="6.5" font-weight="700" fill="#C46610" letter-spacing="0.4">YOUR KEY</text>
  <text x="607" y="140" text-anchor="middle" font-size="6.5" fill="#8893A3" font-family="ui-monospace, monospace">metered to you</text>

  <!-- Caption -->
  <line x1="250" y1="208" x2="650" y2="208" stroke="#F38318" stroke-width="1.5"/>
  <text x="450" y="224" text-anchor="middle" font-size="8" font-weight="700" fill="#0F172A" letter-spacing="1.2">ONE HUB · EVERY CLIENT A TENANT · NO PER-SEAT LICENCE IN THE MIDDLE</text>
</svg>
