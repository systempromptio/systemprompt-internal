<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" font-family="Inter, system-ui, sans-serif">
  <title>Enterprise Cowork governed deployment</title>

  <!-- ============ ZONE 1: MANAGED DEVICE ============ -->
  <rect x="8" y="8" width="260" height="280" rx="14" fill="#FAFAF9" stroke="#E9E5DD" stroke-width="1"/>
  <path d="M 8 22 A 14 14 0 0 1 22 8 L 254 8 A 14 14 0 0 1 268 22 L 8 22 Z" fill="#2A6FB5"/>

  <text x="24" y="34" font-size="9.5" font-weight="700" fill="#2A6FB5" letter-spacing="1.6">MANAGED DEVICE</text>
  <text x="24" y="48" font-size="8" fill="#55606E">Windows · macOS · Linux · sealed by your MDM</text>

  <!-- Cowork app -->
  <rect x="24" y="62" width="228" height="58" rx="10" fill="#ffffff" stroke="#E9E5DD"/>
  <rect x="244" y="62" width="8" height="8" fill="#ffffff" stroke="#E9E5DD"/>
  <text x="38" y="82" font-size="11" font-weight="700" fill="#0F172A">Claude Cowork</text>
  <text x="38" y="97" font-size="8" fill="#55606E">Anthropic's client, unmodified.</text>
  <text x="38" y="112" font-size="7.5" fill="#0F172A" font-family="ui-monospace, monospace">inferenceProvider = gateway</text>

  <!-- 5 managed prefs -->
  <rect x="24" y="130" width="228" height="50" rx="10" fill="#ffffff" stroke="#E9E5DD"/>
  <text x="38" y="149" font-size="10" font-weight="700" fill="#0F172A">5 managed preferences</text>
  <text x="38" y="163" font-size="7.5" fill="#55606E" font-family="ui-monospace, monospace">inferenceProvider · inferenceGatewayBaseUrl</text>
  <text x="38" y="173" font-size="7.5" fill="#55606E" font-family="ui-monospace, monospace">inferenceCredentialHelper · TtlSec · AuthScheme</text>

  <!-- credential helper -->
  <rect x="24" y="190" width="228" height="42" rx="10" fill="#ffffff" stroke="#E9E5DD"/>
  <text x="38" y="209" font-size="10" font-weight="700" fill="#0F172A">Credential helper</text>
  <text x="38" y="223" font-size="7.5" fill="#55606E">mints JWT per call · token in OS keystore</text>

  <!-- org-plugins mount -->
  <rect x="24" y="242" width="228" height="38" rx="10" fill="#ffffff" stroke="#E9E5DD"/>
  <text x="38" y="259" font-size="10" font-weight="700" fill="#0F172A">org-plugins mount</text>
  <text x="38" y="272" font-size="7.5" fill="#55606E">Ed25519-signed · atomic stage-then-rename</text>

  <!-- ============ ZONE 2: ENTERPRISE GATEWAY ============ -->
  <rect x="322" y="8" width="256" height="280" rx="14" fill="#FFF6EF" stroke="#F38318" stroke-width="1"/>
  <path d="M 322 22 A 14 14 0 0 1 336 8 L 564 8 A 14 14 0 0 1 578 22 L 322 22 Z" fill="#F38318"/>

  <text x="338" y="34" font-size="9.5" font-weight="700" fill="#F38318" letter-spacing="1.6">ENTERPRISE GATEWAY</text>
  <text x="338" y="48" font-size="8" fill="#55606E">Your VPC · BSL-1.1 · single Rust binary</text>

  <!-- Endpoint -->
  <rect x="338" y="62" width="224" height="36" rx="10" fill="#ffffff" stroke="#F38318"/>
  <text x="450" y="78" text-anchor="middle" font-size="10" font-weight="700" fill="#F38318" font-family="ui-monospace, monospace">POST /v1/messages</text>
  <text x="450" y="90" text-anchor="middle" font-size="7.5" fill="#55606E">Anthropic wire format · bearer JWT</text>

  <!-- 4 check chips -->
  <text x="450" y="115" text-anchor="middle" font-size="7" font-weight="700" fill="#0F172A" letter-spacing="1.4">GOVERNANCE · FOUR CHECKS &lt;1MS</text>

  <rect x="338" y="122" width="52" height="38" rx="8" fill="#ffffff" stroke="#F38318" stroke-opacity="0.5"/>
  <text x="364" y="139" text-anchor="middle" font-size="9.5" font-weight="700" fill="#F38318">Scope</text>
  <text x="364" y="152" text-anchor="middle" font-size="7" fill="#55606E">RBAC · role</text>

  <rect x="394" y="122" width="52" height="38" rx="8" fill="#ffffff" stroke="#F38318" stroke-opacity="0.5"/>
  <text x="420" y="139" text-anchor="middle" font-size="9.5" font-weight="700" fill="#F38318">Secrets</text>
  <text x="420" y="152" text-anchor="middle" font-size="7" fill="#55606E">scan · inject</text>

  <rect x="450" y="122" width="52" height="38" rx="8" fill="#ffffff" stroke="#F38318" stroke-opacity="0.5"/>
  <text x="476" y="139" text-anchor="middle" font-size="9.5" font-weight="700" fill="#F38318">Policy</text>
  <text x="476" y="152" text-anchor="middle" font-size="7" fill="#55606E">blocklist</text>

  <rect x="506" y="122" width="56" height="38" rx="8" fill="#ffffff" stroke="#F38318" stroke-opacity="0.5"/>
  <text x="534" y="139" text-anchor="middle" font-size="9.5" font-weight="700" fill="#F38318">Quota</text>
  <text x="534" y="152" text-anchor="middle" font-size="7" fill="#55606E">per user/tool</text>

  <!-- audit_events -->
  <rect x="338" y="170" width="224" height="52" rx="10" fill="#ffffff" stroke="#F38318"/>
  <text x="450" y="188" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0F172A" font-family="ui-monospace, monospace">audit_events</text>
  <text x="450" y="202" text-anchor="middle" font-size="7.5" fill="#55606E">tenant · user · trace_id · model · tokens</text>
  <text x="450" y="213" text-anchor="middle" font-size="7.5" fill="#55606E">cost_micro · policy_version · outcome</text>

  <!-- Router -->
  <rect x="338" y="232" width="224" height="34" rx="10" fill="#ffffff" stroke="#F38318"/>
  <text x="450" y="249" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Router</text>
  <text x="450" y="261" text-anchor="middle" font-size="7.5" fill="#55606E">per-call · per-dept · per-region · per-cost</text>

  <!-- ============ ZONE 3: UPSTREAM INFERENCE ============ -->
  <rect x="632" y="8" width="260" height="280" rx="14" fill="#F7FBF8" stroke="#D4E8DA" stroke-width="1"/>
  <path d="M 632 22 A 14 14 0 0 1 646 8 L 878 8 A 14 14 0 0 1 892 22 L 632 22 Z" fill="#158A54"/>

  <text x="648" y="34" font-size="9.5" font-weight="700" fill="#158A54" letter-spacing="1.6">UPSTREAM INFERENCE</text>
  <text x="648" y="48" font-size="8" fill="#55606E">Pluggable · swappable · your contracts</text>

  <!-- Provider grid -->
  <rect x="648" y="62" width="74" height="36" rx="10" fill="#ffffff" stroke="#D4E8DA"/>
  <text x="685" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Anthropic</text>
  <text x="685" y="92" text-anchor="middle" font-size="7.5" fill="#55606E">direct</text>

  <rect x="726" y="62" width="74" height="36" rx="10" fill="#ffffff" stroke="#D4E8DA"/>
  <text x="763" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Bedrock</text>
  <text x="763" y="92" text-anchor="middle" font-size="7.5" fill="#55606E">AWS</text>

  <rect x="804" y="62" width="72" height="36" rx="10" fill="#ffffff" stroke="#D4E8DA"/>
  <text x="840" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Vertex</text>
  <text x="840" y="92" text-anchor="middle" font-size="7.5" fill="#55606E">GCP</text>

  <rect x="648" y="102" width="74" height="36" rx="10" fill="#ffffff" stroke="#D4E8DA"/>
  <text x="685" y="120" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Azure</text>
  <text x="685" y="132" text-anchor="middle" font-size="7.5" fill="#55606E">Foundry</text>

  <rect x="726" y="102" width="74" height="36" rx="10" fill="#ffffff" stroke="#D4E8DA"/>
  <text x="763" y="120" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">OpenAI</text>
  <text x="763" y="132" text-anchor="middle" font-size="7.5" fill="#55606E">direct</text>

  <rect x="804" y="102" width="72" height="36" rx="10" fill="#ffffff" stroke="#D4E8DA"/>
  <text x="840" y="120" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Groq</text>
  <text x="840" y="132" text-anchor="middle" font-size="7.5" fill="#55606E">fast lane</text>

  <!-- On-prem -->
  <rect x="648" y="148" width="228" height="46" rx="10" fill="#ffffff" stroke="#158A54"/>
  <text x="762" y="166" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">On-prem vLLM · Llama · Qwen</text>
  <text x="762" y="179" text-anchor="middle" font-size="7.5" fill="#55606E">air-gap capable · sovereign-cloud capable</text>
  <text x="762" y="189" text-anchor="middle" font-size="7.5" fill="#55606E">Gemini supported · any /v1/messages</text>

  <!-- What upstream receives -->
  <rect x="648" y="204" width="228" height="62" rx="10" fill="#F7FBF8" stroke="#D4E8DA"/>
  <text x="762" y="221" text-anchor="middle" font-size="7" font-weight="700" fill="#158A54" letter-spacing="1.6">UPSTREAM RECEIVES</text>
  <text x="762" y="236" text-anchor="middle" font-size="9" font-weight="700" fill="#0F172A">Prompt content only.</text>
  <text x="762" y="250" text-anchor="middle" font-size="7.5" fill="#55606E">Never your users, sessions or tenants.</text>
  <text x="762" y="260" text-anchor="middle" font-size="7.5" fill="#55606E">Share one cloud account across the fleet.</text>

  <!-- ============ FLOW ARROWS ============ -->
  <!-- Device → Gateway -->
  <rect x="272" y="158" width="44" height="8" fill="#0F172A"/>
  <path d="M 316 150 L 328 162 L 316 174 Z" fill="#0F172A"/>
  <text x="294" y="144" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F172A" letter-spacing="1">REQUEST</text>
  <text x="294" y="188" text-anchor="middle" font-size="7.5" fill="#55606E" font-family="ui-monospace, monospace">JWT + headers</text>

  <!-- Gateway → Upstream with boundary wall -->
  <rect x="584" y="158" width="18" height="8" fill="#0F172A"/>
  <rect x="604" y="136" width="6" height="52" fill="#F38318"/>
  <rect x="612" y="158" width="18" height="8" fill="#0F172A" fill-opacity="0.45"/>
  <path d="M 630 150 L 642 162 L 630 174 Z" fill="#0F172A" fill-opacity="0.45"/>
  <text x="607" y="124" text-anchor="middle" font-size="8" font-weight="700" fill="#F38318" letter-spacing="1">IDENTITY STOPS</text>
  <text x="607" y="206" text-anchor="middle" font-size="7" fill="#55606E" font-family="ui-monospace, monospace">prompt only</text>

  <!-- Response paths -->
  <line x1="628" y1="248" x2="586" y2="248" stroke="#8893A3" stroke-width="2" stroke-dasharray="4,3"/>
  <path d="M 586 243 L 576 248 L 586 253 Z" fill="#8893A3"/>
  <text x="607" y="264" text-anchor="middle" font-size="7.5" fill="#8893A3" font-family="ui-monospace, monospace">response</text>

  <line x1="316" y1="248" x2="274" y2="248" stroke="#8893A3" stroke-width="2" stroke-dasharray="4,3"/>
  <path d="M 274 243 L 264 248 L 274 253 Z" fill="#8893A3"/>
  <text x="295" y="264" text-anchor="middle" font-size="7.5" fill="#8893A3" font-family="ui-monospace, monospace">response</text>

  <!-- Caption -->
  <text x="450" y="315" text-anchor="middle" font-size="9" font-weight="700" fill="#0F172A" letter-spacing="1.4">THREE ZONES · ONE AUDIT LOG · ONE BOUNDARY FOR IDENTITY</text>
  <line x1="282" y1="324" x2="618" y2="324" stroke="#F38318" stroke-width="1.5"/>
</svg>
