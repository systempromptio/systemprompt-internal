<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" font-family="Inter, system-ui, sans-serif">
  <title>Governed three-layer architecture: your people, your AI layer, your systems</title>
  <defs>
    <radialGradient id="glow" cx="100%" cy="0%" r="85%">
      <stop offset="0%" stop-color="#F38318" stop-opacity="0.12"/>
      <stop offset="55%" stop-color="#F38318" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- light glass panel ground -->
  <rect x="0" y="0" width="900" height="330" rx="16" fill="#FFFFFF" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1"/>
  <rect x="0" y="0" width="900" height="330" rx="16" fill="url(#glow)"/>

  <!-- ============ LAYER 3: YOUR PEOPLE ============ -->
  <rect x="8" y="8" width="248" height="280" rx="14" fill="#FFFFFF" fill-opacity="0.7" stroke="#E9E5DD" stroke-width="1"/>
  <path d="M 8 22 A 14 14 0 0 1 22 8 L 242 8 A 14 14 0 0 1 256 22 L 8 22 Z" fill="#57534E"/>

  <text x="24" y="34" font-size="9.5" font-weight="700" fill="#57534E" letter-spacing="1.6">LAYER 3 · YOUR PEOPLE</text>
  <text x="24" y="48" font-size="8" fill="#55606E">The agent they already use, governed</text>

  <!-- person glyph -->
  <circle cx="132" cy="104" r="22" fill="#F3F0EA" stroke="#D8D2CA"/>
  <circle cx="132" cy="96" r="8" fill="#8893A3"/>
  <path d="M 116 118 C 116 106, 124 102, 132 102 C 140 102, 148 106, 148 118 Z" fill="#8893A3"/>

  <rect x="24" y="142" width="216" height="40" rx="10" fill="#FBFAF8" stroke="#E9E5DD"/>
  <text x="38" y="161" font-size="10" font-weight="700" fill="#0F172A">Claude, Codex or your own</text>
  <text x="38" y="175" font-size="7.5" fill="#55606E">The same agent, now on your rules</text>

  <rect x="24" y="192" width="216" height="40" rx="10" fill="#FBFAF8" stroke="#E9E5DD"/>
  <text x="38" y="211" font-size="10" font-weight="700" fill="#0F172A">No shadow AI</text>
  <text x="38" y="225" font-size="7.5" fill="#55606E">No paste into a public chatbot</text>

  <rect x="24" y="242" width="216" height="38" rx="10" fill="#FBFAF8" stroke="#E9E5DD"/>
  <text x="38" y="259" font-size="10" font-weight="700" fill="#0F172A">People stay in charge</text>
  <text x="38" y="272" font-size="7.5" fill="#55606E">The human stays the decision-maker</text>

  <!-- ============ LAYER 2: YOUR AI LAYER ============ -->
  <rect x="322" y="8" width="256" height="280" rx="14" fill="#FFF6EF" fill-opacity="0.85" stroke="#F38318" stroke-opacity="0.55" stroke-width="1"/>
  <path d="M 322 22 A 14 14 0 0 1 336 8 L 564 8 A 14 14 0 0 1 578 22 L 322 22 Z" fill="#F38318"/>

  <text x="338" y="34" font-size="9.5" font-weight="700" fill="#C46610" letter-spacing="1.6">LAYER 2 · THE AI LAYER YOU OWN</text>
  <text x="338" y="48" font-size="8" fill="#55606E">One binary · self-hosted · centrally run</text>

  <!-- Model of your choice -->
  <rect x="338" y="62" width="224" height="34" rx="10" fill="#FFFFFF" stroke="#F38318" stroke-opacity="0.5"/>
  <text x="450" y="78" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">The model you choose</text>
  <text x="450" y="90" text-anchor="middle" font-size="7.5" fill="#55606E">Swap providers with a setting, not a rewrite</text>

  <!-- marketplace label -->
  <text x="450" y="113" text-anchor="middle" font-size="7" font-weight="700" fill="#8893A3" letter-spacing="1.4">CURATED ONCE · DELIVERED TO EVERY TEAM</text>

  <!-- Skills tile -->
  <rect x="338" y="120" width="110" height="44" rx="9" fill="#FFFFFF" stroke="#F38318" stroke-opacity="0.4"/>
  <text x="393" y="137" text-anchor="middle" font-size="9.5" font-weight="700" fill="#C46610">Skills</text>
  <text x="393" y="149" text-anchor="middle" font-size="7" fill="#55606E">reusable workflows</text>
  <text x="393" y="159" text-anchor="middle" font-size="7" fill="#55606E">scoped per team</text>

  <!-- MCP tile -->
  <rect x="452" y="120" width="110" height="44" rx="9" fill="#FFFFFF" stroke="#F38318" stroke-opacity="0.4"/>
  <text x="507" y="137" text-anchor="middle" font-size="9.5" font-weight="700" fill="#C46610">Connectors</text>
  <text x="507" y="149" text-anchor="middle" font-size="7" fill="#55606E">secure gateways</text>
  <text x="507" y="159" text-anchor="middle" font-size="7" fill="#55606E">to your systems</text>

  <!-- One rulebook -->
  <rect x="338" y="172" width="224" height="42" rx="10" fill="#FFFFFF" stroke="#F38318" stroke-opacity="0.5"/>
  <text x="450" y="189" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">One rulebook, every team</text>
  <text x="450" y="202" text-anchor="middle" font-size="7.5" fill="#55606E">role-scoped · versioned · enforced automatically</text>

  <!-- governed & audited supporting line -->
  <rect x="338" y="222" width="224" height="44" rx="10" fill="#F38318" fill-opacity="0.10" stroke="#F38318" stroke-opacity="0.4"/>
  <text x="450" y="238" text-anchor="middle" font-size="7" font-weight="700" fill="#C46610" letter-spacing="1.2">GOVERNED BEFORE IT RUNS</text>
  <text x="450" y="251" text-anchor="middle" font-size="7.5" fill="#55606E">Secrets injected server-side, never in the AI.</text>
  <text x="450" y="261" text-anchor="middle" font-size="7.5" fill="#55606E">Every action checked, logged, joined to a person.</text>

  <!-- ============ LAYER 1: YOUR SYSTEMS ============ -->
  <rect x="644" y="8" width="248" height="280" rx="14" fill="#FFFFFF" fill-opacity="0.7" stroke="#2A6FB5" stroke-opacity="0.4" stroke-width="1"/>
  <path d="M 644 22 A 14 14 0 0 1 658 8 L 878 8 A 14 14 0 0 1 892 22 L 644 22 Z" fill="#2A6FB5"/>

  <text x="660" y="34" font-size="9.5" font-weight="700" fill="#2A6FB5" letter-spacing="1.6">LAYER 1 · YOUR SYSTEMS</text>
  <text x="660" y="48" font-size="8" fill="#55606E">Your data · your process · your records</text>

  <rect x="660" y="62" width="216" height="44" rx="10" fill="#F4F8FC" stroke="#2A6FB5" stroke-opacity="0.35"/>
  <text x="768" y="82" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0F172A">Stays inside your perimeter</text>
  <text x="768" y="96" text-anchor="middle" font-size="7.5" fill="#55606E">Your data never leaves your control</text>

  <!-- object grid -->
  <rect x="660" y="116" width="104" height="34" rx="9" fill="#FFFFFF" stroke="#2A6FB5" stroke-opacity="0.28"/>
  <text x="712" y="133" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0F172A">CRM</text>
  <text x="712" y="145" text-anchor="middle" font-size="7" fill="#55606E">read · execute</text>

  <rect x="772" y="116" width="104" height="34" rx="9" fill="#FFFFFF" stroke="#2A6FB5" stroke-opacity="0.28"/>
  <text x="824" y="133" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0F172A">ERP &amp; finance</text>
  <text x="824" y="145" text-anchor="middle" font-size="7" fill="#55606E">read · execute</text>

  <rect x="660" y="156" width="104" height="34" rx="9" fill="#FFFFFF" stroke="#2A6FB5" stroke-opacity="0.28"/>
  <text x="712" y="173" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0F172A">Data warehouse</text>
  <text x="712" y="185" text-anchor="middle" font-size="7" fill="#55606E">read · execute</text>

  <rect x="772" y="156" width="104" height="34" rx="9" fill="#FFFFFF" stroke="#2A6FB5" stroke-opacity="0.28"/>
  <text x="824" y="173" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0F172A">Code &amp; docs</text>
  <text x="824" y="185" text-anchor="middle" font-size="7" fill="#55606E">read · execute</text>

  <!-- acts on live context -->
  <rect x="660" y="204" width="216" height="62" rx="10" fill="#2A6FB5" fill-opacity="0.07" stroke="#2A6FB5" stroke-opacity="0.3"/>
  <text x="768" y="221" text-anchor="middle" font-size="7" font-weight="700" fill="#2A6FB5" letter-spacing="1.6">THE AI ACTS ON</text>
  <text x="768" y="236" text-anchor="middle" font-size="9" font-weight="700" fill="#0F172A">Real, current context.</text>
  <text x="768" y="250" text-anchor="middle" font-size="7.5" fill="#55606E">Never stale exports · never blind spots.</text>
  <text x="768" y="260" text-anchor="middle" font-size="7.5" fill="#55606E">Every action logged and attributable.</text>

  <!-- ============ FLOW ARROWS ============ -->
  <!-- Person → Layer 2 -->
  <rect x="260" y="158" width="44" height="8" fill="#8893A3"/>
  <path d="M 304 150 L 316 162 L 304 174 Z" fill="#8893A3"/>
  <text x="282" y="144" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F172A" letter-spacing="1">INTENT</text>
  <text x="282" y="188" text-anchor="middle" font-size="7.5" fill="#55606E" font-family="ui-monospace, monospace">natural language</text>

  <!-- Layer 2 → Systems with governance boundary -->
  <rect x="584" y="158" width="18" height="8" fill="#8893A3"/>
  <rect x="604" y="136" width="6" height="52" fill="#F38318"/>
  <rect x="612" y="158" width="20" height="8" fill="#8893A3"/>
  <path d="M 632 150 L 644 162 L 632 174 Z" fill="#8893A3"/>
  <text x="607" y="124" text-anchor="middle" font-size="8" font-weight="700" fill="#C46610" letter-spacing="1">EVERY CALL CHECKED</text>
  <text x="607" y="206" text-anchor="middle" font-size="7" fill="#55606E" font-family="ui-monospace, monospace">governed tool call</text>

  <!-- Response paths -->
  <line x1="630" y1="248" x2="588" y2="248" stroke="#A8A29E" stroke-width="2" stroke-dasharray="4,3"/>
  <path d="M 588 243 L 578 248 L 588 253 Z" fill="#A8A29E"/>
  <text x="607" y="264" text-anchor="middle" font-size="7.5" fill="#8893A3" font-family="ui-monospace, monospace">result</text>

  <line x1="316" y1="248" x2="274" y2="248" stroke="#A8A29E" stroke-width="2" stroke-dasharray="4,3"/>
  <path d="M 274 243 L 264 248 L 274 253 Z" fill="#A8A29E"/>
  <text x="295" y="264" text-anchor="middle" font-size="7.5" fill="#8893A3" font-family="ui-monospace, monospace">answer</text>

  <!-- Caption -->
  <text x="450" y="315" text-anchor="middle" font-size="9" font-weight="700" fill="#0F172A" letter-spacing="1.4">ONE LAYER · EVERY TEAM · FIRST-CLASS EXECUTION ON YOUR SYSTEMS</text>
  <line x1="270" y1="324" x2="630" y2="324" stroke="#F38318" stroke-width="1.5"/>
</svg>
