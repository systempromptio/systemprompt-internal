# Astound Digital desktop bridge — a white-label build of the systemprompt
# bridge. This is a STANDALONE crate (its own `[workspace]`), mirroring
# systemprompt-core/bin/bridge: it must not be pulled into the main server
# workspace (it carries GUI deps for Windows/macOS) and ships on its own
# release cadence.
[workspace]

[package]
name = "astound-bridge"
version = "0.1.0"
edition = "2024"
authors = ["Astound Digital <ed@tyingshoelaces.com>"]
license = "MIT"
description = "Astound Digital desktop bridge — branded build of the systemprompt bridge."
publish = false
build = "build.rs"

[[bin]]
name = "astound-bridge"
path = "src/main.rs"

[dependencies]
# Path dep on the core bridge library. The core crate resolves its own
# systemprompt-* deps via relative paths, so no [patch.crates-io] is needed
# here. The `brand` module + `run_with_brand` entry point come from this crate.
systemprompt-bridge = { path = "../../systemprompt-core/bin/bridge" }

[build-dependencies]
winresource = "0.1"

# Standalone workspace, so it cannot inherit the root [workspace.lints] — this
# mirrors the root deny set. Keep in lockstep with the root Cargo.toml.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
suspicious = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
exit = "deny"
mem_forget = "deny"
allow_attributes_without_reason = "warn"

# This is a standalone workspace, so it does NOT inherit core's release profile.
# Without this block the binary builds with cargo defaults (opt-level=3, no LTO,
# 16 codegen units, unstripped) — ~30% larger. Mirror the size-optimised profile
# from systemprompt-core/bin/bridge so the shipped white-label binary matches.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
