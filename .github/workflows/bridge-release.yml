name: Release — build & publish bridge binaries

# Builds the desktop bridge for Linux (x86_64 + aarch64), macOS (Apple
# Silicon), and Windows, and publishes them as GitHub Release assets.
#
# Asset names are load-bearing and version-less so that
# releases/latest/download/<asset> URLs stay stable. Keep them in lockstep
# with: DOWNLOAD_BASE_URL in
# extensions/web/admin/src/handlers/ssr/ssr_bridge_setup.rs, the ARTIFACTS map
# in storage/files/js/pages/admin-bridge-setup.js, the links in
# storage/files/admin/templates/bridge-setup.hbs, and
# scripts/package-bridge-linux.sh.
#
# The bridge crate depends on systemprompt-bridge by path
# (../../systemprompt-core/bin/bridge), which is not on crates.io — so every
# job checks out systempromptio/systemprompt-core as a sibling directory,
# pinned to the ref in bridge/CORE_REF. Bump that file when adopting a new
# core version.

on:
  push:
    tags: ["bridge-v*"]
  workflow_dispatch:
    inputs:
      bridge_tag:
        description: "Bridge release tag (e.g. bridge-v0.1.0) — for re-runs without retagging"
        required: true

concurrency:
  group: bridge-release-${{ github.event.inputs.bridge_tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Quality gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: systemprompt-internal
      - name: Read pinned core ref
        id: core
        run: echo "ref=$(tr -d '[:space:]' < systemprompt-internal/bridge/CORE_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: systempromptio/systemprompt-core
          ref: ${{ steps.core.outputs.ref }}
          path: systemprompt-core
      # keyring → dbus-secret-service → libdbus-sys builds from pkg-config.
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      # Scope the gate to the bridge crate: it is a standalone workspace, and
      # unrelated churn elsewhere must not block a bridge release.
      - run: cargo fmt --manifest-path systemprompt-internal/bridge/Cargo.toml -p systemprompt-internal-bridge -- --check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: systemprompt-internal/bridge
      - run: cargo clippy --manifest-path systemprompt-internal/bridge/Cargo.toml --all-targets -- -D warnings

  build:
    name: Build ${{ matrix.asset }}
    needs: checks
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04: oldest supported runner glibc, so the binaries run
          # on as many distributions as possible.
          - runner: ubuntu-22.04
            asset: systemprompt-internal-bridge-linux-x86_64.tar.gz
            arch: x86_64
          - runner: ubuntu-22.04-arm
            asset: systemprompt-internal-bridge-linux-aarch64.tar.gz
            arch: aarch64
          - runner: macos-14
            asset: systemprompt-internal-bridge-macos.dmg
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - runner: windows-latest
            asset: systemprompt-internal-bridge-windows.exe
    steps:
      - uses: actions/checkout@v4
        with:
          path: systemprompt-internal
      - name: Read pinned core ref
        id: core
        shell: bash
        run: echo "ref=$(tr -d '[:space:]' < systemprompt-internal/bridge/CORE_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: systempromptio/systemprompt-core
          ref: ${{ steps.core.outputs.ref }}
          path: systemprompt-core
      - name: Install libdbus (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      # Deliberately no build cache in the release job. A warm target/ served
      # the Linux 0.1.3 build a binary predating the overlay fix, so the
      # published artifact would not have matched the tag it was cut from —
      # the macOS jobs escaped only because their --target dirs were cold.
      # A signed release is worth the extra few minutes of a cold build.

      # SYSTEMPROMPT_BRIDGE_WEB_OVERLAY is set here rather than left to
      # bridge/.cargo/config.toml, which cargo only discovers when the working
      # directory is inside bridge/. Building from the workspace root skipped
      # it, so every release up to bridge-v0.1.2 shipped core's stock GUI
      # instead of the white-label overlay. Setting it explicitly also keeps
      # the workspace root as the cwd, so systemprompt-internal/rust-toolchain.toml
      # does not override the toolchain this job installed targets for.
      - name: Build release binary
        if: runner.os != 'macOS'
        shell: bash
        env:
          SYSTEMPROMPT_BRIDGE_WEB_OVERLAY: ${{ github.workspace }}/systemprompt-internal/bridge/web
        run: cargo build --manifest-path systemprompt-internal/bridge/Cargo.toml --release --locked

      # Both slices, so make-mac-app.sh --universal can lipo them into one
      # universal2 executable: the runner is Apple Silicon, but the .dmg has to
      # run on Intel Macs too.
      - name: Build release binaries (macos, universal2)
        if: runner.os == 'macOS'
        env:
          SYSTEMPROMPT_BRIDGE_WEB_OVERLAY: ${{ github.workspace }}/systemprompt-internal/bridge/web
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --manifest-path systemprompt-internal/bridge/Cargo.toml \
              --release --locked --target "$target"
          done

      # The overlay leaves no trace in the build log — it either got compiled
      # in or it did not. Assert on a string only the overlay carries, so a
      # release can never again quietly lose the branding.
      - name: Verify the brand overlay was compiled in
        shell: bash
        working-directory: systemprompt-internal/bridge
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN=target/release/systemprompt-internal-bridge.exe
          elif [ "${{ runner.os }}" = "macOS" ]; then
            BIN=target/aarch64-apple-darwin/release/systemprompt-internal-bridge
          else
            BIN=target/release/systemprompt-internal-bridge
          fi
          if ! grep -qa "systemprompt.io brand overrides for the bridge GUI" "$BIN"; then
            echo "::error::$BIN has no brand overlay — SYSTEMPROMPT_BRIDGE_WEB_OVERLAY was not applied."
            exit 1
          fi
          echo "brand overlay present in $BIN"

      - name: Package tarball (linux)
        if: runner.os == 'Linux'
        run: |
          ASSET_ARCH=${{ matrix.arch }} SKIP_BUILD=1 PUBLISH=0 \
            systemprompt-internal/scripts/package-bridge-linux.sh
          cp systemprompt-internal/dist/${{ matrix.asset }} "${{ matrix.asset }}"

      # A fork, or this repo before the Apple secrets were configured, still
      # produces a working (if unsigned) dmg rather than a red build.
      - name: Detect Apple signing credentials (macos)
        id: signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
        run: |
          if [[ -n "$APPLE_CERT_P12_BASE64" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple signing secrets are absent — publishing an UNSIGNED macOS build."
          fi

      - name: Import signing identity (macos)
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Default is a 5-minute idle lock, which expires mid-notarization.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$APPLE_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this codesign blocks on a GUI prompt for the private key.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          # Prepend, keeping the system keychains searchable for the Apple roots.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

          echo "$APPLE_API_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/notary.p8"
          chmod 600 "$RUNNER_TEMP/notary.p8"

      - name: Package .app (macos)
        if: runner.os == 'macOS'
        run: systemprompt-internal/bridge/scripts/make-mac-app.sh --universal

      # Sign and staple the bundle before it goes into the dmg, so the ticket
      # travels with the app itself and first launch works offline.
      - name: Sign & notarize .app (macos)
        if: steps.signing.outputs.enabled == 'true'
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          NOTARY_KEY="$RUNNER_TEMP/notary.p8" \
            systemprompt-internal/bridge/scripts/sign-mac-app.sh \
            "systemprompt-internal/bridge/target/release/Systemprompt Internal Bridge.app"

      - name: Build dmg (macos)
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname "Systemprompt Internal Bridge" \
            -srcfolder "systemprompt-internal/bridge/target/release/Systemprompt Internal Bridge.app" \
            -format UDZO "${{ matrix.asset }}"

      - name: Sign & notarize dmg (macos)
        if: steps.signing.outputs.enabled == 'true'
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          NOTARY_KEY="$RUNNER_TEMP/notary.p8" \
            systemprompt-internal/bridge/scripts/sign-mac-app.sh "${{ matrix.asset }}"

      - name: Tear down signing keychain (macos)
        if: always() && runner.os == 'macOS'
        run: |
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Rename output (windows)
        if: runner.os == 'Windows'
        run: Copy-Item "systemprompt-internal\bridge\target\release\systemprompt-internal-bridge.exe" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Sign & publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.inputs.bridge_tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          path: systemprompt-internal

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Add installer
        run: install -m 0755 systemprompt-internal/scripts/install-bridge.sh dist/install.sh

      - name: Generate checksums
        working-directory: dist
        run: sha256sum systemprompt-internal-bridge-* install.sh > SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifacts (keyless)
        working-directory: dist
        run: |
          for f in systemprompt-internal-bridge-* install.sh SHA256SUMS; do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "${f}"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: |
            ## Systemprompt Internal Bridge ${{ steps.tag.outputs.tag }}

            Desktop bridge for Claude Code, Claude Desktop, and Codex CLI —
            connects them to the Systemprompt Internal governance gateway.

            ### Install (Linux)

            ```bash
            curl -fsSL https://github.com/systempromptio/systemprompt-internal/releases/latest/download/install.sh | sh -s -- --code <code>
            ```

            ### macOS

            The dmg is a universal2 build (Apple Silicon + Intel), signed with
            our Developer ID, notarized by Apple and stapled — mount it, drag
            the app to Applications, and open it. No quarantine flag to clear.

            Check the signature yourself:

            ```bash
            spctl --assess --type open --context context:primary-signature -vv systemprompt-internal-bridge-macos.dmg
            codesign -dv --verbose=4 "/Applications/Systemprompt Internal Bridge.app"
            ```

            ### Windows

            Binaries are unsigned. Choose "More info → Run anyway" at the
            SmartScreen prompt.

            ### Verifying a signature (cosign keyless)

            ```bash
            cosign verify-blob \
              --certificate-identity-regexp='https://github.com/systempromptio/systemprompt-internal/' \
              --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
              --signature systemprompt-internal-bridge-linux-x86_64.tar.gz.sig \
              --certificate systemprompt-internal-bridge-linux-x86_64.tar.gz.pem \
              systemprompt-internal-bridge-linux-x86_64.tar.gz
            ```
          files: |
            dist/systemprompt-internal-bridge-*
            dist/install.sh
            dist/install.sh.sig
            dist/install.sh.pem
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/SHA256SUMS.pem
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
