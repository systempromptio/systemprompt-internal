name: CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or branch to gate. Defaults to the triggering ref."
        type: string
        required: false
  pull_request:
    branches: [main, next]

concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  # Why: transient TLS resets from static.rust-lang.org and crates.io fail a run
  # on infrastructure rather than on the code. rustup and cargo both retry when
  # told to; they do not by default.
  RUSTUP_MAX_RETRIES: "10"
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  SQLX_OFFLINE: "true"
  # aws-lc-sys refuses to build with GCC <10 (bug #95189) and the release
  # profile's LTO trips it; ubuntu-latest ships clang, so force it everywhere
  # this repo compiles C. Mirrors the CC/CXX toggle in the justfile build recipe.
  CC: clang
  CXX: clang++

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      # bridge/ depends on systemprompt-bridge by path, which is not published
      # to crates.io at all. Materialise the sibling core checkout at the ref
      # bridge/CORE_REF pins: checkout must land inside the workspace, so link
      # it into place. The root workspace itself builds from crates.io -- its
      # this sibling via [patch.crates-io]; after pin-flip it builds from crates.io.
      - name: Read pinned core ref
        id: core
        run: echo "ref=$(tr -d '[:space:]' < bridge/CORE_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: systempromptio/systemprompt-core
          ref: ${{ steps.core.outputs.ref }}
          path: .core-sibling
      - name: Link sibling core beside the workspace
        run: ln -sfn "$GITHUB_WORKSPACE/.core-sibling" "$GITHUB_WORKSPACE/../systemprompt-core"
      # rust-toolchain.toml pins the channel and its components; `rustup show`
      # installs exactly that toolchain, so fmt runs on the same version
      # developers use locally with no channel duplicated in this file.
      - run: rustup show
      - run: cargo fmt --all -- --check
      # tests/ is excluded from the root workspace, so --all does not reach it.
      - run: cargo fmt --manifest-path tests/Cargo.toml --all -- --check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      # bridge/ depends on systemprompt-bridge by path, which is not published
      # to crates.io at all. Materialise the sibling core checkout at the ref
      # bridge/CORE_REF pins: checkout must land inside the workspace, so link
      # it into place. The root workspace itself builds from crates.io -- its
      # this sibling via [patch.crates-io]; after pin-flip it builds from crates.io.
      - name: Read pinned core ref
        id: core
        run: echo "ref=$(tr -d '[:space:]' < bridge/CORE_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: systempromptio/systemprompt-core
          ref: ${{ steps.core.outputs.ref }}
          path: .core-sibling
      - name: Link sibling core beside the workspace
        run: ln -sfn "$GITHUB_WORKSPACE/.core-sibling" "$GITHUB_WORKSPACE/../systemprompt-core"
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

  sqlx-check:
    name: SQLx Offline Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      # bridge/ depends on systemprompt-bridge by path, which is not published
      # to crates.io at all. Materialise the sibling core checkout at the ref
      # bridge/CORE_REF pins: checkout must land inside the workspace, so link
      # it into place. The root workspace itself builds from crates.io -- its
      # this sibling via [patch.crates-io]; after pin-flip it builds from crates.io.
      - name: Read pinned core ref
        id: core
        run: echo "ref=$(tr -d '[:space:]' < bridge/CORE_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: systempromptio/systemprompt-core
          ref: ${{ steps.core.outputs.ref }}
          path: .core-sibling
      - name: Link sibling core beside the workspace
        run: ln -sfn "$GITHUB_WORKSPACE/.core-sibling" "$GITHUB_WORKSPACE/../systemprompt-core"
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Every extension crate that invokes a sqlx query macro must ship a
      # committed .sqlx/ cache so the -D warnings offline build above is
      # reproducible.
      - name: Verify offline sqlx cache is current
        run: bash scripts/check-sqlx-cache.sh
      - run: cargo check --workspace --locked

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: workspace 1/3
            partition: "count:1/3"
          - name: workspace 2/3
            partition: "count:2/3"
          - name: workspace 3/3
            partition: "count:3/3"
          - name: admin
            command: cargo nextest run -p systemprompt-web-admin --tests
          - name: web assets
            command: cargo nextest run -p systemprompt-web-extension --tests
    # The test workspace verifies behaviour; linting it is quality.yml's job,
    # so it does not inherit the -D warnings RUSTFLAGS.
    env:
      RUSTFLAGS: ""
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      # bridge/ depends on systemprompt-bridge by path, which is not published
      # to crates.io at all. Materialise the sibling core checkout at the ref
      # bridge/CORE_REF pins: checkout must land inside the workspace, so link
      # it into place. The root workspace itself builds from crates.io -- its
      # this sibling via [patch.crates-io]; after pin-flip it builds from crates.io.
      - name: Read pinned core ref
        id: core
        run: echo "ref=$(tr -d '[:space:]' < bridge/CORE_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: systempromptio/systemprompt-core
          ref: ${{ steps.core.outputs.ref }}
          path: .core-sibling
      - name: Link sibling core beside the workspace
        run: ln -sfn "$GITHUB_WORKSPACE/.core-sibling" "$GITHUB_WORKSPACE/../systemprompt-core"
      - run: rustup show
      # Why: every matrix entry compiles the same dependency graph, so they must
      # share one cache key rather than each keying on its own job name.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          workspaces: |
            .
            tests
      # Several integration tests drive process-global state and are only
      # correct when each test owns its process. `cargo test` threads them into
      # one process, where they race and fail; nextest is what `just test-*`
      # runs, so CI must match it.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # The integration crates are a self-contained throwaway-database harness:
      # they connect to the maintenance DB, CREATE DATABASE a per-test schema,
      # and drop it on teardown. All they need is a reachable Postgres.
      # The contract suite's fixture profile validates paths.bin points at an
      # existing directory; nothing in this job builds the root workspace, so
      # create it.
      - run: mkdir -p target/debug
      # The e2e suite spawns the real odoo and agent MCP binaries; without
      # it the test would self-skip, and in CI it asserts instead of skipping.
      - name: Build the MCP binaries the e2e suite spawns
        if: matrix.partition
        run: cargo build -p systemprompt-mcp-odoo -p systemprompt-mcp-agent --locked
      - name: Run the tests workspace partition (unit, integration, contract, e2e)
        if: matrix.partition
        env:
          SYSTEMPROMPT_TEST_DATABASE_URL: postgres://test:test@localhost:5432/postgres
        run: cargo nextest run --manifest-path tests/Cargo.toml --workspace --partition ${{ matrix.partition }}
      - name: Run ${{ matrix.name }} tests
        if: matrix.command
        env:
          SYSTEMPROMPT_TEST_DATABASE_URL: postgres://test:test@localhost:5432/postgres
        run: ${{ matrix.command }}

  bridge:
    name: Bridge (standalone workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          path: systemprompt-internal
      # The bridge depends on systemprompt-core/bin/bridge by sibling path
      # (not on crates.io), pinned to the ref in bridge/CORE_REF — the same
      # layout the bridge-release workflow uses.
      - name: Read pinned core ref
        id: core
        run: echo "ref=$(tr -d '[:space:]' < systemprompt-internal/bridge/CORE_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: systempromptio/systemprompt-core
          ref: ${{ steps.core.outputs.ref }}
          path: systemprompt-core
      # keyring → dbus-secret-service → libdbus-sys builds from pkg-config.
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: rustup show
        working-directory: systemprompt-internal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: systemprompt-internal/bridge
      - run: cargo check --manifest-path systemprompt-internal/bridge/Cargo.toml --locked

  # One stable context for the `main` ruleset: it fails unless every job above
  # succeeded, so a skipped or cancelled matrix job can never pass as "not
  # failed". The ruleset names this job, never the matrix entries.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [fmt, build, sqlx-check, test, bridge]
    if: always()
    steps:
      - run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")' >/dev/null \
            || { echo "::error::a required CI job did not succeed"; echo '${{ toJSON(needs) }}' | jq '.'; exit 1; }
