name: Docker

# Builds ghcr.io/systempromptio/systemprompt-internal — the gateway image
# Docker deployments pull — and publishes it ONLY as :sha-<short>, signed,
# returning its digest. Called from release.yml on every merge to main, or
# dispatched by hand to rebuild the current ref.
#
#   :sha-<short>        written here, for every build
#   :X.Y.Z :X.Y :X      written by release.yml's promote-tags, and only after
#   :latest             smoke and upgrade-boot passed on this exact digest
#
# Why: a versioned tag is what operators pull, so it may only ever point at a
# digest that already booted over every seeded release schema. Tagging here,
# before any proof, published a :latest that nothing had run.
#
# Multi-arch is built natively per-arch (amd64 + arm64 runners), pushed by
# digest, then merged into one manifest list — QEMU cross-building the Rust
# workspace is too slow to be practical. The image builds against the core
# checkout bridge/CORE_REF names, materialised inside the build context as
# .core-sibling and moved beside /src by the Dockerfile so the workspace's
# ../systemprompt-core paths resolve exactly as they do in CI.

on:
  workflow_call:
    inputs:
      version:
        description: "Semver (X.Y.Z) this build is for — set by release.yml; checked, not tagged"
        required: true
        type: string
    outputs:
      digest:
        description: "Manifest-list digest (sha256:…) of the signed :sha-<short> image"
        value: ${{ jobs.merge.outputs.digest }}
      short:
        description: "The <short> in :sha-<short>"
        value: ${{ jobs.merge.outputs.short }}
  workflow_dispatch:
    inputs:
      version:
        description: "Semver (X.Y.Z) this build is for (checked, not tagged)"
        required: true

concurrency:
  group: docker-${{ inputs.version }}
  cancel-in-progress: true

env:
  # Why: transient TLS resets from static.rust-lang.org and crates.io fail a run
  # on infrastructure rather than on the code. rustup and cargo both retry when
  # told to; they do not by default.
  RUSTUP_MAX_RETRIES: "10"
  CARGO_NET_RETRY: "10"
  IMAGE: ghcr.io/systempromptio/systemprompt-internal

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned core ref
        id: core
        run: echo "ref=$(tr -d '[:space:]' < bridge/CORE_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: systempromptio/systemprompt-core
          ref: ${{ steps.core.outputs.ref }}
          path: .core-sibling

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest, tag :sha, sign
    needs: build
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      short: ${{ steps.ver.outputs.short }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version tags
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="$INPUT_VERSION"
          case "$v" in
            *[!0-9.]*|*..*|.*|*.) echo "::error::'$v' is not a plain semver"; exit 1 ;;
          esac
          {
            echo "full=$v"
            echo "short=${GITHUB_SHA:0:7}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=sha-${{ steps.ver.outputs.short }}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}') \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Resolve manifest digest
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-${{ steps.ver.outputs.short }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3

      - name: Cosign sign (keyless)
        run: cosign sign --yes "$IMAGE@${{ steps.digest.outputs.digest }}"

      # Why --entrypoint: the image's entrypoint refuses to start without an
      # API key and DATABASE_URL, which is right for a deployment and wrong
      # for proving the binary inside the manifest runs. The full proof
      # (arches, signature, MCP binaries, boot over every release schema) is
      # release.yml's smoke and upgrade-boot, before any version tag moves.
      - name: Smoke the built image
        run: |
          docker run --rm --platform linux/amd64 --entrypoint /app/bin/systemprompt \
            "$IMAGE@${{ steps.digest.outputs.digest }}" --version
