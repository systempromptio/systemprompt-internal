name: Quality

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or branch to gate. Defaults to the triggering ref."
        type: string
        required: false
  # release.yml calls this on the merge commit before it publishes anything.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
  pull_request:
    branches: [main, next]

concurrency:
  group: quality-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  # Why: transient TLS resets from static.rust-lang.org and crates.io fail a run
  # on infrastructure rather than on the code. rustup and cargo both retry when
  # told to; they do not by default.
  RUSTUP_MAX_RETRIES: "10"
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  # aws-lc-sys needs clang (GCC <10 bug #95189); ubuntu-latest ships it.
  CC: clang
  CXX: clang++

jobs:
  clippy:
    name: Clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      # The root workspace's [patch.crates-io] is ACTIVE and points at
      # ../systemprompt-core (core release with the wire-shape work is not on
      # crates.io yet). Materialise the sibling at the ref bridge/CORE_REF
      # pins: checkout must land inside the workspace, so link it into place.
      - name: Read pinned core ref
        id: core
        run: echo "ref=$(tr -d '[:space:]' < bridge/CORE_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: systempromptio/systemprompt-core
          ref: ${{ steps.core.outputs.ref }}
          path: .core-sibling
      - name: Link sibling core beside the workspace
        run: ln -sfn "$GITHUB_WORKSPACE/.core-sibling" "$GITHUB_WORKSPACE/../systemprompt-core"
      # Clippy runs on the pinned toolchain declared in rust-toolchain.toml,
      # which `rustup show` installs — so lint results match local `just clippy`
      # with no channel duplicated here.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # No --all-targets on the root workspace: it would lint the in-crate
      # tests/ dirs under extensions/, which relax unwrap/expect like the tests
      # workspace does. Mirrors the `just clippy` invocation exactly.
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo clippy --manifest-path tests/Cargo.toml --workspace

  docs:
    name: Rustdoc (warnings as errors)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      # The root workspace's [patch.crates-io] is ACTIVE and points at
      # ../systemprompt-core (core release with the wire-shape work is not on
      # crates.io yet). Materialise the sibling at the ref bridge/CORE_REF
      # pins: checkout must land inside the workspace, so link it into place.
      - name: Read pinned core ref
        id: core
        run: echo "ref=$(tr -d '[:space:]' < bridge/CORE_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: systempromptio/systemprompt-core
          ref: ${{ steps.core.outputs.ref }}
          path: .core-sibling
      - name: Link sibling core beside the workspace
        run: ln -sfn "$GITHUB_WORKSPACE/.core-sibling" "$GITHUB_WORKSPACE/../systemprompt-core"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  source-gates:
    name: Source gates (same list as `just lint-gates`)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      # check-bridge-overlay-drift compares our bridge overlay against core's
      # GUI tree, so this job needs the sibling too — the bridge takes
      # systemprompt-bridge by relative path and it is not a published crate.
      - name: Read pinned core ref
        id: core
        run: echo "ref=$(tr -d '[:space:]' < bridge/CORE_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: systempromptio/systemprompt-core
          ref: ${{ steps.core.outputs.ref }}
          path: .core-sibling
      - name: Link sibling core beside the workspace
        run: ln -sfn "$GITHUB_WORKSPACE/.core-sibling" "$GITHUB_WORKSPACE/../systemprompt-core"
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # check-fork-drift skips cleanly without SIBLING_REPO; check-bridge-overlay-drift
      # needs the core sibling checked out above; every other gate is a
      # read-only source check.
      - run: BUILD_NO_COORD=1 just lint-gates

  msrv:
    name: MSRV check (rust-version from Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      # The root workspace's [patch.crates-io] is ACTIVE and points at
      # ../systemprompt-core (core release with the wire-shape work is not on
      # crates.io yet). Materialise the sibling at the ref bridge/CORE_REF
      # pins: checkout must land inside the workspace, so link it into place.
      - name: Read pinned core ref
        id: core
        run: echo "ref=$(tr -d '[:space:]' < bridge/CORE_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: systempromptio/systemprompt-core
          ref: ${{ steps.core.outputs.ref }}
          path: .core-sibling
      - name: Link sibling core beside the workspace
        run: ln -sfn "$GITHUB_WORKSPACE/.core-sibling" "$GITHUB_WORKSPACE/../systemprompt-core"
      # Why read, not written here: Cargo.toml's rust-version is the MSRV.
      # This job once hardcoded 1.94 after the manifest said 1.96 and failed
      # every run until someone noticed; scripts/check-msrv.sh reads the
      # same field, so local and CI can no longer disagree.
      - name: Read the MSRV from Cargo.toml
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          [ -n "$v" ] || { echo "::error::no rust-version in Cargo.toml"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # `rust-toolchain.toml` pins a nightly, and a toolchain file overrides
      # rustup's default — so a bare `cargo check` here silently ran that
      # nightly and this job never tested the MSRV at all. `+<msrv>` overrides
      # the file; the assertion is what stops it drifting back, because the
      # failure mode is a job that passes while proving nothing.
      - name: Assert the MSRV toolchain is the one actually in use
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: |
          set -euo pipefail
          actual=$(cargo "+$MSRV" --version)
          echo "cargo: $actual"
          case "$actual" in
            "cargo $MSRV"*) ;;
            *) echo "::error::expected cargo $MSRV, got: $actual" >&2; exit 1 ;;
          esac
      - env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo "+$MSRV" check --workspace

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: cargo-deny (licenses, bans, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      # The root workspace's [patch.crates-io] is ACTIVE and points at
      # ../systemprompt-core (core release with the wire-shape work is not on
      # crates.io yet). Materialise the sibling at the ref bridge/CORE_REF
      # pins: checkout must land inside the workspace, so link it into place.
      - name: Read pinned core ref
        id: core
        run: echo "ref=$(tr -d '[:space:]' < bridge/CORE_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: systempromptio/systemprompt-core
          ref: ${{ steps.core.outputs.ref }}
          path: .core-sibling
      - name: Link sibling core beside the workspace
        run: ln -sfn "$GITHUB_WORKSPACE/.core-sibling" "$GITHUB_WORKSPACE/../systemprompt-core"
      # Plain runner invocation, not cargo-deny-action: the action runs in a
      # container that mounts only the workspace, so the sibling link above
      # does not exist inside it and the patched graph cannot resolve.
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  machete:
    name: Unused dependency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete
